<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rev Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>:root {
  color-scheme: dark;
  --ink: #07060d;
  --panel: #100e1a;
  --panel-2: #161327;
  --line: #262238;
  --text: #ece9f7;
  --muted: #8e88aa;
  --accent: #c9b8ff;
  --warn: #ffb454;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
}

body {
  font-size: 14px;
  line-height: 1.4;
}

button, input, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#app {
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "multbar multbar"
    "stage panel";
}

@media (max-width: 820px) {
  #app {
    height: auto;
    min-height: 100%;
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(46vh, auto) auto;
    grid-template-areas:
      "multbar"
      "stage"
      "panel";
  }
}

/* ---------- multbar ---------- */

#multbar {
  grid-area: multbar;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  min-height: 20px;
}

.multbar-chips {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  overflow-x: auto;
}

.help-btn {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 600;
  line-height: 1;
  padding: 0;
}

.help-btn:hover { color: var(--text); border-color: var(--muted); }

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  white-space: nowrap;
  color: var(--muted);
}

.chip.grey { color: var(--muted); border-color: var(--line); }

/* ---------- stage / canvas ---------- */

#stage {
  grid-area: stage;
  position: relative;
  overflow: hidden;
  background: var(--ink);
  min-height: 0;
}

#orbits {
  display: block;
  width: 100%;
  height: 100%;
}

#scorebox {
  position: absolute;
  left: 16px;
  bottom: 16px;
  pointer-events: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
}

#score {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 48px);
  letter-spacing: -0.01em;
}

#income {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-size: 14px;
  margin-top: 2px;
}

#infinity-btn {
  pointer-events: auto;
  margin-top: 10px;
}

/* ---------- panel / tabs ---------- */

#panel {
  grid-area: panel;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-left: 1px solid var(--line);
}

@media (max-width: 820px) {
  #panel { border-left: none; border-top: 1px solid var(--line); }
}

#tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 12px 16px 0;
  border-bottom: 1px solid var(--line);
}

.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  border-bottom: none;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
}

.tab-btn:hover { color: var(--text); }

.tab-btn[aria-selected="true"] {
  color: var(--text);
  border-color: var(--line);
  background: var(--panel-2);
}

#tab-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
}

.tab-body-inner > * + * { margin-top: 14px; }

h2.section-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 0;
  color: var(--text);
}

p.help {
  color: var(--muted);
  margin: 0;
}

/* ---------- buy mode segmented control ---------- */

#buy-mode {
  display: flex;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  width: fit-content;
}

#buy-mode button {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
}

#buy-mode button[aria-pressed="true"] {
  background: var(--panel-2);
  color: var(--text);
}

/* ---------- circle rows ---------- */

.circle-row {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
}

.circle-row.locked {
  opacity: 0.5;
  grid-template-columns: 12px 1fr;
}

.swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: 0 0 8px 1px currentColor;
}

.circle-info { min-width: 0; }

.circle-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
}

.circle-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  margin-top: 2px;
}

.circle-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: stretch;
}

/* ---------- buttons ---------- */

.btn {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
}

.btn:hover:not(:disabled) { border-color: var(--muted); }

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn.affordable {
  color: var(--circle, var(--accent));
  border-color: var(--circle, var(--accent));
}

.btn.primary {
  color: var(--accent);
  border-color: var(--accent);
}

.btn.ascend {
  color: var(--ink);
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 16px 2px rgba(201, 184, 255, 0.55);
  animation: ascend-pulse 2.2s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  .btn.ascend { animation: none; }
}

@keyframes ascend-pulse {
  0%, 100% { box-shadow: 0 0 12px 1px rgba(201, 184, 255, 0.45); }
  50% { box-shadow: 0 0 22px 4px rgba(201, 184, 255, 0.75); }
}

.btn.confirming {
  color: var(--warn);
  border-color: var(--warn);
}

.btn.full-width { width: 100%; }

/* ---------- prestige / promote ---------- */

.stat-line {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

.stat-line .label { color: var(--muted); font-family: var(--font-body); }

.card {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--panel-2);
}

.card + .card { margin-top: 10px; }

.card-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 6px;
}

/* ---------- stats / settings ---------- */

.kv-list { display: flex; flex-direction: column; gap: 6px; }

textarea.save-area {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-mono);
  padding: 8px;
}

.error-text { color: var(--warn); font-size: 12px; min-height: 1em; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- modal / toast ---------- */

#modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4, 3, 8, 0.75);
  z-index: 20;
  padding: 16px;
}

#modal[hidden] { display: none; }

.modal-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

.modal-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  margin: 0 0 12px;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(8px);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 30;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

#toast[hidden] { display: none; }

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  #toast { transition: none; }
}

/* ---------- tooltip ---------- */

#tip {
  position: fixed;
  z-index: 40;
  left: 0;
  top: 0;
  max-width: 260px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

#tip[hidden] { display: none; }

#tip.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  #tip { transition: none; }
}

/* ---------- intro modal beats ---------- */

.help-beat {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.help-glyph {
  flex: none;
  width: 16px;
  height: 16px;
  margin-top: 2px;
  border-radius: 50%;
  border: 2px solid;
  background: transparent;
}

.help-beat-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
}

.help-beat-body {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}

.help-intro-actions {
  margin-top: 4px;
}

/* ---------- tab label / icon collapse (Stats, Settings < 420px) ---------- */

.tab-icon {
  display: none;
  align-items: center;
  justify-content: center;
}

.tab-icon svg { display: block; }

@media (max-width: 419px) {
  .tab-label { display: none; }
  .tab-icon { display: inline-flex; }
}

/* ---------- catch-up overlay (offline / hidden-tab, non-blocking) ---------- */

.progress-bar {
  height: 10px;
  margin: 14px 0 8px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.15s ease;
}

/* ---------- ∞ tab ---------- */

.inf-header {
  position: sticky;
  top: -16px;
  margin: -16px -16px 0;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

.inf-subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.sub-tab-btn {
  padding: 6px 10px;
  font-size: 12px;
}

.inf-tree {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.iu-col-label {
  font-family: var(--font-mono);
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 6px;
}

.iu-col.preview { opacity: 0.5; }

.iu-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.iu-card {
  min-height: 40px;
  min-width: 0;
  font-size: 12px;
  text-align: left;
  cursor: default;
  overflow-wrap: anywhere;
}

.iu-card.owned { border-color: var(--accent); }

.iu-card.buyable {
  cursor: pointer;
  border-color: var(--accent);
  box-shadow: 0 0 12px 2px var(--accent);
}

.iu-card.buyable:hover { box-shadow: 0 0 18px 3px var(--accent); }

.iu-card.locked { opacity: 0.5; }

.iu-cost, .iu-effect, .iu-locked {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  margin-top: 2px;
  font-size: 11px;
}

.inf-gens {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gp-line { font-family: var(--font-mono); }

.gen-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
}

.gen-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
}

.gen-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
</style>
</head>
<body>

<div id="app">
  <header id="multbar" aria-label="Multipliers"></header>
  <main id="stage"><canvas id="orbits" aria-label="Orbiting circles"></canvas>
    <div id="scorebox"><div id="score">0</div><div id="income">0 /s</div></div></main>
  <aside id="panel">
    <nav id="tabs" role="tablist"></nav>
    <section id="tab-body"></section>
  </aside>
  <div id="modal" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>
<script>// Rev Idle engine — pure state + formulas + tick + (later) serialize.
// UMD-ish: module.exports in Node, window.Engine in browser.
// Structured so Task 2 (ascension/prestige/promotions/serialize) can add
// functions and slot them into the returned Engine object below.

const Engine = (() => {
  const CIRCLES = [
    { name: 'Red', color: '#ff3b4f', initCost: 4, costMult: 1.20, baseSpeed: 0.2 },
    { name: 'Orange', color: '#ff8a2a', initCost: 100, costMult: 1.24, baseSpeed: 0.1 },
    { name: 'Yellow', color: '#ffd93b', initCost: 1e3, costMult: 1.28, baseSpeed: 1 / 15 },
    { name: 'Green', color: '#4dff6a', initCost: 1e4, costMult: 1.32, baseSpeed: 0.05 },
    { name: 'Turquoise', color: '#2affc6', initCost: 1e6, costMult: 1.36, baseSpeed: 0.04 },
    { name: 'Cyan', color: '#2ad9ff', initCost: 1e9, costMult: 1.40, baseSpeed: 1 / 30 },
    { name: 'Blue', color: '#3b6bff', initCost: 1e12, costMult: 1.44, baseSpeed: 1 / 35 },
    { name: 'Purple', color: '#a24dff', initCost: 1e15, costMult: 1.48, baseSpeed: 0.025 },
    { name: 'Pink', color: '#ff4dd2', initCost: 1e18, costMult: 1.52, baseSpeed: 1 / 45 },
    { name: 'White', color: '#f4f1ff', initCost: 1e27, costMult: 1.56, baseSpeed: 0.02 },
  ];

  const INFINITY_LOG = Math.log10(1.79e308);

  const TUNE = {
    pMultBase: 2.56,
    pMultPow: 2.25,
    pExpDiv: 225,
    prestigeMinLog: 10,
    promoMin: 2000, // tuned (spec: 1000) — see test/sim.js / task-3 report
    promoPow: 0.75,
    // log10 of a fresh circle's base mult gain. Spec/wiki: 0.01; tuned to 0.04
    // so the first prestige lands at ~10 min instead of ~28 min (task-3 report).
    multGainLog0: Math.log10(0.04),
  };

  const DEFAULT_MODS = Object.freeze({
    lapMult: 1, gainLog: 0, expAdd: 0, prodLog: 0, ascBase: 10, ascMult: 1,
    v: Object.freeze([1, 1, 1, 1]), pMultMult: 1, pExpMult: 1, gainPow: 1,
    disabledPromo: Object.freeze([]), maxCircles: 10, noAscend: false, decay: 0,
  });

  const hooks = { mods: null, preTick: null, auto: null, postTick: null, stepDt: null };

  function registerHooks(h) {
    for (const k of Object.keys(h)) if (k in hooks) hooks[k] = h[k];
  }

  function mods(s) {
    return hooks.mods ? hooks.mods(s) : DEFAULT_MODS;
  }

  function isFixed(s) {
    return !(s.inf.broken && s.inf.ic.active === 0);
  }

  // --- log-space helpers ---

  function logAdd(a, b) {
    if (a === -Infinity) return b;
    if (b === -Infinity) return a;
    if (a < b) { const t = a; a = b; b = t; }
    return a + Math.log10(1 + 10 ** (b - a));
  }

  function logSub(a, b) {
    // requires a >= b
    if (b === -Infinity) return a;
    if (Math.abs(a - b) < 1e-12) return -Infinity;
    return a + Math.log10(1 - 10 ** (b - a));
  }

  // --- state ---

  function freshCircle(i) {
    return {
      unlocked: i === 0,
      level: i === 0 ? 5 : 0,
      bought: 0,
      ascensions: 0,
      multLog: 0,
      multGainLog: TUNE.multGainLog0,
      progress: 0,
      laps: 0,
    };
  }

  function newState() {
    return {
      v: 2,
      scoreLog: -Infinity,
      circles: CIRCLES.map((_, i) => freshCircle(i)),
      pMult: 1,
      pExp: 1,
      prestigeReqLog: TUNE.prestigeMinLog,
      promo: [0, 0, 0, 0],
      infinities: 0,
      stats: {
        totalLaps: 0, prestiges: 0, promotions: 0, playTime: 0, bestScoreLog: -Infinity,
        fastestInfinity: null, lastInfinities: [], totalIpLog: -Infinity,
      },
      savedAt: 0,
      inf: {
        ipLog: -Infinity,
        upg: {},
        gens: Array.from({ length: 10 }, () => ({ b: 0, aLog: -Infinity })),
        gpLog: -Infinity,
        t: 0, tRun: 0,
        broken: false, pendingConfirm: false, finaleSeen: false,
        ic: { active: 0, done: Array(9).fill(false), best: Array(9).fill(null) },
        stars: { n: 0, nb: 0, ne: 0, sdLog: -Infinity, sdU: [0, 0, 0, 0] },
        auto: {
          buy: { on: true, circles: Array(10).fill(true) },
          asc: { on: true, circles: Array(10).fill(true) },
          promote: { on: true, order: [0, 1, 2, 3], xFactor: 2, minTime: 1 },
          prestige: { on: true, multX: 10, expGain: 0, minTime: 0.2 },
          infinity: { on: false, minIpLog: 0, minTime: 0 },
          stallSec: 30,
          confirmInfinity: false,
        },
        rt: { markLog: -Infinity, markT: 0 },
      },
    };
  }

  // --- merge / migrate ---

  function mergeDefaults(def, obj) {
    if (Array.isArray(def)) {
      if (!Array.isArray(obj)) return def;
      if (def.length === 0) return obj.slice();
      return def.map((d, i) => (i < obj.length ? mergeDefaults(d, obj[i]) : d));
    }
    if (def !== null && typeof def === 'object') {
      if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) return def;
      const keys = Object.keys(def);
      if (keys.length === 0) return Object.assign({}, obj);
      const out = {};
      for (const k of keys) {
        out[k] = k in obj ? mergeDefaults(def[k], obj[k]) : def[k];
      }
      return out;
    }
    return obj === undefined ? def : obj;
  }

  function migrate(obj) {
    if (!obj || typeof obj !== 'object' || (obj.v !== 1 && obj.v !== 2) ||
        !Array.isArray(obj.circles) || obj.circles.length !== 10) {
      throw new Error('Invalid save');
    }
    if (obj.v === 1) {
      obj.inf = Object.assign({}, obj.inf, { ipLog: obj.ip > 0 ? Math.log10(obj.ip) : -Infinity });
    }
    return Object.assign(mergeDefaults(newState(), obj), { v: 2 });
  }

  // --- formulas ---

  // `m` (mods(s)) may be passed in precomputed to avoid recomputing it
  // (mods() aggregates upgrade/challenge/star contributors and isn't free);
  // callers that don't have it handy can omit it and it's computed here.
  function promoEffects(s, m) {
    m = m || mods(s);
    const L = s.promo.map((x, k) => (m.disabledPromo.includes(k) ? 0 : x));
    const p4 = 1 + 0.05 * Math.pow(L[3], 0.48) * m.v[3];
    const p1 = p4 * (Math.floor(Math.pow(L[0], 1.5)) * m.v[0] + 1);
    const p2 = p4 * (1 + Math.sqrt(L[1]) * m.v[1]);
    const p3 = p4 * (m.ascBase + Math.pow(L[2], 0.82) * m.v[2]) * m.ascMult;

    const p = promoEffects(s, m);

  function multGainPerLapLog(s, i, m) {
    m = m || mods(s);
    return s.circles[i].multGainLog + Math.log10(promoEffects(s, m).p1) + m.gainLog;
  }

  function costLog(s, i) {
    const c = s.circles[i];
    const def = CIRCLES[i];
    const a = c.ascensions;
    const m = def.costMult;
    let sum = Math.log10(def.initCost);
    for (let k = 0; k < a; k++) {
      sum += (100 + 10 * k) * Math.log10(m + 0.1 * k);
    }
    sum += c.level * Math.log10(m + 0.1 * a);
    return sum;

        c.bought++;
        count++;

      if (next && !next.unlocked) {

        next.level = 0;
      }

    let sum = 0;
    for (const c of s.circles) {
      if (c.unlocked) sum += c.multLog;
    }
    sum += Math.log10(s.pMult) + m.prodLog;
    return Math.max(0.1, s.pExp + m.expAdd) * sum;
  }

  function incomeLog(s) {
    let sum = 0;
    for (let i = 0; i < s.circles.length; i++) sum += lapsPerSec(s, i);
    if (sum <= 0) return -Infinity;
    return perRevLog(s) + Math.log10(sum);
  }

  function tick(s, dt) {
    // m is taken before the clock advances: like every other rate in this
    // explicit-Euler step, time-dependent mods (IC7's prodLog penalty and
    // its completion reward) use the start-of-step t. The difference in
    // prodLog is 2·log10(t/(t-dt)): under 0.03 once t >= 60 s with dt <= 2.
    const m = mods(s);
    s.inf.t += dt;
    s.inf.tRun += dt;
    if (hooks.preTick) hooks.preTick(s, dt, m);

    const p = promoEffects(s, m);
    const laps = new Array(s.circles.length).fill(0);
    let N = 0;
    for (let i = 0; i < s.circles.length; i++) {
      const c = s.circles[i];
      if (!c.unlocked) continue;
      const def = CIRCLES[i];
      const lps = c.level * def.baseSpeed * p.p2 * m.lapMult;
      c.progress += lps * dt;
      const n = Math.floor(c.progress);
      c.progress -= n;
      c.laps += n;
      laps[i] = n;
      if (n > 0) {
        c.multLog = logAdd(c.multLog, Math.log10(n) + c.multGainLog + Math.log10(p.p1) + m.gainLog);
      }
      N += n;
    }

    if (m.decay > 0) {
      for (const c of s.circles) {
        c.multLog = Math.max(0, c.multLog * Math.pow(1 - m.decay, dt));
      }
    }

      s.scoreLog = logAdd(s.scoreLog, Math.log10(N) + perRevLog(s, m));

    s.stats.playTime += dt;
    s.stats.bestScoreLog = Math.max(s.stats.bestScoreLog, s.scoreLog);

    if (hooks.postTick) hooks.postTick(s, dt);

  }

      score: s.scoreLog,
      ip: s.inf.ipLog,
      inf: s.infinities,
      done: s.inf.ic.done.slice(),
    };

      const dt = Math.min(step, remaining);
      tick(s, dt);
      remaining -= dt;
    }
    const ipAfter = s.inf.ipLog;
    const ipGainedLog = ipAfter > before.ip
      ? (before.ip === -Infinity ? ipAfter : logSub(ipAfter, before.ip))
      : -Infinity;

      if (!before.done[i] && s.inf.ic.done[i]) icCompleted.push(i + 1);
    }
    return {
      scoreLogBefore: before.score,
      scoreLogAfter: s.scoreLog,

  function resetRun(s) {
    s.scoreLog = -Infinity;
    s.circles = CIRCLES.map((_, i) => freshCircle(i));
  }

  // Optional trailing `m` (mods(s)) on canAscend/ascend/pendingPrestige/
  // promoXp/canPromote lets hot callers (automation) pass a precomputed
  // mods object; omitted, it is computed here as before.
  function canAscend(s, i, m) {
    const c = s.circles[i];
    return c.unlocked && c.level >= levelCap(c) && !(m || mods(s)).noAscend;
  }

  function ascend(s, i, m) {
    m = m || mods(s);
    if (!canAscend(s, i, m)) return false;
    const c = s.circles[i];
    const p3 = promoEffects(s, m).p3;
    c.level = 5;
    c.ascensions++;
    c.multGainLog += Math.log10(p3);
    return true;
  }

  // --- prestige ---

  function rawPendingPMult(s, m) {
    if (s.scoreLog < 3) return 1;
    return TUNE.pMultBase * (s.scoreLog - 3) ** TUNE.pMultPow * m.pMultMult;
  }

  function pendingPrestige(s, m) {
    if (s.scoreLog < 3) return { pMult: 1, pExp: 1 };
    m = m || mods(s);
    const pMult = Math.pow(rawPendingPMult(s, m), m.gainPow);
    const pExp = 1 + (Math.max(0, s.scoreLog - 5) / TUNE.pExpDiv) * m.pExpMult * m.gainPow;
    return { pMult, pExp };
  }

  function canPrestige(s) {
    return s.scoreLog >= Math.max(TUNE.prestigeMinLog, s.prestigeReqLog);
  }

  function prestige(s) {
    if (!canPrestige(s)) return false;

    s.pExp = Math.max(s.pExp, g.pExp);

    s.inf.tRun = 0;
    s.inf.rt = { markLog: -Infinity, markT: 0 };

  }

  // --- promotions ---

  function promoXp(s, m) {
    m = m || mods(s);
    const pending = canPrestige(s) ? rawPendingPMult(s, m) : 0;
    const mm = Math.max(s.pMult, pending);
    if (mm < TUNE.promoMin) return 0;
    return Math.floor(Math.pow((mm / TUNE.promoMin) ** TUNE.promoPow, m.gainPow));
  }

  function canPromote(s, k, m) {
    m = m || mods(s);
    return !m.disabledPromo.includes(k) && promoXp(s, m) > s.promo[k];
  }

  function promote(s, k) {
    if (!canPromote(s, k)) return false;
    const xp = promoXp(s);
    s.promo[k] = xp;
    resetRun(s);
    s.pMult = 1;
    s.pExp = 1;
    s.prestigeReqLog = TUNE.prestigeMinLog;
    s.stats.promotions++;
    s.inf.tRun = 0;
    s.inf.rt = { markLog: -Infinity, markT: 0 };
    return true;
  }

  // --- infinity ---

  function canInfinity(s) {
    return s.scoreLog >= INFINITY_LOG;
  }

  // --- serialize ---

  function serialize(s) {
    const json = JSON.stringify(s, (k, v) => (v === -Infinity ? '-inf' : v));
    if (typeof btoa === 'function') return btoa(json);
    return Buffer.from(json, 'utf-8').toString('base64');
  }

  function deserialize(str) {
    try {
      const json = typeof atob === 'function'
        ? atob(str)
        : Buffer.from(str, 'base64').toString('utf-8');
      const obj = JSON.parse(json, (k, v) => (v === '-inf' ? -Infinity : v));
      return migrate(obj);
    } catch (e) {
      throw new Error('Invalid save');
    }
  }

  function fmtLog(x) {
    if (x === -Infinity) return '0';
    if (x < 6) {
      const v = 10 ** x;
      if (v < 1000) {
        // Up to 3 significant digits, trailing zeros trimmed (e.g. 0.04,
        // 1.9, 12.5, 999) instead of flooring small values to 0.
        const str = v.toPrecision(3);
        if (str.indexOf('e') === -1 && str.indexOf('E') === -1) {
          return str.indexOf('.') === -1 ? str : str.replace(/0+$/, '').replace(/\.$/, '');
        }

        // fall through to the >=1000 integer formatting below.

    let mantissa = 10 ** (x - exp);
    let mantissaStr = mantissa.toFixed(2);
    if (parseFloat(mantissaStr) >= 10) {
      exp += 1;
      mantissa = mantissa / 10;
      mantissaStr = mantissa.toFixed(2);
    }
    const expStr = exp >= 1000 ? exp.toLocaleString('en-US') : String(exp);
    return `${mantissaStr}e${expStr}`;
  }

  return {
    CIRCLES,
    INFINITY_LOG,
    TUNE,
    DEFAULT_MODS,
    registerHooks,
    _hooks: hooks,
    mods,
    isFixed,
    newState,
    migrate,
    tick,
    simulate,
    lapsPerSec,
    multGainPerLapLog,
    perRevLog,
    incomeLog,
    levelCap,
    costLog,
    buy,
    canAscend,
    ascend,
    pendingPrestige,
    canPrestige,
    prestige,
    promoXp,
    canPromote,
    promote,
    canInfinity,
    serialize,
    deserialize,
    promoEffects,
    fmtLog,
    logAdd,
    logSub,
  };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = Engine;
  require('./engine-infinity.js');
  require('./engine-auto.js');
} else {
  window.Engine = Engine;
}

      // Re-anchor once the score has dropped a lot, so rem keeps full
      // relative precision (subtracting from a tiny rem loses digits). Done

// Canvas orbit renderer for Rev Idle. Attaches window.Renderer.
// Consumes Engine.CIRCLES / Engine.lapsPerSec via window.Engine at call time.

  var MAX_PULSES = 40;

  var PULSE_COOLDOWN = 0.1; // seconds, per circle

  // needed. Shared at module scope so multiple Renderer instances reuse it.

  // still need rgba() strings — computed once per unique color, then cached.
  function getGlowStops(hex) {

    if (cached) return cached;
    var c = hexToRgb(hex);

    cached = {

    } catch (e) {

    }
  }

  function create(canvas) {
    var ctx = canvas.getContext('2d');

    var width = 0; // CSS pixels
    var height = 0;
    var dpr = 1;

    var starCanvas = document.createElement('canvas');
    var starCtx = starCanvas.getContext('2d');

    var time = 0; // accumulated seconds, used for pulsing animations
    var reducedMotion = prefersReducedMotion();

    // Ring-buffer-ish pool of active lap-pulse ripples. Reused array, no per-frame alloc.
    var pulses = []; // { i, r, color, start }
    var lastSpawn = new Array(10).fill(-Infinity);

    function buildStarfield() {

      var h = Math.max(1, Math.floor(height));
      starCanvas.width = Math.max(1, Math.floor(w * dpr));
      starCanvas.height = Math.max(1, Math.floor(h * dpr));
      starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      starCtx.clearRect(0, 0, w, h);

      var rand = mulberry32(1337);
      var count = Math.round((w * h) / 2600);

        var y = rand() * h;
        var r = rand() * 1.1 + 0.2;
        var a = rand() * 0.5 + 0.1;

      ctx.shadowColor = color;

    function drawTrackAndDot(cx, cy, r, color, progress, lps) {

      ctx.globalAlpha = 0.18;

          ctx.arc(cx, cy, r, a0, a1, true);

      var dx = cx + r * Math.cos(angle);
      var dy = cy + r * Math.sin(angle);

      ctx.shadowColor = color;

      if (!lapsCount || lapsCount <= 0) return;

      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      grad.addColorStop(0, stops.s90);
      grad.addColorStop(0.4, stops.s35);
      grad.addColorStop(1, stops.s0);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TWO_PI);
      ctx.fill();
      ctx.restore();

      var Engine = window.Engine;
      var cx = width / 2;
      var cy = height / 2;
      var minWH = Math.min(width, height);

      var highestColor = '#a24dff';
      var haveUnlocked = false;

      var circles = (state && state.circles) || [];

    }

    resize();

    return { draw: draw, resize: resize, hitTest: hitTest };
  }

  window.Renderer = { create: create };
})();
</script>
<script>// src/help.js — hover tooltips, first-run intro modal, and one-time unlock
// tips. Only calls the Shared Engine API on window.Engine; reaches into
// ui.js only through the hooks passed to Help.init().
(function () {
  'use strict';

  var HELP_KEY = 'revidle.help.v1';
  var LONGPRESS_MS = 450;
  var TIP_MARGIN = 8;
  var TIP_MAX_WIDTH = 260;

  var Engine = window.Engine;

  // ---------- hooks (wired by ui.js via Help.init) ----------

  var hooks = {
    toast: function () {},
    isModalOpen: function () { return null; },
    showModal: function () {},
    hideModal: function () {},
    getState: function () { return null; },
  };

  function init(h) {
    if (h) {
      for (var k in h) {
        if (Object.prototype.hasOwnProperty.call(h, k)) hooks[k] = h[k];
      }
    }
    seen = loadSeen();
  }

  // ---------- persisted "seen" flags ----------

  var seen = {};

  function loadSeen() {
    try {
      var raw = localStorage.getItem(HELP_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch (e) { /* ignore: help state is best-effort */ }
    return {};
  }

  function saveSeen() {
    try {
      localStorage.setItem(HELP_KEY, JSON.stringify(seen));
    } catch (e) { /* ignore */ }
  }

  function markSeen(key) {
    if (seen[key]) return false;
    seen[key] = true;
    saveSeen();
    return true;
  }

  // ---------- small helpers ----------

  function fmt(x) {
    return Engine.fmtLog(x);
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        if (k === 'class') node.className = attrs[k];
        else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') {
          node.addEventListener(k.slice(2), attrs[k]);
        } else if (attrs[k] === false || attrs[k] === null || attrs[k] === undefined) {
          // skip
        } else {
          node.setAttribute(k, attrs[k]);
        }
      }
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function prefersReducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) {
      return false;
    }
  }

  // ---------- tooltip copy ----------
  // Every entry is either a plain string, or a function(state, i) returning a
  // string. Live numbers always go through Engine helpers — never hardcode
  // tuned values here.

  var TIPS = {
    score: 'Your total score. Each lap around a ring multiplies your score by that ring’s ×mult, then by every other unlocked ring’s mult.',
    income: function (s) {
      return 'Score gained per second: score per lap × total laps/s across every unlocked ring. Right now that’s ' + fmt(Engine.incomeLog(s)) + '/s.';
    },
    buyMode: 'Choose how many levels a Buy click purchases: ×1, ×10, or Max (as many as you can afford). Key: M.',

    circleChip: function (s, i) {
      var def = Engine.CIRCLES[i];
      var c = s.circles[i];
      var p = Engine.promoEffects(s);
      var gainLog = c.multGainLog + Math.log10(p.p1);
      return def.name + ' ×' + fmt(c.multLog) + ' — grows +' + fmt(gainLog) + ' each ' + def.name + ' lap. All ring mults multiply together into your score per lap.';
    },
    pMultChip: function (s) {
      return 'P.Mult — your Prestige multiplier. It multiplies alongside every ring’s ×mult into your score per lap. Currently ×' + fmt(Math.log10(s.pMult)) + '.';
    },
    pExpChip: function (s) {
      return 'P.Exp — the exponent applied to (Π ring mults × P.Mult). Small increases compound fast. Currently ^' + s.pExp.toFixed(3) + '.';
    },

    circleLevel: function (s, i) {
      var c = s.circles[i];
      var cap = Engine.levelCap(c);
      return 'Level ' + c.level + ' of ' + cap + '. Cap = 100 + 10 × ascensions. At the cap you can Ascend this ring.';
    },
    circleLps: function (s, i) {
      var lps = Engine.lapsPerSec(s, i);
      return lps.toFixed(2) + ' laps per second — level × base speed × the Lap Speed promotion.';
    },
    circleGain: function (s, i) {
      var c = s.circles[i];
      var p = Engine.promoEffects(s);
      var gainLog = c.multGainLog + Math.log10(p.p1);
      return 'Each lap of this ring adds +' + fmt(gainLog) + ' to its ×mult.';
    },
    buyBtn: function (s, i) {
      var costLog = Engine.costLog(s, i);
      return 'Buy levels for this ring. Cost: ' + fmt(costLog) + ' score. ×10/Max buy as many as you can afford, up to that count. Key: ' + (i === 9 ? '0' : String(i + 1)) + '.';
    },
    ascendBtn: function (s, i) {
      var p = Engine.promoEffects(s);
      return 'Ascend: resets this ring to level 5 in exchange for ×' + p.p3.toFixed(2) + ' more mult gain per lap (kept), +10 level cap, and +0.1 cost multiplier.';
    },
    lockedRow: 'Locked. Unlocks once you buy 5 levels of the previous ring.',

    prestigeCurrent: function (s) {
      return 'Your current permanent boost from prestiging: ×' + fmt(Math.log10(s.pMult)) + ' P.Mult, ^' + s.pExp.toFixed(3) + ' P.Exp.';
    },
    prestigePending: function (s) {
      var g = Engine.pendingPrestige(s);
      return 'What you’d gain by prestiging right now: ×' + fmt(Math.log10(g.pMult)) + ' P.Mult, ^' + g.pExp.toFixed(3) + ' P.Exp. Prestiging resets your rings but keeps P.Mult, P.Exp, and promotions.';
    },
    prestigeReq: function (s) {
      var reqLog = Math.max(Engine.TUNE.prestigeMinLog, s.prestigeReqLog);
      return 'You need score ≥ ' + fmt(reqLog) + ' to prestige. The requirement rises each time you prestige.';
    },

    promoXp: function (s) {
      return 'Promotion XP, earned once P.Mult reaches ' + fmt(Math.log10(Engine.TUNE.promoMin)) + ': floor((P.Mult / ' + fmt(Math.log10(Engine.TUNE.promoMin)) + ') ^ ' + Engine.TUNE.promoPow + '). Spend it on a card below — promoting resets your rings and P.Mult/P.Exp.';
    },
    promoCard: function (s, k) {
      var names = ['Mult Gain', 'Lap Speed', 'Ascension Power', 'Promotion Power'];
      var about = [
        'boosts how much ×mult every lap earns.',
        'boosts every ring’s laps per second.',
        'boosts the mult gain kept from Ascending.',
        'boosts the other three promotions.',
      ];
      return names[k] + ' — ' + about[k] + ' Promotion Power boosts the other three.';
    },

    goInfinite: function (s) {
      return 'Go Infinite: gain +' + fmt(Engine.ipGainLog(s)) + ' IP and +' + Engine.infGain(s)
        + ' Infinity, then restart the Revolution stage. Upgrades, generators and IP are kept.';
    },

    helpBtn: 'How to play (key: ? or H).',

    // ---- ∞ tab (Task 11) ----

    ipHeader: function (s) {
      return 'Infinity Points — earned each time you go Infinite. Next Infinity gives +'
        + fmt(Engine.ipGainLog(s)) + ' IP. Spend IP on the Tree, Generators and Stars.';
    },
    infCount: function (s) {
      return 'Infinities performed: ' + fmtInf(s.infinities) + '. Several upgrades grow stronger with more Infinities.';
    },
    iuCard: function (s, i) {
      var u = Engine.UPGRADES[i];
      if (!u) return '';
      var owned = Engine.hasUpg(s, u.id);
      var effect = Engine.upgEffect(s, u.id);
      var status;
      if (owned) {
        status = effect === null ? 'Owned.' : 'Owned — currently ×' + fmtEffect(effect) + '.';
      } else if (u.req === 'prev') {
        status = 'Requires an earlier column’s upgrade.';
      } else {
        status = 'Requires ' + u.req.join(' or ') + '.';
      }
      var descText = u.desc.charAt(u.desc.length - 1) === '.' ? u.desc : (u.desc + '.');
      return u.name + ' — ' + descText + ' Cost ' + fmt(Math.log10(u.cost)) + ' IP. ' + status;
    },
    gpLine: function (s) {
      return 'Generator Power multiplies every ring’s mult gain per lap by GP^' + Engine.gpExp(s).toFixed(3)
        + '. It resets each Infinity, so runs speed up as they go.';
    },
    genRow: function (s, k) {
      var n = k + 1;
      var g = s.inf.gens[k];
      var target = n === 1 ? 'GP' : ('G' + (n - 1));
      return 'G' + n + ': you have ' + fmt(g.aLog) + ' (' + g.b + ' bought). Each makes ×'
        + fmt(Engine.genMultLog(s, k)) + ' ' + target + ' per second. Every purchase doubles its output.';
    },
    genBuy: function (s, k) {
      var n = k + 1;
      return 'Buy another G' + n + ' for ' + fmt(Engine.genCostLog(s, k))
        + ' IP. Bought generators are kept through Infinity; produced ones are not.';
    },
    gpChip: function (s) {
      return 'Generator Power boost to mult gain: ×' + fmt(Engine.gpMultLog(s)) + '.';
    },
  };

  // Formats a plain (non-log) multiplier/value for tooltip copy.
  function fmtEffect(x) {
    if (!isFinite(x)) return String(x);
    if (x === 0) return '0';
    var abs = Math.abs(x);
    if (abs >= 1000 || abs < 0.001) return x.toExponential(2);
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    return x.toFixed(abs < 10 ? 3 : 2);
  }

  // Formats a plain (non-log) count such as state.infinities: usually an
  // integer, but passive-Infinity upgrades (18;1) can make it fractional.
  function fmtInf(n) {
    var frac = Math.abs(n - Math.round(n)) > 1e-9;
    try {
      return n.toLocaleString('en-US', frac ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
    } catch (e) {
      return String(n);
    }
  }

  function textForKey(key, i) {
    var entry = TIPS[key];
    if (entry === undefined) return '';
    if (typeof entry === 'function') {
      var s = hooks.getState();
      if (!s) return '';
      return entry(s, i);
    }
    return entry;
  }

  // ---------- tooltip component ----------

  var tipNode = null;
  var mode = null; // 'element' | 'point' | null
  var activeTarget = null;
  var activePoint = null; // { x, y } viewport coords
  var activeTextFn = null;
  var longPressTimer = null;
  var longPressTarget = null;
  var suppressNextClickOn = null;

  function ensureTipNode() {
    if (tipNode) return tipNode;
    tipNode = document.createElement('div');
    tipNode.id = 'tip';
    tipNode.setAttribute('role', 'tooltip');
    tipNode.hidden = true;
    document.body.appendChild(tipNode);
    return tipNode;
  }

  function findTipTarget(node) {
    while (node && node.nodeType === 1 && node !== document.body) {
      if (node.tipFn || (node.hasAttribute && node.hasAttribute('data-tip'))) return node;
      node = node.parentNode;
    }
    return null;
  }

  function textForElement(target) {
    if (typeof target.tipFn === 'function') return target.tipFn();
    var key = target.getAttribute('data-tip');
    var iAttr = target.getAttribute('data-tip-i');
    var i = iAttr === null ? undefined : Number(iAttr);
    return textForKey(key, i);
  }

  function positionAt(x, y) {
    var tip = ensureTipNode();
    var margin = TIP_MARGIN;
    var rect = tip.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var left = x - rect.width / 2;
    var top = y - rect.height - 10;
    var flipped = false;
    if (top < margin) {
      top = y + 18;
      flipped = true;
    }
    if (left < margin) left = margin;
    if (left + rect.width > vw - margin) left = vw - margin - rect.width;
    if (top + rect.height > vh - margin) top = vh - margin - rect.height;
    if (top < margin) top = margin;

    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
    tip.classList.toggle('below', flipped);
  }

  function positionForTarget(target) {
    var r = target.getBoundingClientRect();
    positionAt(r.left + r.width / 2, r.top);
  }

  function renderTip() {
    // A dirty re-render (ui.js rebuilds a tab body with innerHTML = '') can
    // detach the element a tooltip is anchored to without ever firing
    // mouseout/blur on it. Detect that here rather than positioning against
    // a detached node's zero rect (which would otherwise pin the tooltip to
    // the viewport corner and leave it stuck open indefinitely).
    if (mode === 'element' && activeTarget && !activeTarget.isConnected) {
      hide();
      return;
    }

    var tip = ensureTipNode();
    var text = activeTextFn ? activeTextFn() : '';
    if (!text) {
      hide();
      return;
    }
    tip.textContent = text;
    tip.style.maxWidth = TIP_MAX_WIDTH + 'px';
    var wasHidden = tip.hidden;
    tip.hidden = false;
    if (mode === 'element') {
      positionForTarget(activeTarget);
    } else if (mode === 'point' && activePoint) {
      positionAt(activePoint.x, activePoint.y);
    }
    if (wasHidden && !prefersReducedMotion()) {
      tip.classList.remove('show');
      // Force reflow so the fade-in transition restarts on rapid re-shows.
      // eslint-disable-next-line no-unused-expressions
      tip.offsetWidth;
      tip.classList.add('show');
    } else {
      tip.classList.add('show');
    }
  }

  function showElement(target) {
    if (activeTarget === target && mode === 'element') return;
    mode = 'element';
    activeTarget = target;
    activePoint = null;
    activeTextFn = function () { return textForElement(target); };
    var tip = ensureTipNode();
    target.setAttribute('aria-describedby', tip.id);
    renderTip();
  }

  function showAt(x, y, textFn) {
    mode = 'point';
    activePoint = { x: x, y: y };
    activeTarget = null;
    activeTextFn = textFn;
    renderTip();
  }

  function hide() {
    if (activeTarget && activeTarget.getAttribute('aria-describedby') === (tipNode && tipNode.id)) {
      activeTarget.removeAttribute('aria-describedby');
    }
    mode = null;
    activeTarget = null;
    activePoint = null;
    activeTextFn = null;
    if (tipNode) {
      tipNode.classList.remove('show');
      tipNode.hidden = true;
    }
  }

  function refresh() {
    if (!mode) return;
    renderTip();
  }

  // ---------- delegated hover/focus wiring ----------

  document.addEventListener('mouseover', function (e) {
    var t = findTipTarget(e.target);
    if (t) showElement(t);
  }, true);

  document.addEventListener('mouseout', function (e) {
    var t = findTipTarget(e.target);
    if (!t) return;
    var related = e.relatedTarget;
    if (related && t.contains(related)) return;
    if (activeTarget === t) hide();
  }, true);

  document.addEventListener('focusin', function (e) {
    var t = findTipTarget(e.target);
    if (t) showElement(t);
  });

  document.addEventListener('focusout', function (e) {
    var t = findTipTarget(e.target);
    if (t && activeTarget === t) hide();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && mode) hide();
  });

  window.addEventListener('scroll', function () {
    if (mode) hide();
  }, true);

  // ---------- touch: long-press to show, next tap to hide ----------

  function clearLongPress() {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
    longPressTarget = null;
  }

  document.addEventListener('touchstart', function (e) {
    if (mode) {
      // A tap while a tip is already showing closes it, and must not act on
      // whatever it landed on.
      var closing = e.target;
      hide();
      suppressNextClickOn = closing;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    var t = findTipTarget(e.target);
    if (!t) return;
    clearLongPress();
    longPressTarget = t;
    longPressTimer = setTimeout(function () {
      if (longPressTarget === t) {
        showElement(t);
        suppressNextClickOn = t;
      }
      longPressTimer = null;
    }, LONGPRESS_MS);
  }, { passive: false });

  document.addEventListener('touchmove', clearLongPress, { passive: true });
  document.addEventListener('touchend', function () {
    clearLongPress();
  }, { passive: true });
  document.addEventListener('touchcancel', clearLongPress, { passive: true });

  document.addEventListener('click', function (e) {
    if (suppressNextClickOn) {
      var target = suppressNextClickOn;
      suppressNextClickOn = null;
      if (target === e.target || (target.contains && target.contains(e.target))) {
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, true);

  // ---------- intro modal ----------

  function glyph(color) {
    return el('span', { class: 'help-glyph', style: 'border-color:' + color + ';box-shadow:0 0 8px 1px ' + color });
  }

  function beat(color, title, body) {
    return el('div', { class: 'help-beat' }, [
      glyph(color),
      el('div', {}, [
        el('div', { class: 'help-beat-title' }, [title]),
        el('div', { class: 'help-beat-body' }, [body]),
      ]),
    ]);
  }

  function showIntro() {
    if (hooks.isModalOpen()) return;
    var panel = el('div', { class: 'modal-panel' }, [
      el('h2', { class: 'modal-title' }, ['How to play']),
      beat('#ff3b4f', 'Orbit', 'Every lap of a dot earns score. Faster rings lap more often.'),
      beat('#ffd93b', 'Buy', 'Levels make a ring faster; buying 5 levels of a ring unlocks the next.'),
      beat('#2affc6', 'Multiply', 'Each lap also grows that ring’s ×mult; all mults multiply your score per lap.'),
      beat('#a24dff', 'Reset for power', 'Max a ring to Ascend it. Later, Prestige and Promotions trade progress for permanent boosts. They unlock as you go.'),
      el('div', { class: 'row help-intro-actions' }, [
        el('button', {
          class: 'btn primary',
          id: 'intro-start',
          onclick: function () {
            markSeen('introSeen');
            hooks.hideModal();
          },
        }, ['Start orbiting']),
        el('button', {
          class: 'btn',
          onclick: function () {
            markSeen('introSeen');
            hooks.hideModal();
          },
        }, ['Skip']),
      ]),
    ]);
    hooks.showModal(panel);
    var startBtn = panel.querySelector('#intro-start');
    if (startBtn) startBtn.focus();
  }

  function maybeShowIntroOnBoot(hadSave) {
    if (hadSave) return;
    if (seen.introSeen) return;
    showIntro();
  }

  // ---------- one-time unlock tips ----------

  function onTick(state) {
    if (!state) return;
    for (var i = 0; i < state.circles.length; i++) {
      if (Engine.canAscend(state, i)) {
        if (markSeen('ascendSeen')) {
          hooks.toast('Ascend ready — max-level rings can reset to level 5 for a mult gain boost. Hover the button for details.');
        }
        break;
      }
    }
    if (Engine.canPrestige(state)) {
      if (markSeen('prestigeSeen')) {
        hooks.toast('Prestige ready — reset your rings for a permanent score boost. Hover the Prestige tab for details.');
      }
    }
    if (Engine.promoXp(state) > 0) {
      if (markSeen('promoSeen')) {
        hooks.toast('Promotions ready — spend XP on permanent boosts. Hover a card on the Promote tab for details.');
      }
    }
    if (Engine.canInfinity(state)) {
      if (hooks.isModalOpen() === 'infinity') {
        markSeen('infinitySeen');
      } else if (markSeen('infinitySeen')) {
        hooks.toast('Infinity reached — hover Go Infinite for details.');
      }
    }
    if (state.infinities >= 1) {
      if (markSeen('infTabSeen')) {
        hooks.toast('∞ tab unlocked — spend Infinity Points on upgrades.');
      }
    }
    if (Engine.hasUpg(state, '1;1')) {
      if (markSeen('gensSeen')) {
        hooks.toast('Generators online — they build Generator Power, which boosts every ring’s mult gain.');
      }
    }
    var auto = Engine.autoUnlocked(state);
    if (auto.buy || auto.asc || auto.promote || auto.prestige || auto.infinity) {
      if (markSeen('autoSeen')) {
        hooks.toast('Automation unlocked — configure it in ∞ → Auto.');
      }
    }
  }

  window.Help = {
    init: init,
    showIntro: showIntro,
    maybeShowIntroOnBoot: maybeShowIntroOnBoot,
    onTick: onTick,
    refresh: refresh,
    showAt: showAt,
    hide: hide,
    TIPS: TIPS,
  };
})();
</script>
<script>// src/ui-infinity.js — the ∞ tab (Tree, Gens, Auto, ICs, Stars). DOM only via
// kit.el; reads state and Engine directly, never window/localStorage except
// the try/catch-wrapped sub-tab preference below.
(function () {
  'use strict';

  var Engine = window.Engine;
  var STORAGE_KEY = 'revidle.infTab';

  var SUBTABS = [
    { id: 'tree', label: 'Tree', visible: function () { return true; } },
    { id: 'gens', label: 'Gens', visible: function (s) { return Engine.hasUpg(s, '1;1'); } },
    { id: 'auto', label: 'Auto', visible: function (s) { return Engine.hasUpg(s, '1;1'); } },
    { id: 'ics', label: 'ICs', visible: function (s) { return Engine.hasUpg(s, '7;1'); } },
    { id: 'stars', label: 'Stars', visible: function (s) { return Engine.hasUpg(s, '21;1'); } },
  ];

  var subTab = loadSubTab();

  function loadSubTab() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (v && SUBTABS.some(function (t) { return t.id === v; })) return v;
    } catch (e) { /* ignore: sub-tab memory is best-effort */ }
    return 'tree';
  }

  function saveSubTab(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* ignore */ }
  }

  function visibleSubTabs(state) {
    return SUBTABS.filter(function (t) { return t.visible(state); });
  }

  // ---------- small formatters ----------

  function fmt(x) {
    return Engine.fmtLog(x);
  }

  // Formats a plain (non-log) count such as state.infinities: usually an
  // integer, but passive-Infinity upgrades (18;1) can make it fractional.
  function fmtInfNumber(n) {
    var frac = Math.abs(n - Math.round(n)) > 1e-9;
    try {
      return n.toLocaleString('en-US', frac ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
    } catch (e) {
      return String(n);
    }
  }

  // Formats a plain (non-log) multiplier/value shown on a Tree card, e.g. the
  // 1.1 in "Lap speed ×1.1" or the 32 in "×32".
  function fmtNum(x) {
    if (!isFinite(x)) return String(x);
    if (x === 0) return '0';
    var abs = Math.abs(x);
    if (abs >= 1000 || abs < 0.001) return x.toExponential(2);
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    return x.toFixed(abs < 10 ? 3 : 2);
  }

  // ---------- header ----------

  function ipLineText(state) {
    return 'IP ' + fmt(state.inf.ipLog) + ' · +' + fmt(Engine.ipGainLog(state)) + ' next';
  }

  function infLineText(state) {
    return '∞ ' + fmtInfNumber(state.infinities);
  }

  function renderHeader(kit, state) {
    return kit.el('div', { id: 'inf-header', class: 'inf-header' }, [
      kit.el('span', { class: 'inf-ip', tabindex: '0', 'data-tip': 'ipHeader' }, [ipLineText(state)]),
      kit.el('span', {}, [' · ']),
      kit.el('span', { class: 'inf-count', tabindex: '0', 'data-tip': 'infCount' }, [infLineText(state)]),
    ]);
  }

  function updateHeader(header, state) {
    var ipSpan = header.querySelector('.inf-ip');
    if (ipSpan) ipSpan.textContent = ipLineText(state);
    var cntSpan = header.querySelector('.inf-count');
    if (cntSpan) cntSpan.textContent = infLineText(state);
  }

  // ---------- sub-tab row ----------

  function renderSubTabRow(kit, state, container) {
    var vis = visibleSubTabs(state);
    if (vis.map(function (t) { return t.id; }).indexOf(subTab) === -1) subTab = 'tree';
    var row = kit.el('div', { class: 'inf-subtabs', role: 'tablist' });
    vis.forEach(function (t) {
      var btn = kit.el('button', {
        class: 'tab-btn sub-tab-btn',
        role: 'tab',
        'aria-selected': String(t.id === subTab),
        onclick: function () {
          if (subTab === t.id) return;
          subTab = t.id;
          saveSubTab(t.id);
          render(container, state, kit);
        },
      }, [t.label]);
      row.appendChild(btn);
    });
    return row;
  }

  // ---------- Tree ----------

  function columnsOf(upgrades) {
    var cols = [];
    upgrades.forEach(function (u) { if (cols.indexOf(u.col) === -1) cols.push(u.col); });
    cols.sort(function (a, b) { return a - b; });
    return cols;
  }

  function prevColOf(cols, col) {
    var best = null;
    for (var i = 0; i < cols.length; i++) {
      if (cols[i] < col) best = cols[i];
      else break;
    }
    return best;
  }

  // Every column up to and including the first column with no owned node,
  // plus one dimmed preview column after it (per the Task 11 brief).
  function revealColumns(state, cols) {
    var firstEmptyIdx = -1;
    for (var i = 0; i < cols.length; i++) {
      var col = cols[i];
      var owned = Engine.UPGRADES.some(function (u) { return u.col === col && Engine.hasUpg(state, u.id); });
      if (!owned) { firstEmptyIdx = i; break; }
    }
    if (firstEmptyIdx === -1) return { shown: cols.slice(), previewCol: null };
    var shown = cols.slice(0, firstEmptyIdx + 1);
    var previewCol = firstEmptyIdx + 1 < cols.length ? cols[firstEmptyIdx + 1] : null;
    if (previewCol !== null) shown.push(previewCol);
    return { shown: shown, previewCol: previewCol };
  }

  function lockedText(cols, u) {
    if (u.req === 'prev') {
      var pc = prevColOf(cols, u.col);
      return pc === null ? 'Needs an earlier upgrade' : 'Needs a C' + pc + ' upgrade';
    }
    return 'Needs ' + u.req.join(' or ');
  }

  function buildCard(kit, state, cols, u, idx, dimmed) {
    var owned = Engine.hasUpg(state, u.id);
    var buyable = !owned && Engine.canBuyUpgrade(state, u.id);
    var effect = Engine.upgEffect(state, u.id);
    var stateCls = owned ? 'owned' : buyable ? 'buyable' : 'locked';

    var kids = [
      kit.el('div', { class: 'card-title' }, [u.name]),
      kit.el('div', { class: 'iu-cost' }, [fmt(Math.log10(u.cost)) + ' IP']),
      kit.el('div', { class: 'iu-effect' }, [u.desc + (effect !== null ? (' · now ×' + fmtNum(effect)) : '')]),
    ];
    if (!owned && !buyable) {
      kids.push(kit.el('div', { class: 'iu-locked' }, [lockedText(cols, u)]));
    }

    var attrs = {
      class: 'card iu-card ' + stateCls + (dimmed ? ' preview' : ''),
      'data-tip': 'iuCard',
      'data-tip-i': String(idx),
      'data-id': u.id,
      tabindex: '0',
    };

    if (buyable) {
      var btn = kit.el('button', attrs, kids);
      btn.addEventListener('click', function () {
        if (Engine.buyUpgrade(state, u.id)) {
          kit.markDirty();
          kit.save();
        }
      });
      return btn;
    }
    return kit.el('div', attrs, kids);
  }

  function renderTree(kit, state) {
    var cols = columnsOf(Engine.UPGRADES);
    var reveal = revealColumns(state, cols);
    var wrap = kit.el('div', { class: 'inf-tree' });
    reveal.shown.forEach(function (col) {
      var dimmed = col === reveal.previewCol;
      var grid = kit.el('div', { class: 'iu-grid' });
      Engine.UPGRADES.forEach(function (u, idx) {
        if (u.col !== col) return;
        grid.appendChild(buildCard(kit, state, cols, u, idx, dimmed));
      });
      wrap.appendChild(kit.el('div', { class: 'iu-col' + (dimmed ? ' preview' : ''), 'data-col': String(col) }, [
        kit.el('div', { class: 'iu-col-label' }, ['C' + col]),
        grid,
      ]));
    });
    return wrap;
  }

  // Patches card text in place; only asks for a full re-render (via
  // kit.markDirty, which the outer tab dispatch honors on the next domUpdate)
  // when a card's owned/buyable/locked state — or the revealed column set —
  // actually changed, since those need different DOM structure (only a
  // buyable card is a <button>) or a different set of columns.
  function updateTree(root, kit, state) {
    var needsRebuild = false;
    var cards = root.querySelectorAll('.iu-card');
    for (var i = 0; i < cards.length; i++) {
      var node = cards[i];
      var id = node.getAttribute('data-id');
      var u = Engine.upgById(id);
      if (!u) continue;
      var owned = Engine.hasUpg(state, id);
      var buyable = !owned && Engine.canBuyUpgrade(state, id);
      if (owned !== node.classList.contains('owned') || buyable !== node.classList.contains('buyable')) {
        needsRebuild = true;
        break;
      }
      var effect = Engine.upgEffect(state, id);
      var effLine = node.querySelector('.iu-effect');
      if (effLine) effLine.textContent = u.desc + (effect !== null ? (' · now ×' + fmtNum(effect)) : '');
    }
    if (!needsRebuild) {
      var cols = columnsOf(Engine.UPGRADES);
      var reveal = revealColumns(state, cols);
      var shownCols = Array.prototype.map.call(root.querySelectorAll('.iu-col'), function (n) {
        return Number(n.getAttribute('data-col'));
      });
      if (shownCols.length !== reveal.shown.length
        || shownCols.some(function (c, idx) { return c !== reveal.shown[idx]; })) {
        needsRebuild = true;
      }
    }
    if (needsRebuild) kit.markDirty();
  }

  // ---------- Gens ----------

  function highestBoughtTier(state) {
    var h = 0;
    for (var k = 0; k < Engine.GEN_COUNT; k++) {
      if (state.inf.gens[k].b > 0) h = k + 1;
    }
    return h;
  }

  function visibleGenCount(state) {
    return Math.min(10, highestBoughtTier(state) + 1);
  }

  // The log10 rate this generator currently produces: G(k+1) feeds G(k), and
  // G1 (k=0) feeds Generator Power (plus any Star bonus to that GP feed).
  function genRateLog(state, k) {
    var g = state.inf.gens[k];
    if (g.aLog === -Infinity) return -Infinity;
    var L = g.aLog + Engine.genMultLog(state, k);
    if (k === 0 && typeof Engine.starGpLog === 'function') L += Engine.starGpLog(state);
    return L;
  }

  function gpLineText(state) {
    return 'GP ' + fmt(state.inf.gpLog) + ' → Mult Gain ×' + fmt(Engine.gpMultLog(state))
      + ' (^' + Engine.gpExp(state).toFixed(3) + ')';
  }

  function buildGenRow(kit, state, k) {
    var n = k + 1;
    var row = kit.el('div', {
      class: 'gen-row', 'data-k': String(k), tabindex: '0', 'data-tip': 'genRow', 'data-tip-i': String(k),
    }, [
      kit.el('div', { class: 'gen-name' }, ['G' + n]),
      kit.el('div', { class: 'gen-meta' }, [
        kit.el('span', { class: 'gen-amount' }, [fmt(state.inf.gens[k].aLog)]),
        kit.el('span', { class: 'gen-mult' }, ['×' + fmt(Engine.genMultLog(state, k))]),
        kit.el('span', { class: 'gen-rate' }, ['+' + fmt(genRateLog(state, k)) + '/s']),
      ]),
    ]);
    var buyBtn = kit.el('button', {
      class: 'btn gen-buy', 'data-tip': 'genBuy', 'data-tip-i': String(k),
    }, [fmt(Engine.genCostLog(state, k)) + ' IP']);
    buyBtn.disabled = !Engine.canBuyGen(state, k);
    buyBtn.addEventListener('click', function () {
      if (Engine.buyGen(state, k)) {
        kit.markDirty();
        kit.save();
      }
    });
    row.appendChild(buyBtn);
    return row;
  }

  function renderGens(kit, state) {
    var wrap = kit.el('div', { class: 'inf-gens' });
    wrap.appendChild(kit.el('div', { class: 'stat-line gp-line', tabindex: '0', 'data-tip': 'gpLine' }, [
      kit.el('span', { id: 'gp-line-value' }, [gpLineText(state)]),
    ]));

    var count = visibleGenCount(state);
    var maxMult = -Infinity;
    for (var k = 0; k < count; k++) {
      wrap.appendChild(buildGenRow(kit, state, k));
      maxMult = Math.max(maxMult, Engine.genMultLog(state, k));
    }
    if (maxMult >= 1000) {
      wrap.appendChild(kit.el('p', { class: 'help' }, ['Generator Mult softcapped above e1,000']));
    }
    return wrap;
  }

  function updateGens(root, kit, state) {
    var gpValue = root.querySelector('#gp-line-value');
    if (gpValue) gpValue.textContent = gpLineText(state);

    var rows = root.querySelectorAll('.gen-row');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var k = Number(row.getAttribute('data-k'));
      var amt = row.querySelector('.gen-amount');
      if (amt) amt.textContent = fmt(state.inf.gens[k].aLog);
      var multEl = row.querySelector('.gen-mult');
      if (multEl) multEl.textContent = '×' + fmt(Engine.genMultLog(state, k));
      var rateEl = row.querySelector('.gen-rate');
      if (rateEl) rateEl.textContent = '+' + fmt(genRateLog(state, k)) + '/s';
      var buyBtn = row.querySelector('.gen-buy');
      if (buyBtn) {
        buyBtn.textContent = fmt(Engine.genCostLog(state, k)) + ' IP';
        buyBtn.disabled = !Engine.canBuyGen(state, k);
      }
    }
    if (rows.length !== visibleGenCount(state)) kit.markDirty();
  }

  // ---------- Auto / ICs / Stars (placeholders until Task 12) ----------

  function renderComingSoon(kit) {
    return kit.el('div', { class: 'inf-coming-soon' }, [
      kit.el('p', { class: 'help' }, ['Coming in Task 12']),
    ]);
  }

  // ---------- tab dispatch ----------

  function renderBody(kit, state) {
    if (subTab === 'gens') return renderGens(kit, state);
    if (subTab === 'tree') return renderTree(kit, state);
    return renderComingSoon(kit);
  }

  function render(container, state, kit) {
    container.innerHTML = '';
    var wrap = kit.el('div', { class: 'tab-body-inner inf-tab' });
    wrap.appendChild(renderHeader(kit, state));
    wrap.appendChild(renderSubTabRow(kit, state, container));
    wrap.appendChild(kit.el('div', { id: 'inf-subbody' }, [renderBody(kit, state)]));
    container.appendChild(wrap);
  }

  function update(container, state, kit) {
    var header = container.querySelector('#inf-header');
    var body = container.querySelector('#inf-subbody');
    if (!header || !body) {
      render(container, state, kit);
      return;
    }
    updateHeader(header, state);
    if (subTab === 'tree') updateTree(body, kit, state);
    else if (subTab === 'gens') updateGens(body, kit, state);
  }

  window.InfinityUI = {
    render: render,
    update: update,
  };
})();
</script>
<script>// src/ui.js \u2014 DOM panel, buy modes, prestige/promotion/infinity screens,
// loop, save/load/offline. Only calls the Shared Engine API on window.Engine
// and window.Renderer.
(function () {
  'use strict';

  var SAVE_KEY = 'revidle.save.v1';
  var DOM_INTERVAL = 100; // ms, ~10Hz
  var AUTOSAVE_INTERVAL = 10000; // ms
  var OFFLINE_CAP_SEC = 8 * 3600;
  var CONFIRM_WINDOW = 3000; // ms

  var Engine = window.Engine;
  var Help = window.Help;

  var state = null;
  var renderer = null;
  var canvas = null;

  var buyMode = '1'; // '1' | '10' | 'max'
  var currentTab = 'circles';
  var dirty = true;
  var lastVisibleTabIds = '';
  var modalOpen = null; // 'offline' | 'infinity' | null

  var els = {};

  var TABS = [
    { id: 'circles', label: 'Circles', visible: function () { return true; } },
    {
      id: 'prestige',
      label: 'Prestige',
      visible: function (s) { return s.scoreLog >= 8 || s.stats.prestiges > 0; },
    },
    {
      id: 'promote',
      label: 'Promote',
      visible: function (s) {
        var pending = Engine.canPrestige(s) ? Engine.pendingPrestige(s).pMult : 0;
        if (s.pMult >= Engine.TUNE.promoMin || pending >= Engine.TUNE.promoMin) return true;
        for (var i = 0; i < s.promo.length; i++) if (s.promo[i] > 0) return true;
        return false;
      },
    },
    {
      id: 'infinity',
      label: '∞',
      visible: function (s) { return s.infinities >= 1 || s.inf.ipLog > -Infinity; },
    },
    { id: 'stats', label: 'Stats', visible: function () { return true; } },
    { id: 'settings', label: 'Settings', visible: function () { return true; } },
  ];

  var ICONS = {
    stats: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
    settings: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  };

  var PROMO_META = [
    { key: 'p1', name: 'Mult Gain' },
    { key: 'p2', name: 'Lap Speed' },
    { key: 'p3', name: 'Ascension Power' },
    { key: 'p4', name: 'Promotion Power' },
  ];

  // ---------- small helpers ----------

  function cloneState(s) {
    return Engine.deserialize(Engine.serialize(s));
  }

  function fmt(x) {
    return Engine.fmtLog(x);
  }

  // Formats a plain (non-log) count such as state.infinities: an integer
  // most of the time, but passive-Infinity upgrades (18;1) can make it
  // fractional, so it gets 2 decimals only then.
  function fmtInf(n) {
    var frac = Math.abs(n - Math.round(n)) > 1e-9;
    try {
      return n.toLocaleString('en-US', frac ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
    } catch (e) {
      return String(n);
    }
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        if (k === 'class') node.className = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') {
          node.addEventListener(k.slice(2), attrs[k]);
        } else if (attrs[k] === false || attrs[k] === null || attrs[k] === undefined) {
          // skip
        } else {
          node.setAttribute(k, attrs[k]);
        }
      }
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function fmtTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    var parts = [];
    if (h > 0) parts.push(h + 'h');
    if (h > 0 || m > 0) parts.push(m + 'm');
    parts.push(s + 's');
    return parts.join(' ');
  }

  function markDirty() {
    dirty = true;
  }

  function twoStepConfirm(btn, label, confirmLabel, action) {
    var confirming = false;
    var timer = null;
    btn.textContent = label;
    btn.addEventListener('click', function () {
      if (!confirming) {
        confirming = true;
        btn.textContent = confirmLabel;
        btn.classList.add('confirming');
        timer = setTimeout(function () {
          confirming = false;
          btn.textContent = label;
          btn.classList.remove('confirming');
        }, CONFIRM_WINDOW);
      } else {
        clearTimeout(timer);
        confirming = false;
        btn.textContent = label;
        btn.classList.remove('confirming');
        action();
      }
    });
  }

  // ---------- toast ----------

  var toastTimer = null;

  function toast(msg) {
    if (!els.toast) return;
    els.toast.textContent = msg;
    els.toast.hidden = false;
    requestAnimationFrame(function () { els.toast.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('show');
      setTimeout(function () { els.toast.hidden = true; }, 220);
    }, 2500);
  }

  // ---------- modal ----------

  function showModal(node) {
    els.modal.innerHTML = '';
    els.modal.appendChild(node);
    els.modal.hidden = false;
  }

  function hideModal() {
    els.modal.hidden = true;
    els.modal.innerHTML = '';
    modalOpen = null;
  }

  function showOfflineModal(info) {
    modalOpen = 'offline';
    var gainLog = info.before === -Infinity ? info.after : Engine.logSub(info.after, info.before);
    var lines = [
      el('p', { class: 'help' }, [
        'You were gone for ' + fmtTime(info.seconds) + '.',
      ]),
      el('p', { class: 'stat-line' }, [
        el('span', { class: 'label' }, ['Score gained']),
        el('span', {}, [fmt(gainLog)]),
      ]),
    ];
    if (info.ipGainedLog !== undefined && info.ipGainedLog !== -Infinity) {
      lines.push(el('p', { class: 'stat-line' }, [
        el('span', { class: 'label' }, ['IP gained']),
        el('span', {}, ['+' + fmt(info.ipGainedLog)]),
      ]));
    }
    if (info.infinitiesGained) {
      lines.push(el('p', { class: 'stat-line' }, [
        el('span', { class: 'label' }, ['Infinities']),
        el('span', {}, ['+' + fmtInf(info.infinitiesGained)]),
      ]));
    }
    if (info.icCompleted && info.icCompleted.length) {
      info.icCompleted.forEach(function (n) {
        lines.push(el('p', { class: 'help' }, ['Challenge ' + n + ' completed']));
      });
    }
    var panel = el('div', { class: 'modal-panel' },
      [el('h2', { class: 'modal-title' }, ['While you were away'])]
        .concat(lines)
        .concat([el('button', { class: 'btn primary full-width', onclick: hideModal }, ['Continue'])]));
    showModal(panel);
  }

  function doGoInfinite() {
    if (Engine.goInfinite(state)) {
      hideModal();
      markDirty();
    }
  }

  function showInfinityModal() {
    modalOpen = 'infinity';
    var s = state.stats;
    var isFirst = state.infinities === 0;
    var panel;
    if (isFirst) {
      panel = el('div', { class: 'modal-panel' }, [
        el('h2', { class: 'modal-title' }, ['Infinity reached']),
        el('p', { class: 'help' }, [
          'You gained 1 Infinity Point. Spend it in the new \u221e tab.',
        ]),
        el('button', {
          class: 'btn primary full-width',
          onclick: doGoInfinite,
        }, ['Go Infinite']),
      ]);
    } else {
      panel = el('div', { class: 'modal-panel' }, [
        el('h2', { class: 'modal-title' }, ['Infinity reached']),
        el('p', { class: 'help' }, [
          'Score has exceeded what a number can hold. Going infinite resets your ' +
            'progress and keeps your upgrades, generators and Infinity Points.',
        ]),
        el('div', { class: 'kv-list' }, [
          statLine('Play time', fmtTime(s.playTime)),
          statLine('Total laps', String(s.totalLaps)),
          statLine('Prestiges', String(s.prestiges)),
          statLine('Promotions', String(s.promotions)),
        ]),
        el('button', {
          class: 'btn primary full-width',
          onclick: doGoInfinite,
        }, ['Go Infinite']),
      ]);
    }
    showModal(panel);
  }

  function statLine(label, value) {
    return el('div', { class: 'stat-line' }, [
      el('span', { class: 'label' }, [label]),
      el('span', {}, [value]),
    ]);
  }

  // Passed to InfinityUI so src/ui-infinity.js never touches window.Engine
  // for anything DOM/save-related; it only reads state and calls these.
  var kit = {
    el: el,
    fmt: fmt,
    toast: function (msg) { toast(msg); },
    twoStepConfirm: function (btn, label, confirmLabel, action) { twoStepConfirm(btn, label, confirmLabel, action); },
    statLine: statLine,
    markDirty: function () { markDirty(); },
    save: function () { save(); },
  };

  // ---------- multbar ----------

  function renderMultbar() {
    var frag = document.createDocumentFragment();
    var p = Engine.promoEffects(state);
    for (var i = 0; i < state.circles.length; i++) {
      var c = state.circles[i];
      if (!c.unlocked) continue;
      var def = Engine.CIRCLES[i];
      var chip = el('span', {
        class: 'chip',
        style: 'color:' + def.color + ';border-color:' + def.color,
        'data-tip': 'circleChip',
        'data-tip-i': String(i),
        tabindex: '0',
      }, [
        '\u00D7' + fmt(c.multLog),
      ]);
      frag.appendChild(chip);
    }
    frag.appendChild(el('span', { class: 'chip grey', 'data-tip': 'pMultChip', tabindex: '0' }, ['P \u00D7' + fmt(Math.log10(state.pMult))]));
    if (state.pExp > 1) {
      frag.appendChild(el('span', { class: 'chip grey', 'data-tip': 'pExpChip', tabindex: '0' }, ['^' + state.pExp.toFixed(3)]));
    }
    if (state.inf.gpLog > 0) {
      frag.appendChild(el('span', { class: 'chip grey', 'data-tip': 'gpChip', tabindex: '0' }, ['GP ×' + fmt(Engine.gpMultLog(state))]));
    }
    if (state.infinities > 0) {
      frag.appendChild(el('span', { class: 'chip grey' }, ['\u221E ' + state.infinities]));
    }
    els.multbarChips.innerHTML = '';
    els.multbarChips.appendChild(frag);
  }

  // ---------- scorebox ----------

  function updateScorebox() {
    els.score.textContent = fmt(state.scoreLog);
    var income = Engine.incomeLog(state);
    els.income.textContent = fmt(income) + ' /s';
  }

  // ---------- nav / tabs ----------

  function computeVisibleTabs() {
    return TABS.filter(function (t) { return t.visible(state); });
  }

  function syncFromHash() {
    var id = (location.hash || '#circles').replace('#', '');
    var visible = computeVisibleTabs().map(function (t) { return t.id; });
    currentTab = visible.indexOf(id) !== -1 ? id : 'circles';
    markDirty();
    renderNav();
  }

  function renderNav() {
    var visible = computeVisibleTabs();
    els.tabs.innerHTML = '';
    visible.forEach(function (t) {
      var attrs = {
        class: 'tab-btn',
        role: 'tab',
        'aria-selected': String(t.id === currentTab),
        onclick: function () { location.hash = '#' + t.id; },
      };
      // Only Stats/Settings get the label/icon pair the <420px media query
      // swaps between; other tabs keep a plain text child so that query
      // (which only targets .tab-label/.tab-icon) never touches them.
      var kids;
      if (ICONS[t.id]) {
        attrs['aria-label'] = t.label;
        kids = [
          el('span', { class: 'tab-label' }, [t.label]),
          el('span', { class: 'tab-icon', 'aria-hidden': 'true', html: ICONS[t.id] }),
        ];
      } else {
        kids = [t.label];
      }
      els.tabs.appendChild(el('button', attrs, kids));
    });
  }

  function checkTabsVisibility() {
    var ids = computeVisibleTabs().map(function (t) { return t.id; }).join(',');
    if (ids !== lastVisibleTabIds) {
      lastVisibleTabIds = ids;
      renderNav();
      if (computeVisibleTabs().map(function (t) { return t.id; }).indexOf(currentTab) === -1) {
        currentTab = 'circles';
      }
      markDirty();
    }
  }

  // ---------- circles tab ----------

  function buyPreview(i, mode) {
    var targetN = mode === 'max' ? Infinity : Number(mode);
    var clone = cloneState(state);
    var totalCostLog = -Infinity;
    var count = 0;
    while (count < targetN) {
      var costLog = Engine.costLog(clone, i);
      var bought = Engine.buy(clone, i, 1);
      if (bought === 0) break;
      totalCostLog = Engine.logAdd(totalCostLog, costLog);
      count++;
    }
    return { count: count, totalCostLog: totalCostLog };
  }

    ['1', '10', 'max'].forEach(function (m) {
      var label = m === 'max' ? 'Max' : '\u00D7' + m;
      var btn = el('button', {
        'aria-pressed': String(buyMode === m),
        onclick: function () {
          buyMode = m;
          markDirty();
        },

    wrap.appendChild(modeRow);

  function onKeyDown(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (modalOpen) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'm' || e.key === 'M') {
      var modes = ['1', '10', 'max'];
      buyMode = modes[(modes.indexOf(buyMode) + 1) % modes.length];
      markDirty();
      return;
    }
    if (e.key === '?' || e.key === 'h' || e.key === 'H') {
      if (Help) Help.showIntro();
      return;
    }
    var digit = e.key;
    var idx = -1;
    if (digit >= '1' && digit <= '9') idx = Number(digit) - 1;
    else if (digit === '0') idx = 9;
    if (idx >= 0 && idx < state.circles.length) {
      var n = buyMode === 'max' ? 'max' : Number(buyMode);
      var wasUnlockedNext = state.circles[idx + 1] ? state.circles[idx + 1].unlocked : true;
      var bought = Engine.buy(state, idx, n);
      if (bought > 0) {
