<title>Rev Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>:root {
  color-scheme: dark;
  --ink: #07060d;
  --panel: #100e1a;
  --panel-2: #161327;
  --line: #262238;
  --text: #ece9f7;
  --muted: #8e88aa;
  --accent: #c9b8ff;
  --warn: #ffb454;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
}

body {
  font-size: 14px;
  line-height: 1.4;
}

button, input, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#app {
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "multbar multbar"
    "stage panel";
}

@media (max-width: 820px) {
  #app {
    height: auto;
    min-height: 100%;
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(46vh, auto) auto;
    grid-template-areas:
      "multbar"
      "stage"
      "panel";
  }
}

/* ---------- multbar ---------- */

#multbar {
  grid-area: multbar;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  min-height: 20px;
  /* A grid item's automatic min-width defaults to its min-content size
     (here: every chip laid out with no wrap), which — with 6+ rings
     unlocked — can exceed the viewport and widen the whole 1fr column,
     clipping content elsewhere (panel Buy buttons at 375px). min-width:0
     lets .multbar-chips's own overflow-x:auto handle it instead. */
  min-width: 0;
}

#stage, #panel {
  min-width: 0;
}

.multbar-chips {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  overflow-x: auto;
}

.help-btn {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 600;
  line-height: 1;
  padding: 0;
}

.help-btn:hover { color: var(--text); border-color: var(--muted); }

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  white-space: nowrap;
  color: var(--muted);
}

.chip.grey { color: var(--muted); border-color: var(--line); }

/* ---------- stage / canvas ---------- */

#stage {
  grid-area: stage;
  position: relative;
  overflow: hidden;
  background: var(--ink);
  min-height: 0;
}

#orbits {
  display: block;
  width: 100%;
  height: 100%;
}

#scorebox {
  position: absolute;
  left: 16px;
  bottom: 16px;
  pointer-events: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
}

#score {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 48px);
  letter-spacing: -0.01em;
}

#income {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-size: 14px;
  margin-top: 2px;
}

#infinity-btn {
  pointer-events: auto;
  margin-top: 10px;
}

/* ---------- panel / tabs ---------- */

#panel {
  grid-area: panel;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-left: 1px solid var(--line);
}

@media (max-width: 820px) {
  #panel { border-left: none; border-top: 1px solid var(--line); }
}

#tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 12px 16px 0;
  border-bottom: 1px solid var(--line);
}

.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  border-bottom: none;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
}

.tab-btn:hover { color: var(--text); }

.tab-btn[aria-selected="true"] {
  color: var(--text);
  border-color: var(--line);
  background: var(--panel-2);
}

#tab-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
}

.tab-body-inner > * + * { margin-top: 14px; }

h2.section-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 0;
  color: var(--text);
}

p.help {
  color: var(--muted);
  margin: 0;
}

/* ---------- buy mode segmented control ---------- */

#buy-mode {
  display: flex;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  width: fit-content;
}

#buy-mode button {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
}

#buy-mode button[aria-pressed="true"] {
  background: var(--panel-2);
  color: var(--text);
}

/* ---------- circle rows ---------- */

.circle-row {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
}

.circle-row.locked {
  opacity: 0.5;
  grid-template-columns: 12px 1fr;
}

.swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: 0 0 8px 1px currentColor;
}

.circle-info { min-width: 0; }

.circle-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
}

.circle-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  margin-top: 2px;
}

.circle-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: stretch;
}

/* ---------- buttons ---------- */

.btn {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
}

.btn:hover:not(:disabled) { border-color: var(--muted); }

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn.affordable {
  color: var(--circle, var(--accent));
  border-color: var(--circle, var(--accent));
}

.btn.primary {
  color: var(--accent);
  border-color: var(--accent);
}

.btn.ascend {
  color: var(--ink);
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 16px 2px rgba(201, 184, 255, 0.55);
  animation: ascend-pulse 2.2s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  .btn.ascend { animation: none; }
}

@keyframes ascend-pulse {
  0%, 100% { box-shadow: 0 0 12px 1px rgba(201, 184, 255, 0.45); }
  50% { box-shadow: 0 0 22px 4px rgba(201, 184, 255, 0.75); }
}

.btn.confirming {
  color: var(--warn);
  border-color: var(--warn);
}

.btn.full-width { width: 100%; }

/* ---------- prestige / promote ---------- */

.stat-line {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

.stat-line .label { color: var(--muted); font-family: var(--font-body); }

.card {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--panel-2);
}

.card + .card { margin-top: 10px; }

.card-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 6px;
}

/* ---------- stats / settings ---------- */

.kv-list { display: flex; flex-direction: column; gap: 6px; }

textarea.save-area {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-mono);
  padding: 8px;
}

.error-text { color: var(--warn); font-size: 12px; min-height: 1em; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- modal / toast ---------- */

#modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4, 3, 8, 0.75);
  z-index: 20;
  padding: 16px;
}

#modal[hidden] { display: none; }

.modal-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  max-width: 420px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

.modal-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  margin: 0 0 12px;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(8px);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 30;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

#toast[hidden] { display: none; }

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  #toast { transition: none; }
}

/* ---------- tooltip ---------- */

#tip {
  position: fixed;
  z-index: 40;
  left: 0;
  top: 0;
  max-width: 260px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

#tip[hidden] { display: none; }

#tip.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  #tip { transition: none; }
}

/* ---------- intro modal beats ---------- */

.help-beat {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.help-glyph {
  flex: none;
  width: 16px;
  height: 16px;
  margin-top: 2px;
  border-radius: 50%;
  border: 2px solid;
  background: transparent;
}

.help-beat-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
}

.help-beat-body {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}

.help-intro-actions {
  margin-top: 4px;
}

/* ---------- tab label / icon collapse (Stats, Settings < 420px) ---------- */

.tab-icon {
  display: none;
  align-items: center;
  justify-content: center;
}

.tab-icon svg { display: block; }

@media (max-width: 419px) {
  .tab-label { display: none; }
  .tab-icon { display: inline-flex; }
}

/* ---------- catch-up overlay (offline / hidden-tab, non-blocking) ---------- */

.progress-bar {
  height: 10px;
  margin: 14px 0 8px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.15s ease;
}

/* ---------- ∞ tab ---------- */

.inf-header {
  position: sticky;
  top: -16px;
  margin: -16px -16px 0;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

.inf-subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.sub-tab-btn {
  padding: 6px 10px;
  font-size: 12px;
}

.inf-tree {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.iu-col-label {
  font-family: var(--font-mono);
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 6px;
}

.iu-col.preview { opacity: 0.5; }

.iu-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.iu-card {
  min-height: 40px;
  min-width: 0;
  font-size: 12px;
  text-align: left;
  cursor: default;
  overflow-wrap: anywhere;
}

.iu-card.owned { border-color: var(--accent); }

.iu-card.buyable {
  cursor: pointer;
  border-color: var(--accent);
  box-shadow: 0 0 12px 2px var(--accent);
}

.iu-card.buyable:hover { box-shadow: 0 0 18px 3px var(--accent); }

.iu-card.locked { opacity: 0.5; }

/* Requirement met, just short on IP: less dim than a fully locked node
   (whose requirement isn't met at all), and its cost line is the one that
   should read as the blocker. */
.iu-card.unaffordable { opacity: 0.75; }
.iu-card.unaffordable .iu-cost { color: var(--warn); }

.iu-cost, .iu-effect, .iu-locked {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  margin-top: 2px;
  font-size: 11px;
}

.inf-gens {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gp-line { font-family: var(--font-mono); }

.gen-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
}

.gen-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
}

.gen-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}

/* ---------- ∞ tab: Auto ---------- */

.inf-auto { display: flex; flex-direction: column; gap: 10px; }

.auto-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.btn.toggle[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent);
}

.auto-dot-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}

.auto-dot {
  height: 40px;
  min-height: 40px;
  padding: 0;
  border-radius: 10px;
  border: 2px solid var(--line);
  background: var(--panel);
  cursor: pointer;
}

.auto-dot.active {
  background: currentColor;
  box-shadow: 0 0 8px 1px currentColor;
}

.auto-order-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.order-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 6px 10px;
  font-size: 11px;
}

.auto-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  font-size: 12px;
}

.auto-field-label { color: var(--muted); min-width: 0; }

.auto-input {
  width: 100px;
  min-width: 0;
  flex-shrink: 0;
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 8px;
  font-family: var(--font-mono);
  text-align: right;
}

/* ---------- ∞ tab: ICs ---------- */

.inf-ics { display: flex; flex-direction: column; }

.ic-break-card { border-color: var(--warn); }

.ic-card.owned { border-color: var(--accent); }

.ic-card.buyable {
  border-color: var(--warn);
  box-shadow: 0 0 12px 2px var(--warn);
}

.ic-card .card-title { margin-bottom: 8px; }
.ic-card .iu-effect { margin-top: 4px; }
.ic-card .stat-line { margin-top: 6px; }
.ic-card button { margin-top: 10px; }

/* ---------- ∞ tab: Stars ---------- */

.inf-stars { display: flex; flex-direction: column; gap: 10px; }

.star-buy-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel-2);
}

.star-buy-label {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.sd-row .card-title { margin-bottom: 4px; }
.sd-row button { margin-top: 8px; }

/* ---------- guide: goal-pulse highlight ---------- */

.guide-pulse {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  animation: guide-pulse 1.8s ease-in-out infinite;
}

.guide-pulse.guide-pulse-strong {
  outline-width: 3px;
  animation: guide-pulse-strong 0.8s ease-in-out infinite;
}

@keyframes guide-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201, 184, 255, 0.55); }
  50% { box-shadow: 0 0 0 6px rgba(201, 184, 255, 0); }
}

@keyframes guide-pulse-strong {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201, 184, 255, 0.8); }
  50% { box-shadow: 0 0 0 10px rgba(201, 184, 255, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .guide-pulse, .guide-pulse.guide-pulse-strong { animation: none; box-shadow: 0 0 0 3px rgba(201, 184, 255, 0.55); }
}

/* ---------- guide: journey strip ---------- */

.guide-journey {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.guide-journey-stage {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
}

.guide-journey-stage.reached { color: var(--text); border-color: var(--muted); }

.guide-journey-stage.current {
  color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 8px 1px rgba(201, 184, 255, 0.4);
}

/* ---------- guide: next-goal card ---------- */

.guide-card {
  pointer-events: auto;
  margin-top: 10px;
  width: min(320px, 100%);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}

.guide-card[hidden] { display: none; }

.guide-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.guide-card-collapse {
  flex: none;
  width: 40px;
  height: 40px;
  min-height: 40px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.guide-card-title {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.guide-card-pct {
  flex: none;
  font-family: var(--font-mono);
  color: var(--muted);
  font-size: 12px;
}

.guide-card-body {
  margin-top: 8px;
  max-height: 28vh;
  overflow-y: auto;
}

.guide-card-progress-text {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.guide-card-why {
  font-size: 12px;
  margin-top: 8px;
}

.guide-card-done {
  color: var(--accent);
  font-size: 13px;
  padding: 4px 0;
}

.guide-card .row { margin-top: 8px; }
.guide-card .btn { min-height: 40px; padding: 8px 12px; font-size: 12px; }
.guide-card .guide-journey { margin-top: 10px; }
.guide-card-collapsed-showme { flex: none; white-space: nowrap; }
.guide-card.collapsed .guide-card-head { min-height: 40px; }

@media (max-width: 820px) {
  .guide-card {
    width: auto;
    max-width: calc(100vw - 32px);
    margin: 10px 0 0;
  }
  .guide-card-body { max-height: 22vh; }
}

/* ---------- guide: intro / full guide panel ---------- */

.guide-objective { margin-bottom: 4px; }

.guide-panel {
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  text-align: left;
}

<div id="app">
  <header id="multbar" aria-label="Multipliers"></header>
  <main id="stage"><canvas id="orbits" aria-label="Orbiting circles"></canvas>
    <div id="scorebox"><div id="score">0</div><div id="income">0 /s</div></div></main>
  <aside id="panel">

<script>// Rev Idle engine — pure state + formulas + tick + (later) serialize.
// UMD-ish: module.exports in Node, window.Engine in browser.
// Structured so Task 2 (ascension/prestige/promotions/serialize) can add
// functions and slot them into the returned Engine object below.

const Engine = (() => {
  const CIRCLES = [
    { name: 'Red', color: '#ff3b4f', initCost: 4, costMult: 1.20, baseSpeed: 0.2 },
    { name: 'Orange', color: '#ff8a2a', initCost: 100, costMult: 1.24, baseSpeed: 0.1 },
    { name: 'Yellow', color: '#ffd93b', initCost: 1e3, costMult: 1.28, baseSpeed: 1 / 15 },
    { name: 'Green', color: '#4dff6a', initCost: 1e4, costMult: 1.32, baseSpeed: 0.05 },
    { name: 'Turquoise', color: '#2affc6', initCost: 1e6, costMult: 1.36, baseSpeed: 0.04 },
    { name: 'Cyan', color: '#2ad9ff', initCost: 1e9, costMult: 1.40, baseSpeed: 1 / 30 },
    { name: 'Blue', color: '#3b6bff', initCost: 1e12, costMult: 1.44, baseSpeed: 1 / 35 },
    { name: 'Purple', color: '#a24dff', initCost: 1e15, costMult: 1.48, baseSpeed: 0.025 },
    { name: 'Pink', color: '#ff4dd2', initCost: 1e18, costMult: 1.52, baseSpeed: 1 / 45 },
    { name: 'White', color: '#f4f1ff', initCost: 1e27, costMult: 1.56, baseSpeed: 0.02 },
  ];

  const INFINITY_LOG = Math.log10(1.79e308);

  const TUNE = {
    pMultBase: 2.56,
    pMultPow: 2.25,
    pExpDiv: 225,
    prestigeMinLog: 10,
    promoMin: 2000, // tuned (spec: 1000) — see test/sim.js / task-3 report
    promoPow: 0.75,
    // log10 of a fresh circle's base mult gain. Spec/wiki: 0.01; tuned to 0.04
    // so the first prestige lands at ~10 min instead of ~28 min (task-3 report).
    multGainLog0: Math.log10(0.04),
  };

  const DEFAULT_MODS = Object.freeze({
    lapMult: 1, gainLog: 0, expAdd: 0, prodLog: 0, ascBase: 10, ascMult: 1,
    v: Object.freeze([1, 1, 1, 1]), pMultMult: 1, pExpMult: 1, gainPow: 1,
    disabledPromo: Object.freeze([]), maxCircles: 10, noAscend: false, decay: 0,
  });

  const hooks = { mods: null, preTick: null, auto: null, postTick: null, stepDt: null };

  function registerHooks(h) {
    for (const k of Object.keys(h)) if (k in hooks) hooks[k] = h[k];
  }

  function mods(s) {
    return hooks.mods ? hooks.mods(s) : DEFAULT_MODS;
  }

  function isFixed(s) {
    return !(s.inf.broken && s.inf.ic.active === 0);
  }

  // --- log-space helpers ---

  function logAdd(a, b) {
    if (a === -Infinity) return b;
    if (b === -Infinity) return a;
    if (a < b) { const t = a; a = b; b = t; }
    return a + Math.log10(1 + 10 ** (b - a));
  }

  function logSub(a, b) {
    // requires a >= b
    if (b === -Infinity) return a;
    if (Math.abs(a - b) < 1e-12) return -Infinity;
    return a + Math.log10(1 - 10 ** (b - a));
  }

  // --- state ---

  function freshCircle(i) {
    return {
      unlocked: i === 0,
      level: i === 0 ? 5 : 0,
      bought: 0,
      ascensions: 0,
      multLog: 0,
      multGainLog: TUNE.multGainLog0,
      progress: 0,
      laps: 0,
    };
  }

  function newState() {
    return {
      v: 2,
      scoreLog: -Infinity,
      circles: CIRCLES.map((_, i) => freshCircle(i)),
      pMult: 1,
      pExp: 1,
      prestigeReqLog: TUNE.prestigeMinLog,
      promo: [0, 0, 0, 0],
      infinities: 0,
      stats: {
        totalLaps: 0, prestiges: 0, promotions: 0, playTime: 0, bestScoreLog: -Infinity,
        fastestInfinity: null, lastInfinities: [], totalIpLog: -Infinity,
      },
      savedAt: 0,
      inf: {
        ipLog: -Infinity,
        upg: {},
        gens: Array.from({ length: 10 }, () => ({ b: 0, aLog: -Infinity })),
        gpLog: -Infinity,
        t: 0, tRun: 0,
        broken: false, pendingConfirm: false, finaleSeen: false,
        ic: { active: 0, done: Array(9).fill(false), best: Array(9).fill(null) },
        stars: { n: 0, nb: 0, ne: 0, sdLog: -Infinity, sdU: [0, 0, 0, 0] },
        auto: {
          buy: { on: true, circles: Array(10).fill(true) },
          asc: { on: true, circles: Array(10).fill(true) },
          promote: { on: true, order: [0, 1, 2, 3], xFactor: 2, minTime: 1 },
          prestige: { on: true, multX: 10, expGain: 0, minTime: 0.2 },
          infinity: { on: false, minIpLog: 0, minTime: 0 },
          stallSec: 30,
          confirmInfinity: false,
        },
        rt: { markLog: -Infinity, markT: 0 },
      },
    };
  }

  // --- merge / migrate ---

  // Fills missing keys from the defaults and coerces type-mismatched leaves
  // back to them (hostile or corrupt imports): a number default needs a
  // finite number (or -Infinity where the default is -Infinity, the log-zero),
  // a null default (fastestInfinity, IC best times) needs null or a finite
  // number >= 0, a boolean default a boolean. Default-empty arrays
  // (stats.lastInfinities) keep only plain-object entries; default-empty
  // objects (inf.upg) keep only `true` flags.
  function mergeDefaults(def, obj) {
    if (Array.isArray(def)) {
      if (!Array.isArray(obj)) return def;
      if (def.length === 0) return obj.filter((x) => x !== null && typeof x === 'object' && !Array.isArray(x));
      return def.map((d, i) => (i < obj.length ? mergeDefaults(d, obj[i]) : d));
    }
    if (def === null) return typeof obj === 'number' && Number.isFinite(obj) && obj >= 0 ? obj : null;
    if (typeof def === 'object') {
      if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) return def;
      const keys = Object.keys(def);
      if (keys.length === 0) {
        const out = {};
        for (const k of Object.keys(obj)) if (obj[k] === true && k !== '__proto__') out[k] = true;
        return out;
      }
      const out = {};
      for (const k of keys) {
        out[k] = k in obj ? mergeDefaults(def[k], obj[k]) : def[k];
      }
      return out;
    }
    if (typeof def === 'number') {
      if (typeof obj !== 'number' || Number.isNaN(obj)) return def;
      if (Number.isFinite(obj) || (obj === -Infinity && def === -Infinity)) return obj;
      return def;
    }
    return typeof obj === typeof def ? obj : def;
  }

  const nonNegInt = (x, max) => Math.min(max, Math.max(0, Math.floor(x)));

  // Clamps values the type check alone lets through but the formulas cannot
  // take (spec §3 invariants): multipliers below 1, negative or fractional
  // levels and counts, out-of-range indices. Caps on counts that drive
  // O(n) loops (ascensions, stars) are far above anything reachable.
  function sanitize(s) {
    s.pMult = Math.max(1, s.pMult); s.pExp = Math.max(1, s.pExp);
    s.promo = s.promo.map((x) => nonNegInt(x, 1e15));
    s.infinities = Math.max(0, s.infinities);
    for (const c of s.circles) {
      c.ascensions = nonNegInt(c.ascensions, 1e5);
      c.level = nonNegInt(c.level, levelCap(c)); c.bought = nonNegInt(c.bought, 1e15); c.laps = Math.max(0, c.laps);
      if (!(c.progress >= 0 && c.progress < 1)) c.progress = 0;
      c.multLog = Math.max(0, c.multLog);
    }
    if (!s.circles[0].unlocked) s.circles[0].unlocked = true;
    const st = s.stats;
    st.lastInfinities = st.lastInfinities
      .filter((e) => typeof e.t === 'number' && Number.isFinite(e.t) && typeof e.ipGainLog === 'number' && Number.isFinite(e.ipGainLog))
      .map((e) => ({ t: Math.max(0, e.t), ipGainLog: e.ipGainLog })).slice(-10);
    for (const k of ['totalLaps', 'prestiges', 'promotions', 'playTime']) st[k] = Math.max(0, st[k]);
    const f = s.inf;
    f.t = Math.max(0, f.t); f.tRun = Math.max(0, f.tRun);
    f.gens.forEach((g) => { g.b = nonNegInt(g.b, 1e15); });
    f.ic.active = nonNegInt(f.ic.active, 9);
    const st2 = f.stars;
    st2.n = nonNegInt(st2.n, 1e4); st2.nb = nonNegInt(st2.nb, 1e6); st2.ne = nonNegInt(st2.ne, 1e6);
    st2.sdU = st2.sdU.map((x) => nonNegInt(x, 1e15));
    const a = f.auto;
    const ord = a.promote.order;
    if (ord.some((k) => !Number.isInteger(k) || k < 0 || k > 3)) a.promote.order = [0, 1, 2, 3];
    a.promote.xFactor = Math.max(1, a.promote.xFactor); a.prestige.multX = Math.max(1, a.prestige.multX);
    for (const o of [a.promote, a.prestige, a.infinity]) o.minTime = Math.max(0, o.minTime);
    a.prestige.expGain = Math.max(0, a.prestige.expGain); a.stallSec = Math.max(0, a.stallSec);
    return s;
  }

  function migrate(obj) {
    if (!obj || typeof obj !== 'object' || (obj.v !== 1 && obj.v !== 2) ||
        !Array.isArray(obj.circles) || obj.circles.length !== 10) {
      throw new Error('Invalid save');
    }
    if (obj.v === 1) {
      obj.inf = Object.assign({}, obj.inf, { ipLog: obj.ip > 0 ? Math.log10(obj.ip) : -Infinity });
    }
    return sanitize(Object.assign(mergeDefaults(newState(), obj), { v: 2 }));
  }

  // --- formulas ---

  // `m` (mods(s)) may be passed in precomputed to avoid recomputing it
  // (mods() aggregates upgrade/challenge/star contributors and isn't free);
  // callers that don't have it handy can omit it and it's computed here.
  function promoEffects(s, m) {
    m = m || mods(s);
    const L = s.promo.map((x, k) => (m.disabledPromo.includes(k) ? 0 : x));
    const p4 = 1 + 0.05 * Math.pow(L[3], 0.48) * m.v[3];
    const p1 = p4 * (Math.floor(Math.pow(L[0], 1.5)) * m.v[0] + 1);
    const p2 = p4 * (1 + Math.sqrt(L[1]) * m.v[1]);
    const p3 = p4 * (m.ascBase + Math.pow(L[2], 0.82) * m.v[2]) * m.ascMult;
    return { p1, p2, p3, p4 };
  }

  function levelCap(circle) {
    return 100 + 10 * circle.ascensions;
  }

  function lapsPerSec(s, i, m) {
    const c = s.circles[i];
    if (!c.unlocked) return 0;
    m = m || mods(s);
    const def = CIRCLES[i];
    const p = promoEffects(s, m);
    return c.level * def.baseSpeed * p.p2 * m.lapMult;
  }

  function multGainPerLapLog(s, i, m) {
    m = m || mods(s);
    return s.circles[i].multGainLog + Math.log10(promoEffects(s, m).p1) + m.gainLog;
  }

  function costLog(s, i) {
    const c = s.circles[i];
    const def = CIRCLES[i];
    const a = c.ascensions;
    const m = def.costMult;
    let sum = Math.log10(def.initCost);
    for (let k = 0; k < a; k++) {
      sum += (100 + 10 * k) * Math.log10(m + 0.1 * k);
    }
    sum += c.level * Math.log10(m + 0.1 * a);
    return sum;
  }

  function buy(s, i, n) {
    const c = s.circles[i];
    if (!c.unlocked) return 0;
    const cap = levelCap(c);
    const unlimited = n === 'max';
    let count = 0;
    while ((unlimited || count < n) && c.level < cap) {
      const cost = costLog(s, i);
      if (s.scoreLog >= cost) {
        s.scoreLog = logSub(s.scoreLog, cost);
        c.level++;
        c.bought++;
        count++;
      } else {
        break;
      }
    }
    if (c.bought >= 5 && i + 1 < mods(s).maxCircles) {
      const next = s.circles[i + 1];
      if (next && !next.unlocked) {
        next.unlocked = true;
        next.level = 0;
      }
    }
    return count;
  }

  function perRevLog(s, m) {
    m = m || mods(s);
    let sum = 0;
    for (const c of s.circles) {
      if (c.unlocked) sum += c.multLog;
    }
    sum += Math.log10(s.pMult) + m.prodLog;
    return Math.max(0.1, s.pExp + m.expAdd) * sum;
  }

  function incomeLog(s) {
    let sum = 0;
    for (let i = 0; i < s.circles.length; i++) sum += lapsPerSec(s, i);
    if (sum <= 0) return -Infinity;
    return perRevLog(s) + Math.log10(sum);
  }

  function tick(s, dt) {
    // m is taken before the clock advances: like every other rate in this
    // explicit-Euler step, time-dependent mods (IC7's prodLog penalty and
    // its completion reward) use the start-of-step t. The difference in
    // prodLog is 2·log10(t/(t-dt)): under 0.03 once t >= 60 s with dt <= 2.
    const m = mods(s);
    s.inf.t += dt;
    s.inf.tRun += dt;
    if (hooks.preTick) hooks.preTick(s, dt, m);

    const p = promoEffects(s, m);
    const laps = new Array(s.circles.length).fill(0);
    let N = 0;
    for (let i = 0; i < s.circles.length; i++) {
      const c = s.circles[i];
      if (!c.unlocked) continue;
      const def = CIRCLES[i];
      const lps = c.level * def.baseSpeed * p.p2 * m.lapMult;
      c.progress += lps * dt;
      const n = Math.floor(c.progress);
      c.progress -= n;
      c.laps += n;
      laps[i] = n;
      if (n > 0) {
        c.multLog = logAdd(c.multLog, Math.log10(n) + c.multGainLog + Math.log10(p.p1) + m.gainLog);
      }
      N += n;
    }

    if (m.decay > 0) {
      for (const c of s.circles) {
        c.multLog = Math.max(0, c.multLog * Math.pow(1 - m.decay, dt));
      }
    }

    if (N > 0) {
      s.scoreLog = logAdd(s.scoreLog, Math.log10(N) + perRevLog(s, m));
    }
    if (isFixed(s) && s.scoreLog > INFINITY_LOG) s.scoreLog = INFINITY_LOG;

    s.stats.totalLaps += N;
    s.stats.playTime += dt;
    s.stats.bestScoreLog = Math.max(s.stats.bestScoreLog, s.scoreLog);

    if (hooks.auto) hooks.auto(s, dt);
    if (hooks.postTick) hooks.postTick(s, dt);
    return { laps };
  }

  function simulate(s, seconds, opts) {
    opts = opts || {};
    const before = {
      score: s.scoreLog,
      ip: s.inf.ipLog,
      inf: s.infinities,
      done: s.inf.ic.done.slice(),
    };
    let remaining = seconds;
    while (remaining > 1e-9) {
      const step = hooks.stepDt ? hooks.stepDt(s, opts) : (TUNE.dtFixed ?? 1);
      const dt = Math.min(step, remaining);
      tick(s, dt);
      remaining -= dt;
    }
    const ipAfter = s.inf.ipLog;
    const ipGainedLog = ipAfter > before.ip
      ? (before.ip === -Infinity ? ipAfter : logSub(ipAfter, before.ip))
      : -Infinity;
    const icCompleted = [];
    for (let i = 0; i < s.inf.ic.done.length; i++) {
      if (!before.done[i] && s.inf.ic.done[i]) icCompleted.push(i + 1);
    }
    return {
      scoreLogBefore: before.score,
      scoreLogAfter: s.scoreLog,
      ipGainedLog,
      infinitiesGained: s.infinities - before.inf,
      icCompleted,
    };
  }

  // --- reset helper ---

  function resetRun(s) {
    s.scoreLog = -Infinity;
    s.circles = CIRCLES.map((_, i) => freshCircle(i));
  }

  // --- ascension ---

  // Optional trailing `m` (mods(s)) on canAscend/ascend/pendingPrestige/
  // promoXp/canPromote lets hot callers (automation) pass a precomputed
  // mods object; omitted, it is computed here as before.
  function canAscend(s, i, m) {
    const c = s.circles[i];
    return c.unlocked && c.level >= levelCap(c) && !(m || mods(s)).noAscend;
  }

  function ascend(s, i, m) {
    m = m || mods(s);
    if (!canAscend(s, i, m)) return false;
    const c = s.circles[i];
    const p3 = promoEffects(s, m).p3;
    c.level = 5;
    c.ascensions++;
    c.multGainLog += Math.log10(p3);
    return true;
  }

  // --- prestige ---

  function rawPendingPMult(s, m) {
    if (s.scoreLog < 3) return 1;
    return TUNE.pMultBase * (s.scoreLog - 3) ** TUNE.pMultPow * m.pMultMult;
  }

  function pendingPrestige(s, m) {
    if (s.scoreLog < 3) return { pMult: 1, pExp: 1 };
    m = m || mods(s);
    const pMult = Math.pow(rawPendingPMult(s, m), m.gainPow);
    // Revolution-stage formulas are defined up to Infinity: while broken the
    // P.Exp gain reads the score capped at INFINITY_LOG (identical before Break),
    // otherwise pExp compounds each prestige and a broken run diverges.
    const pExp = 1 + (Math.max(0, Math.min(s.scoreLog, INFINITY_LOG) - 5) / TUNE.pExpDiv) * m.pExpMult * m.gainPow;
    return { pMult, pExp };
  }

  function canPrestige(s) {
    return s.scoreLog >= Math.max(TUNE.prestigeMinLog, s.prestigeReqLog);
  }

  function prestige(s) {
    if (!canPrestige(s) || awaitingInfinity(s)) return false;
    const g = pendingPrestige(s);
    s.pMult = Math.max(s.pMult, g.pMult);
    s.pExp = Math.max(s.pExp, g.pExp);
    s.prestigeReqLog = s.scoreLog;
    s.stats.prestiges++;
    resetRun(s);
    s.inf.tRun = 0;
    s.inf.rt = { markLog: -Infinity, markT: 0 };
    return true;
  }

  // --- promotions ---

  function promoXp(s, m) {
    m = m || mods(s);
    const pending = canPrestige(s) ? rawPendingPMult(s, m) : 0;
    const mm = Math.max(s.pMult, pending);
    if (mm < TUNE.promoMin) return 0;
    return Math.floor(Math.pow((mm / TUNE.promoMin) ** TUNE.promoPow, m.gainPow));
  }

  function canPromote(s, k, m) {
    m = m || mods(s);
    return !m.disabledPromo.includes(k) && promoXp(s, m) > s.promo[k];
  }

  function promote(s, k) {
    if (!canPromote(s, k) || awaitingInfinity(s)) return false;

    const g = E.pendingPrestige(s, m);

    const should = s.pMult === 1

<script>// src/render.js
// Canvas orbit renderer for Rev Idle. Attaches window.Renderer.
// Consumes Engine.CIRCLES / Engine.lapsPerSec via window.Engine at call time.
(function () {
  'use strict';

  var INK = '#07060d';
  var TWO_PI = Math.PI * 2;
  var MAX_PULSES = 40;
  var PULSE_LIFE = 0.5; // seconds
  var PULSE_COOLDOWN = 0.1; // seconds, per circle
  var FAST_LPS_THRESHOLD = 6;
  var TRAIL_SEGMENTS = 24;

  // Deterministic PRNG (mulberry32) so the starfield is seeded/stable.
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) {
      h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    }
    var num = parseInt(h, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  // Colors are drawn from a small fixed palette (Engine.CIRCLES, ~10 entries).
  // Parse each hex color exactly once and cache the result, keyed by the hex
  // string itself, so no per-frame/per-segment parsing or string building is
  // needed. Shared at module scope so multiple Renderer instances reuse it.
  var glowStopCache = Object.create(null);

  // Precomputed radial-gradient color-stop strings for a given hex color.
  // Gradients need the alpha baked into each stop's color (ctx.globalAlpha
  // applies to the whole fill, not per-stop), so this is the one place we
  // still need rgba() strings — computed once per unique color, then cached.
  function getGlowStops(hex) {
    var cached = glowStopCache[hex];
    if (cached) return cached;
    var c = hexToRgb(hex);
    var head = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',';
    cached = {
      s90: head + '0.9)',
      s35: head + '0.35)',
      s0: head + '0)'
    };
    glowStopCache[hex] = cached;
    return cached;
  }

  function prefersReducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) {
      return false;
    }
  }

  function create(canvas) {
    var ctx = canvas.getContext('2d');

    var width = 0; // CSS pixels
    var height = 0;
    var dpr = 1;

    var starCanvas = document.createElement('canvas');
    var starCtx = starCanvas.getContext('2d');

    var time = 0; // accumulated seconds, used for pulsing animations
    var reducedMotion = prefersReducedMotion();

    // Ring-buffer-ish pool of active lap-pulse ripples. Reused array, no per-frame alloc.
    var pulses = []; // { i, r, color, start }
    var lastSpawn = new Array(10).fill(-Infinity);

    function buildStarfield() {
      var w = Math.max(1, Math.floor(width));
      var h = Math.max(1, Math.floor(height));
      starCanvas.width = Math.max(1, Math.floor(w * dpr));
      starCanvas.height = Math.max(1, Math.floor(h * dpr));
      starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      starCtx.clearRect(0, 0, w, h);

      var rand = mulberry32(1337);
      var count = Math.round((w * h) / 2600);
      for (var k = 0; k < count; k++) {
        var x = rand() * w;
        var y = rand() * h;
        var r = rand() * 1.1 + 0.2;
        var a = rand() * 0.5 + 0.1;
        starCtx.beginPath();
        starCtx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        starCtx.arc(x, y, r, 0, TWO_PI);
        starCtx.fill();
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = canvas.clientWidth || canvas.width || 1;
      var h = canvas.clientHeight || canvas.height || 1;
      width = w;
      height = h;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildStarfield();
    }

    function orbitRadius(i, minWH) {
      var rMax = 0.46 * minWH;
      var rMin = 0.08 * minWH;
      return rMin + (i * (rMax - rMin)) / 9;
    }

    function drawBackground(cx, cy, minWH) {
      ctx.fillStyle = INK;
      ctx.fillRect(0, 0, width, height);

      var vign = ctx.createRadialGradient(cx, cy, minWH * 0.1, cx, cy, minWH * 0.75);
      vign.addColorStop(0, 'rgba(20,16,36,0)');
      vign.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vign;
      ctx.fillRect(0, 0, width, height);

      ctx.drawImage(starCanvas, 0, 0, width, height);
    }

    function drawLockedTrack(cx, cy, r) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();
    }

    function drawFastRing(cx, cy, r, color) {
      var pulse = reducedMotion ? 0 : Math.sin(time * 4) * 0.6 + 0.6; // 0..1.2
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2 + pulse * 1.4;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14 + pulse * 6;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();
    }

    function drawTrackAndDot(cx, cy, r, color, progress, lps) {
      // Track
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();

      var angle = progress * TWO_PI - Math.PI / 2;

      // Comet trail: arc behind the dot. Uses ctx.globalAlpha per segment
      // with the raw hex strokeStyle so no per-segment color string is
      // built or parsed.
      var trailFrac = Math.min(0.9, lps * 0.25);
      if (trailFrac > 0.001) {
        var trailLen = trailFrac * TWO_PI;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        for (var s = 0; s < TRAIL_SEGMENTS; s++) {
          var t0 = s / TRAIL_SEGMENTS;
          var t1 = (s + 1) / TRAIL_SEGMENTS;
          var a0 = angle - trailLen * t0;
          var a1 = angle - trailLen * t1;
          ctx.globalAlpha = (1 - t1) * 0.5;
          ctx.beginPath();
          ctx.arc(cx, cy, r, a0, a1, true);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Dot
      var dotR = 4 + Math.min(1, lps / FAST_LPS_THRESHOLD) * 2;
      var dx = cx + r * Math.cos(angle);
      var dy = cy + r * Math.sin(angle);
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(dx, dy, dotR, 0, TWO_PI);
      ctx.fill();
      ctx.restore();
    }

    function spawnPulseIfNeeded(i, r, color, lapsCount) {
      if (reducedMotion) return;
      if (!lapsCount || lapsCount <= 0) return;
      if (time - lastSpawn[i] < PULSE_COOLDOWN) return;
      lastSpawn[i] = time;
      if (pulses.length >= MAX_PULSES) {
        pulses.shift();
      }
      pulses.push({ i: i, r: r, color: color, start: time });
    }

    function drawPulses(cx, cy) {
      if (pulses.length === 0) return;
      var kept = [];
      for (var p = 0; p < pulses.length; p++) {
        var pulse = pulses[p];
        var age = time - pulse.start;
        if (age >= PULSE_LIFE) continue;
        var frac = age / PULSE_LIFE;
        var radius = pulse.r + frac * 26;
        ctx.save();
        ctx.globalAlpha = (1 - frac) * 0.55;
        ctx.strokeStyle = pulse.color;
        ctx.lineWidth = 2 * (1 - frac) + 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, TWO_PI);
        ctx.stroke();
        ctx.restore();
        kept.push(pulse);
      }
      pulses.length = 0;
      for (var k = 0; k < kept.length; k++) pulses.push(kept[k]);
    }

    function drawCoreGlow(cx, cy, minWH, color) {
      var radius = Math.max(10, minWH * 0.07);
      var stops = getGlowStops(color);
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      grad.addColorStop(0, stops.s90);
      grad.addColorStop(0.4, stops.s35);
      grad.addColorStop(1, stops.s0);
      ctx.save();
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TWO_PI);
      ctx.fill();
      ctx.restore();
    }

    function draw(state, dt, lapsThisTick) {
      time += dt || 0;
      reducedMotion = prefersReducedMotion();

      var Engine = window.Engine;
      var cx = width / 2;
      var cy = height / 2;
      var minWH = Math.min(width, height);

      drawBackground(cx, cy, minWH);

      var highestColor = '#a24dff';
      var haveUnlocked = false;

      var circles = (state && state.circles) || [];
      var count = Math.min(10, circles.length);

      for (var i = 0; i < count; i++) {
        var circleState = circles[i];
        var r = orbitRadius(i, minWH);

        if (!circleState || !circleState.unlocked) {
          drawLockedTrack(cx, cy, r);
          continue;
        }

        var cfg = (Engine && Engine.CIRCLES && Engine.CIRCLES[i]) || { color: '#ffffff' };
        var color = cfg.color;
        var lps = Engine && typeof Engine.lapsPerSec === 'function' ? Engine.lapsPerSec(state, i) : 0;

        if (lps > FAST_LPS_THRESHOLD) {
          drawFastRing(cx, cy, r, color);
        } else {
          drawTrackAndDot(cx, cy, r, color, circleState.progress || 0, lps);
        }

        var lapsCount = lapsThisTick && lapsThisTick[i];
        spawnPulseIfNeeded(i, r, color, lapsCount);

        highestColor = color;
        haveUnlocked = true;
      }

      drawPulses(cx, cy);
      drawCoreGlow(cx, cy, minWH, haveUnlocked ? highestColor : '#3b2a55');
    }

    // hitTest(x, y, state): x/y are CSS-pixel coordinates relative to the
    // canvas. Returns the index of the unlocked ring whose orbit passes
    // within tolerance of the pointer's distance from centre, else -1.
    // Reuses orbitRadius so the hit tolerance always matches what's drawn.
    function hitTest(x, y, state) {
      var cx = width / 2;
      var cy = height / 2;
      var minWH = Math.min(width, height);
      var dist = Math.hypot(x - cx, y - cy);
      var circles = (state && state.circles) || null;
      var spacing = (0.46 * minWH - 0.08 * minWH) / 9;
      var tolerance = Math.max(8, spacing / 2);
      var best = -1;
      var bestDelta = Infinity;
      for (var i = 0; i < 10; i++) {
        if (!circles || !circles[i] || !circles[i].unlocked) continue;
        var r = orbitRadius(i, minWH);
        var delta = Math.abs(dist - r);
        if (delta <= tolerance && delta < bestDelta) {
          bestDelta = delta;
          best = i;
        }
      }
      return best;
    }

    resize();

    return { draw: draw, resize: resize, hitTest: hitTest };
  }

  window.Renderer = { create: create };
})();
</script>

(function () {

  var LONGPRESS_MS = 450;
  var TIP_MARGIN = 8;
  var TIP_MAX_WIDTH = 260;

  var Engine = window.Engine;

  // ---------- hooks (wired by ui.js via Help.init) ----------

  var hooks = {
    toast: function () {},
    isModalOpen: function () { return null; },
    showModal: function () {},
    hideModal: function () {},
    getState: function () { return null; },
  };

  function init(h) {
    if (h) {
      for (var k in h) {
        if (Object.prototype.hasOwnProperty.call(h, k)) hooks[k] = h[k];
      }
    }
    seen = loadSeen();
  }

  // ---------- persisted "seen" flags ----------

  var seen = {};

  function loadSeen() {
    try {
      var raw = localStorage.getItem(HELP_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch (e) { /* ignore: help state is best-effort */ }
    return {};
  }

  function saveSeen() {
    try {
      localStorage.setItem(HELP_KEY, JSON.stringify(seen));
    } catch (e) { /* ignore */ }
  }

  function markSeen(key) {
    if (seen[key]) return false;
    seen[key] = true;
    saveSeen();
    return true;
  }

  function fmt(x) {
    return Engine.fmtLog(x);

        if (k === 'class') node.className = attrs[k];

    },

    goInfinite: function (s) {
      return 'Go Infinite: gain +' + fmt(Engine.ipGainLog(s)) + ' IP and +' + Engine.infGain(s)
        + ' Infinity, then restart the Revolution stage. Upgrades, generators and IP are kept.';
    },

    helpBtn: 'How to play (key: ? or H).',

    // ---- ∞ tab (Task 11) ----

    ipHeader: function (s) {
      return 'Infinity Points — earned each time you go Infinite. Next Infinity gives +'
        + fmt(Engine.ipGainLog(s)) + ' IP. Spend IP on the Tree, Generators and Stars.';
    },
    infCount: function (s) {
      return 'Infinities performed: ' + fmtInf(s.infinities) + '. Several upgrades grow stronger with more Infinities.';
    },
    iuCard: function (s, i) {
      var u = Engine.UPGRADES[i];
      if (!u) return '';
      var owned = Engine.hasUpg(s, u.id);
      var effect = Engine.upgEffect(s, u.id);
      var status;
      if (owned) {
        status = effect === null ? 'Owned.' : 'Owned — ' + effectText(u, effect) + '.';
      } else if (!Engine.upgReqMet(s, u.id)) {
        status = u.req === 'prev' ? 'Requires an earlier column’s upgrade.' : 'Requires ' + u.req.join(' or ') + '.';
      } else {
        // Requirement met — the only thing blocking it is IP.
        status = 'Requirement met — not enough IP yet.';
      }
      var descText = u.desc.charAt(u.desc.length - 1) === '.' ? u.desc : (u.desc + '.');
      return u.name + ' — ' + descText + ' Cost ' + fmt(Math.log10(u.cost)) + ' IP. ' + status;
    },
    gpLine: function (s) {
      return 'Generator Power multiplies every ring’s mult gain per lap by GP^' + Engine.gpExp(s).toFixed(3)
        + '. It resets each Infinity, so runs speed up as they go.';
    },
    genRow: function (s, k) {
      var n = k + 1;
      var g = s.inf.gens[k];
      var target = n === 1 ? 'GP' : ('G' + (n - 1));
      return 'G' + n + ': you have ' + fmt(g.aLog) + ' (' + g.b + ' bought). Each makes ×'
        + fmt(Engine.genMultLog(s, k)) + ' ' + target + ' per second. Every purchase doubles its output.';
    },
    genBuy: function (s, k) {
      var n = k + 1;
      return 'Buy another G' + n + ' for ' + fmt(Engine.genCostLog(s, k))
        + ' IP. Bought generators are kept through Infinity; produced ones are not.';
    },
    gpChip: function (s) {
      return 'Generator Power boost to mult gain: ×' + fmt(Engine.gpMultLog(s)) + '.';
    },

    // ---- ∞ tab: Auto, ICs, Stars (Task 12) ----

    autoBuy: 'Autobuy: every moment, buys the cheapest affordable level among the rings you’ve enabled.',
    autoAsc: 'Auto-Ascend: ascends enabled rings as soon as they hit their level cap.',
    autoPromote: function (s) {
      var a = s.inf.auto.promote;
      return 'Auto-Promote: cycles through promotions in your order, promoting once XP reaches '
        + a.xFactor + '× your current level in the next one (or when progress stalls).';
    },
    autoPrestige: function (s) {
      var a = s.inf.auto.prestige;
      return 'Auto-Prestige: prestiges when pending P.Mult ≥ ' + a.multX + '× current, or P.Exp would rise by ≥ '
        + a.expGain + ', or progress has stalled — after at least ' + a.minTime + 's.';
    },
    autoInfinity: function (s) {
      var a = s.inf.auto.infinity;
      return 'Auto-Infinity (Broken only): goes Infinite once this run would give ≥ ' + fmt(a.minIpLog)
        + ' IP and has lasted ≥ ' + a.minTime + 's.';
    },
    stallSec: function (s) {
      return 'A run counts as stalled when score hasn’t grown ×10 for this many seconds ('
        + s.inf.auto.stallSec + 's). Stalls let Auto-Prestige/Promote act early. 0 = off.';
    },
    icCard: function (s, n) {
      var c = Engine.CHALLENGES[n - 1];
      if (!c) return '';
      var best = s.inf.ic.best[n - 1];
      return 'Challenge ' + n + ': ' + c.handicap + '. Reach ' + fmt(Engine.INFINITY_LOG) + ' to complete. Reward: '
        + c.reward + ', plus +1 to your IP multiplier. Best: ' + (best === null ? '—' : fmtMMSS(best)) + '.';
    },
    icStart: 'Starting resets your current run (no IP). You keep upgrades, generators and IP.',
    breakToggle: function (s) {
      var T = Engine.TUNE;
      return 'Broken: score can pass ' + fmt(Engine.INFINITY_LOG) + ' and you choose when to go Infinite. Every e'
        + T.breakStepLog + ' past e' + T.breakStartLog.toLocaleString('en-US') + ' multiplies IP ×10. Fixed: '
        + (s.inf.auto.confirmInfinity
          ? 'score stops at ' + fmt(Engine.INFINITY_LOG) + ' and you confirm each Infinity ("Confirm each Infinity" is on).'
          : 'you go Infinite automatically at ' + fmt(Engine.INFINITY_LOG) + '.');
    },
    ipBar: function (s) {
      var T = Engine.TUNE;
      var k = Engine.breakBonusLog(s);
      var threshold = T.breakStartLog + T.breakStepLog * (k + 1);
      return 'IP bonus ×10^' + k + '. Next ×10 at e' + threshold.toLocaleString('en-US') + '.';
    },
    starBuy: function (s) {
      return 'Stars produce Stardust: 0.05 × base^stars per second (' + fmt(Engine.sdRateLog(s)) + '/s now).';
    },
    starBase: function (s) {
      var base = 2.75 + 0.275 * s.inf.stars.nb;
      return 'Star base ' + base.toFixed(3) + ' → ' + (base + 0.275).toFixed(3) + '. Raises Stardust per Star.';
    },
    starExp: function (s) {
      var exp = 0.4 + 0.05 * s.inf.stars.ne;
      return 'Stardust exponent ' + exp.toFixed(3) + ' → ' + (exp + 0.05).toFixed(3) + '. Generator Power gain × Stardust^exp.';
    },
    sdAmount: function (s) {
      return 'Stardust ' + fmt(s.inf.stars.sdLog) + '. Resets on Infinity — spend it before you go Infinite.';
    },
    sdUpg: function (s, j) {
      var u = Engine.SD_UPGRADES[j];
      if (!u) return '';
      var level = s.inf.stars.sdU[j];
      var max = u.max === Infinity ? '∞' : String(u.max);
      var cost = Engine.sdUpgCostLog(s, j);
      return u.desc + '. Level ' + level + '/' + max + '. Cost ' + fmt(cost) + ' Stardust. Kept through Infinity.';
    },
    icChip: function (s) {
      var n = s.inf.ic.active;
      var c = Engine.CHALLENGES[n - 1];
      return c ? ('In Challenge ' + n + ': ' + c.handicap + '.') : 'Not currently in a Challenge.';
    },
    confirmInfinity: function (s) {
      return 'Show a confirmation when you reach ' + fmt(Engine.INFINITY_LOG) + ' instead of going Infinite automatically.';
    },
  };

  // Formats a plain (non-log) multiplier/value for tooltip copy.
  function fmtEffect(x) {
    if (!isFinite(x)) return String(x);
    if (x === 0) return '0';
    var abs = Math.abs(x);
    if (abs >= 1000 || abs < 0.001) return x.toExponential(2);
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    return x.toFixed(abs < 10 ? 3 : 2);
  }

  // Mirrors src/ui-infinity.js's EFFECT_FORMAT: most upgrades are a plain
  // "×N" multiplier, but 2;1/6;1/13;1 add a flat amount, 14;2/19;1 assign
  // gpExp outright, and 18;1 is a rate — this keeps the tooltip honest about
  // which kind of number it's showing.
  var EFFECT_FORMAT = {
    '2;1': function (v) { return 'currently +' + fmtEffect(v); },
    '6;1': function (v) { return 'currently +' + fmtEffect(v); },
    '13;1': function (v) { return 'currently +' + fmtEffect(v); },
    '14;2': function (v) { return 'currently GP exponent ' + v.toFixed(3); },
    '19;1': function (v) { return 'currently GP exponent ' + v.toFixed(3); },
    '18;1': function (v) { return 'currently +' + fmtEffect(v) + ' ∞/s'; },
  };

  function effectText(u, effect) {
    var f = EFFECT_FORMAT[u.id];
    return f ? f(effect) : ('currently ×' + fmtEffect(effect));
  }

  // Formats a plain (non-log) count such as state.infinities: usually an
  // integer, but passive-Infinity upgrades (18;1) can make it fractional.
  function fmtInf(n) {
    var frac = Math.abs(n - Math.round(n)) > 1e-9;
    try {
      return n.toLocaleString('en-US', frac ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
    } catch (e) {
      return String(n);
    }
  }

  // m:ss for challenge best times, mirroring src/ui-infinity.js's formatter.
  function fmtMMSS(sec) {
    if (sec === null || sec === undefined) return '—';
    var s = Math.round(sec);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function textForKey(key, i) {
    var entry = TIPS[key];
    if (entry === undefined) return '';
    if (typeof entry === 'function') {
      var s = hooks.getState();
      if (!s) return '';
      return entry(s, i);
    }
    return entry;
  }

  // ---------- tooltip component ----------

  var tipNode = null;
  var mode = null; // 'element' | 'point' | null
  var activeTarget = null;
  var activePoint = null; // { x, y } viewport coords
  var activeTextFn = null;
  var longPressTimer = null;
  var longPressTarget = null;
  var suppressNextClickOn = null;

  function ensureTipNode() {
    if (tipNode) return tipNode;
    tipNode = document.createElement('div');
    tipNode.id = 'tip';
    tipNode.setAttribute('role', 'tooltip');
    tipNode.hidden = true;
    document.body.appendChild(tipNode);
    return tipNode;
  }

  function findTipTarget(node) {
    while (node && node.nodeType === 1 && node !== document.body) {
      if (node.tipFn || (node.hasAttribute && node.hasAttribute('data-tip'))) return node;
      node = node.parentNode;
    }
    return null;
  }

  function textForElement(target) {
    if (typeof target.tipFn === 'function') return target.tipFn();
    var key = target.getAttribute('data-tip');
    var iAttr = target.getAttribute('data-tip-i');
    var i = iAttr === null ? undefined : Number(iAttr);
    return textForKey(key, i);
  }

  function positionAt(x, y) {
    var tip = ensureTipNode();
    var margin = TIP_MARGIN;
    var rect = tip.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var left = x - rect.width / 2;
    var top = y - rect.height - 10;
    var flipped = false;
    if (top < margin) {
      top = y + 18;
      flipped = true;
    }
    if (left < margin) left = margin;
    if (left + rect.width > vw - margin) left = vw - margin - rect.width;
    if (top + rect.height > vh - margin) top = vh - margin - rect.height;
    if (top < margin) top = margin;

    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
    tip.classList.toggle('below', flipped);
  }

  function positionForTarget(target) {
    var r = target.getBoundingClientRect();
    positionAt(r.left + r.width / 2, r.top);
  }

  function renderTip() {
    // A dirty re-render (ui.js rebuilds a tab body with innerHTML = '') can
    // detach the element a tooltip is anchored to without ever firing
    // mouseout/blur on it. Detect that here rather than positioning against
    // a detached node's zero rect (which would otherwise pin the tooltip to
    // the viewport corner and leave it stuck open indefinitely).
    if (mode === 'element' && activeTarget && !activeTarget.isConnected) {
      hide();
      return;
    }

    var tip = ensureTipNode();
    var text = activeTextFn ? activeTextFn() : '';
    if (!text) {
      hide();
      return;
    }
    tip.textContent = text;
    tip.style.maxWidth = TIP_MAX_WIDTH + 'px';
    var wasHidden = tip.hidden;
    tip.hidden = false;
    if (mode === 'element') {
      positionForTarget(activeTarget);
    } else if (mode === 'point' && activePoint) {
      positionAt(activePoint.x, activePoint.y);
    }
    if (wasHidden && !prefersReducedMotion()) {
      tip.classList.remove('show');
      // Force reflow so the fade-in transition restarts on rapid re-shows.
      // eslint-disable-next-line no-unused-expressions
      tip.offsetWidth;
      tip.classList.add('show');
    } else {
      tip.classList.add('show');
    }
  }

  function showElement(target) {
    if (activeTarget === target && mode === 'element') return;
    mode = 'element';
    activeTarget = target;
    activePoint = null;
    activeTextFn = function () { return textForElement(target); };
    var tip = ensureTipNode();
    target.setAttribute('aria-describedby', tip.id);
    renderTip();
  }

  function showAt(x, y, textFn) {
    mode = 'point';
    activePoint = { x: x, y: y };
    activeTarget = null;
    activeTextFn = textFn;
    renderTip();
  }

  function hide() {
    if (activeTarget && activeTarget.getAttribute('aria-describedby') === (tipNode && tipNode.id)) {
      activeTarget.removeAttribute('aria-describedby');
    }
    mode = null;
    activeTarget = null;
    activePoint = null;
    activeTextFn = null;
    if (tipNode) {
      tipNode.classList.remove('show');
      tipNode.hidden = true;
    }
  }

  function refresh() {
    if (!mode) return;
    renderTip();
  }

  // ---------- delegated hover/focus wiring ----------

  document.addEventListener('mouseover', function (e) {
    var t = findTipTarget(e.target);
    if (t) showElement(t);
  }, true);

  document.addEventListener('mouseout', function (e) {
    var t = findTipTarget(e.target);
    if (!t) return;
    var related = e.relatedTarget;
    if (related && t.contains(related)) return;
    if (activeTarget === t) hide();
  }, true);

  document.addEventListener('focusin', function (e) {
    var t = findTipTarget(e.target);
    if (t) showElement(t);
  });

  document.addEventListener('focusout', function (e) {
    var t = findTipTarget(e.target);
    if (t && activeTarget === t) hide();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && mode) hide();
  });

  window.addEventListener('scroll', function () {
    if (mode) hide();
  }, true);

  // ---------- touch: long-press to show, next tap to hide ----------

  function clearLongPress() {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
    longPressTarget = null;
  }

  document.addEventListener('touchstart', function (e) {
    if (mode) {
      // A tap while a tip is already showing closes it, and must not act on
      // whatever it landed on.
      var closing = e.target;
      hide();
      suppressNextClickOn = closing;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    var t = findTipTarget(e.target);
    if (!t) return;
    clearLongPress();
    longPressTarget = t;
    longPressTimer = setTimeout(function () {
      if (longPressTarget === t) {
        showElement(t);
        suppressNextClickOn = t;
      }
      longPressTimer = null;
    }, LONGPRESS_MS);
  }, { passive: false });

  document.addEventListener('touchmove', clearLongPress, { passive: true });
  document.addEventListener('touchend', function () {
    clearLongPress();
  }, { passive: true });
  document.addEventListener('touchcancel', clearLongPress, { passive: true });

  document.addEventListener('click', function (e) {
    if (suppressNextClickOn) {
      var target = suppressNextClickOn;
      suppressNextClickOn = null;
      if (target === e.target || (target.contains && target.contains(e.target))) {
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, true);

  // ---------- intro modal ----------

  function glyph(color) {
    return el('span', { class: 'help-glyph', style: 'border-color:' + color + ';box-shadow:0 0 8px 1px ' + color });
  }

  function beat(color, title, body) {
    return el('div', { class: 'help-beat' }, [
      glyph(color),
      el('div', {}, [
        el('div', { class: 'help-beat-title' }, [title]),
        el('div', { class: 'help-beat-body' }, [body]),
      ]),
    ]);
  }

  function showIntro() {
    if (window.Guide && typeof window.Guide.showIntro === 'function') {
      window.Guide.showIntro();
      return;
    }
    if (hooks.isModalOpen()) return;
    var panel = el('div', { class: 'modal-panel' }, [
      el('h2', { class: 'modal-title' }, ['How to play']),
      beat('#ff3b4f', 'Orbit', 'Every lap of a dot earns score. Faster rings lap more often.'),
      beat('#ffd93b', 'Buy', 'Levels make a ring faster; buying 5 levels of a ring unlocks the next.'),
      beat('#2affc6', 'Multiply', 'Each lap also grows that ring’s ×mult; all mults multiply your score per lap.'),
      beat('#a24dff', 'Reset for power', 'Max a ring to Ascend it. Later, Prestige and Promotions trade progress for permanent boosts. They unlock as you go.'),
      el('div', { class: 'row help-intro-actions' }, [
        el('button', {
          class: 'btn primary',
          id: 'intro-start',
          onclick: function () {
            markSeen('introSeen');
            hooks.hideModal();
          },
        }, ['Start orbiting']),
        el('button', {
          class: 'btn',
          onclick: function () {
            markSeen('introSeen');
            hooks.hideModal();
          },
        }, ['Skip']),
      ]),
    ]);
    hooks.showModal(panel);
    var startBtn = panel.querySelector('#intro-start');
    if (startBtn) startBtn.focus();
  }

  function maybeShowIntroOnBoot(hadSave) {
    if (hadSave) return;
    if (seen.introSeen) return;
    showIntro();
  }

  // ---------- one-time unlock tips ----------

  // Spec §7: when guidance is on, an unlock explainer card (Guide.unlock)
  // replaces the toast; when guidance is off (or Guide isn't loaded), the
  // original toast text is used as a fallback.
  function fireUnlock(key, toastMsg) {
    if (!markSeen(key)) return;
    if (window.Guide && typeof window.Guide.isEnabled === 'function' && window.Guide.isEnabled()) {
      window.Guide.unlock(key);
    } else {
      hooks.toast(toastMsg);
    }
  }

  function onTick(state) {
    if (!state) return;
    for (var i = 0; i < state.circles.length; i++) {
      if (Engine.canAscend(state, i)) {
        fireUnlock('ascendSeen', 'Ascend ready — max-level rings can reset to level 5 for a mult gain boost. Hover the button for details.');
        break;
      }
    }
    if (Engine.canPrestige(state)) {
      fireUnlock('prestigeSeen', 'Prestige ready — reset your rings for a permanent score boost. Hover the Prestige tab for details.');
    }
    if (Engine.promoXp(state) > 0) {
      fireUnlock('promoSeen', 'Promotions ready — spend XP on permanent boosts. Hover a card on the Promote tab for details.');
    }
    if (Engine.canInfinity(state)) {
      if (hooks.isModalOpen() === 'infinity') {
        markSeen('infinitySeen');
      } else {
        fireUnlock('infinitySeen', 'Infinity reached — hover Go Infinite for details.');
      }
    }
    if (state.infinities >= 1) {
      fireUnlock('infTabSeen', '∞ tab unlocked — spend Infinity Points on upgrades.');
    }
    if (Engine.hasUpg(state, '1;1')) {
      fireUnlock('gensSeen', 'Generators online — they build Generator Power, which boosts every ring’s mult gain.');
    }
    var auto = Engine.autoUnlocked(state);
    if (auto.buy || auto.asc || auto.promote || auto.prestige || auto.infinity) {
      fireUnlock('autoSeen', 'Automation unlocked — configure it in ∞ → Auto.');
    }
    if (Engine.hasUpg(state, '7;1')) {
      fireUnlock('icSeen', 'Infinity Challenges unlocked — beat them for permanent rewards.');
    }
    if (Engine.canBreak(state)) {
      fireUnlock('breakSeen', 'Break Infinity available — score can now pass ' + fmt(Engine.INFINITY_LOG) + '.');
    }
    if (Engine.hasUpg(state, '21;1')) {
      fireUnlock('starsSeen', 'Stars unlocked — they make Stardust, which powers Generators.');
    }
  }

  window.Help = {
    init: init,
    showIntro: showIntro,
    maybeShowIntroOnBoot: maybeShowIntroOnBoot,
    onTick: onTick,
    refresh: refresh,
    showAt: showAt,
    hide: hide,
    markIntroSeen: function () { markSeen('introSeen'); },
    TIPS: TIPS,
  };
})();
</script>
<script>// src/guide-goals.js — pure goal/stage engine for the player-guidance
// feature (spec 2026-09-24-player-guidance-design.md §1, §5). No DOM, no
// timers; reads only public Engine functions/state. UMD-ish like engine.js:
// module.exports in Node, window.GuideGoals in browser.
//
// Target selectors are defined here as `[data-guide="<name>"]`; Task 3 adds
// the matching `data-guide` attribute to the DOM in src/ui.js /
// src/ui-infinity.js. Full list of names used below (add all of these):
//   red-buy         Red row's Buy button (circles tab) — goals buyRed, unlockOrange
//   multbar-red     Red chip in the multbar — goal readMult
//   orange-buy      Orange row's Buy button (circles tab) — goal buyOrange
//   buy-mode-toggle The 1/10/max buy-mode toggle (circles tab) — goal buyModes
//   next-locked-row The next locked circle row (circles tab) — goals unlockGreen, unlockWhite
//   red-ascend      Red row's Ascend button (circles tab) — goal ascendRed
//   score-box       The score display — goals reachPrestige, infinity
//   prestige-button The Prestige action button (prestige tab) — goal prestige
//   p-chip          The P.Mult chip in the multbar — goal reachPromote
//   promote-card    A Promotion card (promote tab) — goal promote
//   promote-tab     The Promote tab button — goal promoteAll
//   inf-tree        The Infinity Upgrade tree (infinity tab, Tree sub-tab) — goals buyGens, automate, unlockIC
//   inf-gens        The Generators list (infinity tab, Gens sub-tab) — goal buyG2
//   inf-ics         The Infinity Challenges list (infinity tab, ICs sub-tab) — goals firstIC, allIC
//   inf-break       The Break Infinity card (infinity tab, ICs sub-tab) — goal breakInf
//   inf-stars       The Stars panel (infinity tab, Stars sub-tab) — goal stars
//   inf-header      The Infinity header (IP / infinity count) (infinity tab) — goal finale

const GuideGoals = (() => {
  // Resolved per call (not captured at script load) so the browser build
  // picks up window.Engine even if guide-goals.js's <script> tag runs before
  // ui.js sets it up; Node tests still get the CommonJS module.
  function E() {
    return (typeof window !== 'undefined' && window.Engine) ? window.Engine : require('./engine.js');
  }

  const STAGES = [
    'revolution', 'prestige', 'promotions', 'infinity',
    'challenges', 'break', 'stars', 'finale',
  ];

  function target(sel, tab) {
    return { sel: '[data-guide="' + sel + '"]', tab: tab || null };
  }

  function unlockedCount(s, upTo) {
    let n = 0;
    for (let i = 0; i < s.circles.length && (upTo == null || i < upTo); i++) {
      if (s.circles[i].unlocked) n++;
    }
    return n;
  }

  const GOALS = [
    {
      id: 'buyRed', stage: 'revolution', coach: true, ack: false,
      done: (s) => s.circles[0].bought >= 1,
      progress: (s) => ({ cur: Math.min(1, s.circles[0].bought), max: 1, log: false }),
      target: target('red-buy', 'circles'),
    },
    {
      id: 'readMult', stage: 'revolution', coach: true, ack: true,
      done: () => false,
      progress: () => null,
      target: target('multbar-red', null),
    },
    {
      id: 'unlockOrange', stage: 'revolution', coach: true, ack: false,
      done: (s) => s.circles[1].unlocked,
      progress: (s) => ({ cur: Math.min(5, s.circles[0].bought), max: 5, log: false }),
      target: target('red-buy', 'circles'),
    },
    {
      id: 'buyOrange', stage: 'revolution', coach: true, ack: false,
      done: (s) => s.circles[1].level >= 1,
      progress: () => null,
      target: target('orange-buy', 'circles'),
    },
    {
      id: 'buyModes', stage: 'revolution', coach: true, ack: true,
      done: () => false,
      progress: () => null,
      target: target('buy-mode-toggle', 'circles'),
    },
    {

      progress: (s) => ({ cur: s.inf.ipLog, max: E().INFINITY_LOG, log: true }),
      target: target('inf-header', 'infinity'),
    },
  ];

  // spec §1 stage-reached predicates
  const STAGE_PREDICATES = {
    revolution: () => true,
    prestige: (s) => s.stats.prestiges >= 1 || E().canPrestige(s),
    promotions: (s) => s.stats.promotions >= 1 || E().promoXp(s) > 0,
    infinity: (s) => s.infinities >= 1,
    challenges: (s) => E().hasUpg(s, '7;1'),
    break: (s) => s.inf.broken || E().canBreak(s),
    stars: (s) => E().hasUpg(s, '21;1'),
    finale: (s) => s.inf.ipLog >= E().INFINITY_LOG,
  };

  function stageReached(s, stageId) {
    const pred = STAGE_PREDICATES[stageId];
    return !!pred && pred(s);
  }

  function currentStage(s) {
    for (let i = STAGES.length - 1; i >= 0; i--) {
      if (stageReached(s, STAGES[i])) return STAGES[i];
    }
    return STAGES[0];
  }

  // Marks a goal and every earlier goal complete once `done(s)` is true for
  // it (sticky, monotone: resets never regress, advanced saves skip ahead).
  // Never unmarks anything already true in `doneMap`; always returns a NEW
  // map.
  function sync(s, doneMap) {
    const result = Object.assign({}, doneMap);
    let mark = false;
    for (let i = GOALS.length - 1; i >= 0; i--) {
      const g = GOALS[i];
      if (g.done(s)) mark = true;
      if (mark) result[g.id] = true;
    }
    return result;
  }

  function current(doneMap) {
    for (let i = 0; i < GOALS.length; i++) {
      if (!doneMap[GOALS[i].id]) return GOALS[i];
    }
    return null;
  }

  // Marks an ack goal (and every earlier goal) complete. Returns a NEW map.
  function ack(id, doneMap) {
    const idx = GOALS.findIndex((g) => g.id === id);
    const result = Object.assign({}, doneMap);
    for (let i = 0; i <= idx; i++) result[GOALS[i].id] = true;
    return result;
  }

  return { GOALS, STAGES, stageReached, currentStage, sync, current, ack };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = GuideGoals;
} else {
  window.GuideGoals = GuideGoals;
}

  var cards = {

      todo: 'Press Go Infinite, then open the new ∞ tab.',
      goal: 'infinity',

    },
    infTabSeen: {
      title: 'The ∞ tab',
      what: 'The ∞ tab holds the Infinity Upgrade Tree. Upgrades cost IP and are kept forever.',
      why: 'These upgrades are how you get stronger from now on — every run to Infinity gets faster.',

    },
    gensSeen: {
      title: 'Generators online',
      what: 'Generators make Generator Power (GP). G1 makes GP; each higher Generator makes the one below it.',
      why: 'GP multiplies every ring’s mult gain per lap, so runs speed up as they go.',

    autoSeen: {

      goal: 'automate',

    },
    icSeen: {
      title: 'Infinity Challenges unlocked',
      what: 'Nine Challenges each add a handicap. Reach {INF} score while one is on to complete it.',
      why: 'Each one gives a permanent reward and more IP per Infinity. All nine unlock Break Infinity.',
      todo: 'Open ∞ → ICs and start Challenge 1.',

    },
    breakSeen: {

    },
    starsSeen: {

    },

  // ---------- glossary ----------

  var glossary = [
    { term: 'Ring', unlock: null, def: 'One of the ten coloured circles, Red to White. Each has a dot that orbits it.' },
    { term: 'Lap', unlock: null, def: 'One full trip of a ring’s dot around its circle. Every lap earns score.' },

    { term: 'Level', unlock: null, def: 'How fast a ring spins. Laps per second = level × the ring’s base speed × speed boosts.' },

    { term: 'Bulk buy', unlock: null, def: 'The ×1 / ×10 / Max switch (key M). Max buys as many levels as you can afford.' },

    { term: 'P.Mult', unlock: 'ascendRed', def: 'Prestige multiplier. It multiplies score per lap and only goes up through Prestiges. Promotion and Infinity reset it.' },
    { term: 'P.Exp', unlock: 'ascendRed', def: 'Prestige exponent. Your score per lap is raised to this power, so small gains matter a lot. Promotion and Infinity reset it.' },
    { term: 'Exponent', unlock: null, def: 'The power score per lap is raised to: P.Exp plus bonuses from later upgrades. It starts at 1.' },
    { term: 'Promotion', unlock: 'unlockWhite', def: 'One of four boosts (Mult Gain, Lap Speed, Ascension Power, Promotion Power). Promoting resets P.Mult.' },

    { term: 'IP', unlock: 'reachPromote', def: 'Infinity Points, earned by going Infinite. Spent on upgrades, Generators and Stars. Never lost.' },
    { term: 'Infinities (∞)', unlock: 'reachPromote', def: 'How many times you have gone Infinite. Several upgrades grow stronger with more.' },
    { term: 'Infinity Upgrade', unlock: 'reachPromote', def: 'A permanent boost bought with IP on the ∞ tab’s Tree. Most need an upgrade from an earlier column first.' },
    { term: 'Generator', unlock: 'buyGens', def: 'Bought with IP. G1 makes GP; every higher Generator makes more of the one below it.' },
    { term: 'GP', unlock: 'buyGens', def: 'Generator Power. It multiplies every ring’s mult gain per lap. Resets each Infinity.' },
    { term: 'Automation', unlock: 'buyGens', def: 'Upgrades that buy, ascend, promote, prestige and (after Break) go Infinite for you.' },
    { term: 'Challenge', unlock: 'automate', def: 'An Infinity Challenge: reach {INF} score under a handicap for a permanent reward.' },
    { term: 'Handicap', unlock: 'automate', def: 'The penalty a Challenge applies while it is running.' },
    { term: 'Break', unlock: 'allIC', def: 'Break Infinity: lets score pass {INF}. Very high scores multiply the IP you earn.' },
    { term: 'Star', unlock: 'breakInf', def: 'Bought with IP after the A Falling Star upgrade. Each Star makes Stardust.' },
    { term: 'Stardust', unlock: 'breakInf', def: 'Made by Stars. Boosts Generator Power and buys Stardust upgrades. Resets each Infinity.' },
  ];

  // ---------- token filling ----------

  function fmtPlain(E, x) {
    return x > 0 ? E.fmtLog(Math.log10(x)) : '0';
  }

  var TOKENS = {
    INF: function (E) { return E.fmtLog(E.INFINITY_LOG); },
    PRESTIGE_MIN: function (E) { return E.fmtLog(E.TUNE.prestigeMinLog); },
    PROMO_MIN: function (E) { return fmtPlain(E, E.TUNE.promoMin); },
    ASC_POWER: function (E, s) { return fmtPlain(E, E.promoEffects(s).p3); },
    CAP: function (E, s) { return String(E.levelCap(s.circles[0])); },
    UNLOCK_AT: function () { return '5'; }, // engine.js buy(): 5 levels bought unlock the next ring
  };

  function fill(str, s) {
    var E = engine();
    var state = s || null;
    return String(str).replace(/\{([A-Z_]+)\}/g, function (m, key) {
      var f = TOKENS[key];
      if (!f) return m;
      if (!state) state = E.newState();
      return f(E, state);
    });
  }

  var GuideContent = {
    objective: objective,
    stages: stages,
    goals: goals,
    sections: sections,
    cards: cards,
    glossary: glossary,
    fill: fill,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = GuideContent;
  else window.GuideContent = GuideContent;
})();

<script>// src/guide.js — player-guidance DOM: objective + journey strip, next-goal
// card, first-minutes coach spotlight, the full ? guide, and unlock cards.
// Reads GuideGoals (pure goal engine) and GuideContent (copy) as globals;
// only touches the rest of the app through the hooks passed to Guide.init.
(function () {
  'use strict';

  var STORAGE_KEY = 'revidle.guide.v1';
  var STRONG_PULSE_MS = 3000;
  var COACH_RETRY_MS = 220;

  var GuideGoals = window.GuideGoals;
  var GuideContent = window.GuideContent;

  // ---------- hooks (wired by ui.js via Guide.init) ----------

  var hooks = {
    el: null,
    toast: function () {},
    isModalOpen: function () { return null; },
    showModal: function () {},
    hideModal: function () {},
    getState: function () { return null; },
    setTab: function () {},
    isCatchingUp: function () { return false; },
    hadSave: false,
  };

  // ---------- persisted store ----------

  // `collapsed` is tri-state: null/undefined = no explicit choice yet (the
  // card defaults to collapsed on narrow viewports, expanded on wide ones —
  // see isCardCollapsed()); true/false = the user toggled it, which then
  // wins on every viewport.
  var store = { done: {}, collapsed: null, enabled: true, cardsSeen: {} };

  function loadStore() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') {
          return {
            done: obj.done && typeof obj.done === 'object' ? obj.done : {},
            collapsed: obj.collapsed === undefined || obj.collapsed === null ? null : !!obj.collapsed,
            enabled: obj.enabled !== false,
            cardsSeen: obj.cardsSeen && typeof obj.cardsSeen === 'object' ? obj.cardsSeen : {},
          };
        }
      }
    } catch (e) { /* ignore: guidance state is best-effort */ }
