    return { done: {}, collapsed: null, enabled: true, cardsSeen: {} };
  }

  function saveStore() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
  }

  // Effective collapsed state: an explicit user choice always wins; with no
  // choice made yet, narrow viewports (<=820px, matching the panel's own
  // breakpoint) default to collapsed so the card never covers the rings.
  function isCardCollapsed() {
    if (store.collapsed === null || store.collapsed === undefined) {
      try { return window.innerWidth <= 820; } catch (e) { return false; }
    }
    return !!store.collapsed;
  }

  // ---------- small helpers ----------

  function el(tag, attrs, children) {
    return hooks.el(tag, attrs, children);
  }

  function fill(str, state) {
    return GuideContent.fill(str, state);
  }

  function prefersReducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) {
      return false;
    }
  }

  // ---------- focus management (modals + the coach popover) ----------

  function focusableIn(container) {
    return Array.prototype.filter.call(
      container.querySelectorAll('button, [href], input, select, textarea, [tabindex]'),
      function (n) { return !n.disabled && n.tabIndex !== -1 && n.offsetParent !== null; }
    );
  }

  // Moves focus into `container` (first focusable), traps Tab/Shift+Tab
  // inside it, and returns a release() that restores the focus the page had
  // before the container opened. Callers keep the release function and call
  // it exactly once, when the container closes.
  function trapFocus(container) {
    var previouslyFocused = document.activeElement;
    var list = focusableIn(container);
    if (list.length) list[0].focus();
    function onKeydown(e) {
      if (e.key !== 'Tab') return;
      var f = focusableIn(container);
      if (!f.length) return;
      var first = f[0];
      var last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
    container.addEventListener('keydown', onKeydown);
    return function release() {
      container.removeEventListener('keydown', onKeydown);
      if (previouslyFocused && typeof previouslyFocused.focus === 'function' && previouslyFocused.isConnected) {
        previouslyFocused.focus();
      }
    };
  }

  // The one release() for whichever Guide-owned hooks.showModal panel is
  // currently open (intro / full guide / unlock card — never more than one
  // at a time, since hooks.isModalOpen() gates opening a second one).
  var releaseModalFocus = null;

  function closeGuideModal() {
    hooks.hideModal();
    if (releaseModalFocus) {
      var r = releaseModalFocus;
      releaseModalFocus = null;
      r();
    }
  }

  function coachGoalIds() {
    return GuideGoals.GOALS.filter(function (g) { return g.coach; }).map(function (g) { return g.id; });
  }

  // Extracts the data-guide name out of a `[data-guide="name"]` selector.
  function guideName(sel) {
    var m = /data-guide="([^"]+)"/.exec(sel);
    return m ? m[1] : null;
  }

  var SUBTAB_FOR_NAME = {
    'inf-tree': 'tree', 'inf-gens': 'gens', 'inf-ics': 'ics', 'inf-break': 'ics', 'inf-stars': 'stars',
  };

  // Resolves a goal's target element(s) in the live DOM. Never throws: an
  // unresolved target (wrong tab, sub-tab not built yet) just yields an
  // empty NodeList/array.
  function findTargetEls(goal) {
    var t = goal.target;
    var nodes = document.querySelectorAll(t.sel);
    if (nodes.length === 0 && goal.id === 'stars') {
      // The Stars sub-tab doesn't exist until 'A Falling Star' is bought;
      // fall back to that Tree upgrade's own card.
      nodes = document.querySelectorAll('[data-id="21;1"]');
    }
    return nodes;
  }

  // Switches to a goal's tab (and ∞ sub-tab, if any) so its target will be
  // in the DOM on the next render, then calls back once it should be there.
  function navigateToTarget(goal, cb) {
    var t = goal.target;
    if (t.tab) hooks.setTab(t.tab);
    var name = guideName(t.sel);
    var subtab = SUBTAB_FOR_NAME[name];
    if (subtab && window.InfinityUI && typeof window.InfinityUI.setSubTab === 'function') {
      window.InfinityUI.setSubTab(subtab);
    }
    if (cb) setTimeout(cb, COACH_RETRY_MS);
  }

  // ---------- goal-complete detection ----------

  var currentGoalId = null;
  var lastDoneCount = -1;

  function syncGoals(state) {
    var next = GuideGoals.sync(state, store.done);
    var nextCount = Object.keys(next).length;
    var changed = nextCount !== lastDoneCount;
    store.done = next;
    lastDoneCount = nextCount;
    if (changed) saveStore();
    return changed;
  }

  // ---------- goal card ----------

  var cardEl = null;
  var cardGoalId; // undefined = never rendered
  var cardCollapsed;

  function ensureCard() {
    if (cardEl) return cardEl;
    cardEl = el('div', { id: 'guide-card', class: 'guide-card', role: 'complementary', 'aria-label': 'Current goal' });
    var scorebox = document.getElementById('scorebox');
    (scorebox || document.body).appendChild(cardEl);
    return cardEl;
  }

  function progressText(p) {
    if (!p) return null;
    var E = window.Engine;
    var curTxt = p.log ? E.fmtLog(p.cur) : String(Math.round(p.cur));
    var maxTxt = p.log ? E.fmtLog(p.max) : String(Math.round(p.max));
    return curTxt + ' / ' + maxTxt;
  }

  function progressPct(p) {
    if (!p || !(p.max > 0)) return 0;
    return Math.max(0, Math.min(1, p.cur / p.max));
  }

  function buildCard(state, goal) {
    var card = ensureCard();
    card.innerHTML = '';
    card.hidden = false;
    var collapsed = isCardCollapsed();
    card.classList.toggle('collapsed', collapsed);
    var content = GuideContent.goals[goal.id];
    var p = goal.progress(state);
    var pct = progressPct(p);

    var chevron = el('button', {
      class: 'guide-card-collapse',
      'aria-label': collapsed ? 'Expand goal card' : 'Collapse goal card',
      'aria-expanded': String(!collapsed),
      onclick: function () {
        store.collapsed = !isCardCollapsed();
        saveStore();
        buildCard(hooks.getState(), goal);
      },
    }, [collapsed ? '▸' : '▾']);

    var head = el('div', { class: 'guide-card-head' }, [
      chevron,
      el('div', { class: 'guide-card-title' }, [fill(content.title, state)]),
      el('div', { class: 'guide-card-pct' }, [p ? Math.round(pct * 100) + '%' : '']),
    ]);
    card.appendChild(head);

    if (collapsed) {
      // Collapsed still gets a one-tap "Show me" (spec: "collapsed = one
      // line with title + %"), kept minimal — no full action row.
      head.appendChild(el('button', {
        class: 'btn guide-card-collapsed-showme',
        onclick: function (e) { e.stopPropagation(); showMe(goal); },
      }, ['Show me']));
      return;
    }

    var body = el('div', { class: 'guide-card-body' });
    if (p) {
      body.appendChild(el('div', { class: 'progress-bar' }, [
        el('div', { class: 'progress-fill', style: 'width:' + (pct * 100) + '%' }),
      ]));
      body.appendChild(el('div', { class: 'guide-card-progress-text' }, [progressText(p)]));
    }
    body.appendChild(el('p', { class: 'help guide-card-why' }, [fill(content.why, state)]));
    var rowKids = [
      el('button', { class: 'btn', onclick: function () { showMe(goal); } }, ['Show me']),
      el('button', {
        class: 'btn',
        onclick: function () { openGuide(content.section); },
      }, ['Learn more']),
    ];
    if (goal.ack) {
      // ack goals (readMult, buyModes) only complete through the coach
      // popover's "Next"; players who skipped the tutorial, or an existing
      // save that's already past them, need another way to clear them.
      rowKids.push(el('button', {
        class: 'btn primary',
        onclick: function () { ackGoal(goal.id); },
      }, ['Got it']));
    }
    body.appendChild(el('div', { class: 'row' }, rowKids));
    body.appendChild(journeyStrip(state));
    card.appendChild(body);
  }

  function renderCard(state) {
    var card = ensureCard();
    if (!isEnabled()) { card.hidden = true; return; }
    card.hidden = false;

    var goal = GuideGoals.current(store.done);
    currentGoalId = goal ? goal.id : null;

    if (!goal) {
      if (cardGoalId !== null) {
        card.innerHTML = '';
        card.classList.remove('collapsed');
        card.appendChild(el('div', { class: 'guide-card-done' },
          ['All goals complete — you’ve reached the end of this version.']));
        cardGoalId = null;
        cardCollapsed = isCardCollapsed();
      }
      return;
    }

    var collapsedNow = isCardCollapsed();
    if (goal.id === cardGoalId && collapsedNow === cardCollapsed) {
      // Patch in place: progress bar/text only, to avoid rebuilding (and
      // losing focus on) the card every 100ms tick.
      var p = goal.progress(state);
      if (p) {
        var pct = progressPct(p);
        var fillEl = card.querySelector('.progress-fill');
        if (fillEl) fillEl.style.width = (pct * 100) + '%';
        var textEl = card.querySelector('.guide-card-progress-text');
        if (textEl) textEl.textContent = progressText(p);
        var pctEl = card.querySelector('.guide-card-pct');
        if (pctEl) pctEl.textContent = Math.round(pct * 100) + '%';
      }
      return;
    }

    buildCard(state, goal);
    cardGoalId = goal.id;
    cardCollapsed = collapsedNow;
  }

  // A resize can cross the 820px breakpoint while the card has no explicit
  // collapse choice yet (store.collapsed === null): force the next
  // renderCard to re-evaluate rather than staying on a stale layout.
  window.addEventListener('resize', function () {
    if (store.collapsed === null || store.collapsed === undefined) cardGoalId = undefined;
  });

  // ---------- "Show me" / highlight ----------

  var pulsedEls = [];
  var strongUntil = 0;
  // While a "Show me" explicitly named a goal (e.g. an unlock card's own
  // goal, which may differ from the actual current goal) and the strong
  // window hasn't expired, that goal wins over GuideGoals.current — see
  // showMe().
  var forcedPulseGoal = null;
  var forcedPulseUntil = 0;

  function clearPulse() {
    pulsedEls.forEach(function (n) {
      if (n && n.classList) { n.classList.remove('guide-pulse'); n.classList.remove('guide-pulse-strong'); }
    });
    pulsedEls = [];
  }

  function updatePulse(state) {
    clearPulse();
    if (!isEnabled()) return;
    var strong = Date.now() < strongUntil;
    var goal = (forcedPulseGoal && Date.now() < forcedPulseUntil) ? forcedPulseGoal : GuideGoals.current(store.done);
    if (!goal) return;
    var nodes = findTargetEls(goal);
    Array.prototype.forEach.call(nodes, function (n) {
      n.classList.add('guide-pulse');
      if (strong) n.classList.add('guide-pulse-strong');
      pulsedEls.push(n);
    });
  }

  function showMe(goal) {
    if (hooks.isCatchingUp()) return;
    navigateToTarget(goal, function () {
      var nodes = findTargetEls(goal);
      if (!nodes.length) return; // fail gracefully: nothing to scroll to / pulse
      strongUntil = Date.now() + STRONG_PULSE_MS;
      forcedPulseGoal = goal;
      forcedPulseUntil = Date.now() + STRONG_PULSE_MS;
      if (typeof nodes[0].scrollIntoView === 'function') {
        nodes[0].scrollIntoView({ block: 'center', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      }
      updatePulse(hooks.getState());
      setTimeout(function () { updatePulse(hooks.getState()); }, STRONG_PULSE_MS + 50);
    });
  }

  // ---------- journey strip (shared by intro, guide, goal card) ----------

  function journeyStrip(state) {
    var stageIdx = GuideGoals.STAGES.indexOf(GuideGoals.currentStage(state));
    var row = el('div', { class: 'guide-journey', role: 'list', 'aria-label': 'Journey' });
    GuideGoals.STAGES.forEach(function (id, i) {
      var reached = i <= stageIdx;
      var isNext = i === stageIdx + 1;
      var label = (reached || isNext) ? GuideContent.stages[id].name : '???';
      var cls = 'guide-journey-stage' + (reached ? ' reached' : '') + (i === stageIdx ? ' current' : '');
      row.appendChild(el('span', { class: cls, role: 'listitem' }, [label]));
    });
    return row;
  }

  // ---------- objective block ----------

  function objectiveBlock(state) {
    return el('div', { class: 'guide-objective' }, [
      el('h2', { class: 'modal-title' }, [GuideContent.objective.title]),
      el('p', { class: 'help' }, [fill(GuideContent.objective.body, state)]),
    ]);
  }

  // ---------- intro ----------

  function glyph(color) {
    return el('span', { class: 'help-glyph', style: 'border-color:' + color + ';box-shadow:0 0 8px 1px ' + color });
  }

  function beat(color, title, body) {
    return el('div', { class: 'help-beat' }, [
      glyph(color),
      el('div', {}, [
        el('div', { class: 'help-beat-title' }, [title]),
        el('div', { class: 'help-beat-body' }, [body]),
      ]),
    ]);
  }

  function closeIntro() {
    if (window.Help && typeof window.Help.markIntroSeen === 'function') window.Help.markIntroSeen();
    closeGuideModal();
  }

  function showIntro() {
    if (hooks.isModalOpen()) return;
    var state = hooks.getState();
    var panel = el('div', { class: 'modal-panel guide-intro' }, [
      objectiveBlock(state),
      journeyStrip(state),
      beat('#ff3b4f', 'Orbit', 'Every lap of a dot earns score. Faster rings lap more often.'),
      beat('#ffd93b', 'Buy', 'Levels make a ring faster; buying 5 levels of a ring unlocks the next.'),
      beat('#2affc6', 'Multiply', 'Each lap also grows that ring’s ×mult; all mults multiply your score per lap.'),
      beat('#a24dff', 'Reset for power', 'Max a ring to Ascend it. Later, Prestige and Promotions trade progress for permanent boosts. They unlock as you go.'),
      el('div', { class: 'row help-intro-actions' }, [
        el('button', {
          class: 'btn primary',
          id: 'guide-intro-start',
          onclick: function () {
            tutorialActive = true;
            closeIntro();
          },
        }, ['Start tutorial']),
        el('button', {
          class: 'btn',
          onclick: function () {
            tutorialActive = false;
            closeIntro();
          },
        }, ['Skip']),
      ]),
    ]);
    hooks.showModal(panel);
    releaseModalFocus = trapFocus(panel);
  }

  // ---------- full guide ----------

  function sectionBlock(sec, state) {
    var locked = sec.unlock && !store.done[sec.unlock];
    var wrap = el('div', { class: 'guide-section' + (locked ? ' locked' : ''), id: 'guide-sec-' + sec.id });
    wrap.appendChild(el('h3', { class: 'guide-section-title' }, [sec.title]));
    if (locked) {
      var goalTitle = fill(GuideContent.goals[sec.unlock].title, state);
      wrap.appendChild(el('p', { class: 'help' }, ['Unlocks when: ' + goalTitle]));
      return wrap;
    }
    sec.body.forEach(function (p) {
      wrap.appendChild(el('p', { class: 'help' }, [fill(p, state)]));
    });
    var todo = el('ul', { class: 'guide-todo' });
    sec.todo.forEach(function (t) {
      todo.appendChild(el('li', {}, [fill(t, state)]));
    });
    wrap.appendChild(todo);
    return wrap;
  }

  function glossaryBlock(state) {
    var wrap = el('div', { class: 'guide-section', id: 'guide-sec-glossary-terms' });
    var list = el('dl', { class: 'guide-glossary' });
    GuideContent.glossary.forEach(function (g) {
      if (g.unlock && !store.done[g.unlock]) return;
      list.appendChild(el('dt', {}, [g.term]));
      list.appendChild(el('dd', {}, [fill(g.def, state)]));
    });
    wrap.appendChild(list);
    return wrap;
  }

  function openGuide(sectionId) {
    if (hooks.isModalOpen()) return;
    var state = hooks.getState();
    var body = el('div', { class: 'guide-panel-body' });
    body.appendChild(objectiveBlock(state));
    body.appendChild(journeyStrip(state));

    var toc = el('nav', { class: 'guide-toc', 'aria-label': 'Guide sections' });
    GuideContent.sections.forEach(function (sec) {
      var locked = sec.unlock && !store.done[sec.unlock];
      toc.appendChild(el('button', {
        class: 'guide-toc-link' + (locked ? ' locked' : ''),
        onclick: function () { scrollToSection(sec.id); },
      }, [sec.title]));
    });
    body.appendChild(toc);

    GuideContent.sections.forEach(function (sec) {
      body.appendChild(sectionBlock(sec, state));
    });
    body.appendChild(glossaryBlock(state));

    body.appendChild(el('button', {
      class: 'btn',
      onclick: function () { closeGuideModal(); showIntro(); },
    }, ['Replay intro']));

    var closeBtn = el('button', { class: 'btn guide-panel-close', 'aria-label': 'Close guide', onclick: closeGuideModal }, ['×']);
    var panel = el('div', { class: 'modal-panel guide-panel', role: 'dialog', 'aria-label': 'How to play' }, [
      el('div', { class: 'guide-panel-head' }, [el('h2', { class: 'modal-title' }, ['Guide']), closeBtn]),
      body,
    ]);
    hooks.showModal(panel);
    releaseModalFocus = trapFocus(panel);
    if (sectionId) {
      setTimeout(function () { scrollToSection(sectionId); }, 0);
    }
  }

  function scrollToSection(id) {
    var node = document.getElementById('guide-sec-' + id);
    if (node && typeof node.scrollIntoView === 'function') {
      node.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }
  }

  // ---------- unlock cards ----------

  var cardQueue = [];

  function unlock(seenKey) {
    if (!isEnabled()) return;
    if (store.cardsSeen[seenKey]) return;
    store.cardsSeen[seenKey] = true;
    saveStore();
    cardQueue.push(seenKey);
  }

  function showUnlockCard(keys, state) {
    var first = GuideContent.cards[keys[0]];
    var items = keys.map(function (k) { return GuideContent.cards[k]; }).filter(Boolean);
    if (!items.length) return;

    var body = [];
    items.forEach(function (c, idx) {
      if (idx > 0) body.push(el('hr', { class: 'guide-card-sep' }));
      body.push(el('h3', { class: 'guide-section-title' }, [c.title]));
      body.push(el('p', { class: 'help' }, [fill(c.what, state)]));
      body.push(el('p', { class: 'help' }, [fill(c.why, state)]));
      // A combined card can list several unlocks at once (e.g. after
      // catch-up); once the player is already past a listed goal, its
      // "what to do now" line is stale noise rather than guidance.
      if (!store.done[c.goal]) {
        body.push(el('p', { class: 'guide-card-todo' }, [fill(c.todo, state)]));
      }
    });

    var goal = GuideGoals.GOALS.find(function (g) { return g.id === first.goal; });
    var actions = [
      el('button', {
        class: 'btn',
        onclick: function () {
          closeGuideModal();
          if (goal) showMe(goal);
        },
      }, ['Show me']),
      el('button', {
        class: 'btn',
        onclick: function () {
          closeGuideModal();
          openGuide(first.section);
        },
      }, ['Learn more']),
      el('button', { class: 'btn primary', onclick: closeGuideModal }, ['Got it']),
    ];

    var panel = el('div', { class: 'modal-panel guide-unlock-card' },
      [el('h2', { class: 'modal-title' }, [items.length > 1 ? 'New unlocks' : items[0].title])]
        .concat(items.length > 1 ? body : body.slice(1))
        .concat([el('div', { class: 'row' }, actions)]));
    hooks.showModal(panel);
    releaseModalFocus = trapFocus(panel);
  }

  function processCardQueue(state) {
    if (!isEnabled()) return;
    if (hooks.isModalOpen() || hooks.isCatchingUp()) return;
    if (!cardQueue.length) return;
    var keys = cardQueue.slice();
    cardQueue = [];
    showUnlockCard(keys, state);
  }

  // ---------- first-minutes coach ----------

  var tutorialActive = false;
  var spotlightEl = null;
  var spotlightGoalId = null;
  // Escape dismisses the current step's spotlight without completing it
  // (spec §3); dismissedStepId keeps runCoach from immediately rebuilding
  // it on the next tick. Cleared as soon as the current goal moves on.
  var dismissedStepId = null;
  var lastCoachGoalId = null;

  // Set while "Restart tutorial" is replaying the coach steps for a player
  // who has already completed some or all of them (spec: restarting must
  // still walk through the steps, independent of store.done, and land back
  // on whatever the real current goal is once the replay ends).
  var replayGoals = null;
  var replayIndex = 0;
  var releaseSpotlightFocus = null;

  function hideSpotlight() {
    if (spotlightEl && spotlightEl.parentNode) spotlightEl.parentNode.removeChild(spotlightEl);
    spotlightEl = null;
    spotlightGoalId = null;
    if (releaseSpotlightFocus) {
      var r = releaseSpotlightFocus;
      releaseSpotlightFocus = null;
      r();
    }
  }

  function currentCoachGoal() {
    if (replayGoals) {
      var id = replayGoals[replayIndex];
      return GuideGoals.GOALS.find(function (g) { return g.id === id; }) || null;
    }
    return GuideGoals.current(store.done);
  }

  function positionSpotlight(target) {
    if (!spotlightEl) return;
    var hole = spotlightEl.querySelector('.guide-spotlight-hole');
    var pop = spotlightEl.querySelector('.guide-spotlight-pop');
    var r = target.getBoundingClientRect();
    var pad = 6;
    if (hole) {
      hole.style.left = Math.max(0, r.left - pad) + 'px';
      hole.style.top = Math.max(0, r.top - pad) + 'px';
      hole.style.width = (r.width + pad * 2) + 'px';
      hole.style.height = (r.height + pad * 2) + 'px';
    }
    if (pop) {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var popRect = pop.getBoundingClientRect();
      var top = r.bottom + 14;
      if (top + popRect.height > vh - 8) top = Math.max(8, r.top - popRect.height - 14);
      var left = Math.min(Math.max(8, r.left), vw - popRect.width - 8);
      pop.style.top = Math.round(top) + 'px';
      pop.style.left = Math.round(left) + 'px';
    }
  }

  function ackGoal(id) {
    store.done = GuideGoals.ack(id, store.done);
    saveStore();
    hideSpotlight();
  }

  // Advances a replay to its next coach step (or ends the replay, landing
  // back on the real current goal per store.done — replay never mutates
  // store.done itself, so whatever that is is already correct).
  function replayNext() {
    hideSpotlight();
    if (!replayGoals) return;
    replayIndex++;
    if (replayIndex >= replayGoals.length) {
      replayGoals = null;
      tutorialActive = false;
    }
  }

  function skipTutorial() {
    if (replayGoals) {
      replayGoals = null;
      tutorialActive = false;
      hideSpotlight();
      return;
    }
    var ids = coachGoalIds();
    var last = ids[ids.length - 1];
    store.done = GuideGoals.ack(last, store.done);
    saveStore();
    tutorialActive = false;
    hideSpotlight();
  }

  function showSpotlight(goal, state) {
    hideSpotlight();
    spotlightGoalId = goal.id;
    var content = GuideContent.goals[goal.id];
    var popKids = [
      el('div', { class: 'guide-spotlight-title' }, [fill(content.title, state)]),
      el('div', { class: 'guide-spotlight-text' }, [fill(content.coach, state)]),
    ];
    if (replayGoals) {
      // Replaying: walk every coach step for teaching purposes only, so
      // even an action step advances on "Next" rather than waiting for
      // done(state) — which, for an advanced player, may already be true
      // or may never become true again (e.g. buyRed once bought).
      popKids.push(el('div', { class: 'row' }, [
        el('button', { class: 'btn primary', onclick: replayNext }, ['Next']),
      ]));
    } else if (goal.ack) {
      popKids.push(el('div', { class: 'row' }, [
        el('button', { class: 'btn primary', onclick: function () { ackGoal(goal.id); } }, ['Next']),
      ]));
    } else {
      popKids.push(el('div', { class: 'help guide-spotlight-hint' }, ['Do it to continue']));
    }
    popKids.push(el('button', {
      class: 'btn guide-skip-tutorial',
      onclick: skipTutorial,
    }, ['Skip tutorial']));

    // aria-hidden lives on the dim/cutout layer only — the popover is the
    // actual dialog and must stay reachable to assistive tech.
    var pop = el('div', { class: 'guide-spotlight-pop', role: 'dialog', 'aria-label': 'Tutorial step' }, popKids);
    var overlay = el('div', { class: 'guide-spotlight-overlay' }, [
      el('div', { class: 'guide-spotlight-hole', 'aria-hidden': 'true' }),
      pop,
    ]);
    document.body.appendChild(overlay);
    spotlightEl = overlay;
    releaseSpotlightFocus = trapFocus(pop);

    navigateToTarget(goal, function () {
      var nodes = findTargetEls(goal);
      if (!nodes.length || spotlightGoalId !== goal.id) return; // fail gracefully
      positionSpotlight(nodes[0]);
    });
  }

  function runCoach(state) {
    if (!isEnabled() || !tutorialActive) { hideSpotlight(); return; }
    if (hooks.isModalOpen() || hooks.isCatchingUp()) { hideSpotlight(); return; }
    var goal = currentCoachGoal();
    if (!goal || (!replayGoals && !goal.coach)) {
      tutorialActive = false;
      replayGoals = null;
      hideSpotlight();
      return;
    }
    if (goal.id !== lastCoachGoalId) {
      dismissedStepId = null;
      lastCoachGoalId = goal.id;
    }
    if (dismissedStepId === goal.id) {
      hideSpotlight();
      return;
    }
    if (spotlightGoalId !== goal.id) {
      showSpotlight(goal, state);
    } else {
      var nodes = findTargetEls(goal);
      if (nodes.length) {
        positionSpotlight(nodes[0]);
      } else {
        // The player navigated away from the target's tab mid-coach; steer
        // back to it (spec §3: "coach switches to the needed tab").
        navigateToTarget(goal, function () {
          var again = findTargetEls(goal);
          if (again.length) positionSpotlight(again[0]);
        });
      }
    }
  }

  // The main loop (and Guide.tick with it) is paused for the whole hidden
  // period / catch-up run, so a stale spotlight would otherwise sit on top
  // of the catch-up overlay until ticking resumes; hide it immediately.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) hideSpotlight();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (spotlightGoalId) {
      dismissedStepId = spotlightGoalId;
      hideSpotlight();
      return;
    }
    if (hooks.isModalOpen && hooks.isModalOpen() === 'guide') closeGuideModal();
  });

  // ---------- settings toggle API ----------

  function isEnabled() {
    return store.enabled !== false;
  }

  function setEnabled(v) {
    store.enabled = !!v;
    saveStore();
    if (!store.enabled) {
      clearPulse();
      hideSpotlight();
      tutorialActive = false;
      cardQueue = [];
      if (cardEl) cardEl.hidden = true;
      if (hooks.isModalOpen && hooks.isModalOpen() === 'guide') closeGuideModal();
    }
  }

  // Restarting must still teach every coach step even when some (or all)
  // are already done — sync would otherwise instantly re-mark them and
  // make this a no-op — so it replays them independent of store.done and
  // lands back on the real current goal once done (see replayNext).
  function restartTutorial() {
    replayGoals = coachGoalIds();
    replayIndex = 0;
    tutorialActive = true;
    dismissedStepId = null;
    lastCoachGoalId = null;
    hideSpotlight();
    if (hooks.isModalOpen && hooks.isModalOpen() === 'guide') closeGuideModal();
    hooks.setTab('circles');
  }

  // ---------- public API ----------

  function init(h) {
    if (h) {
      for (var k in h) {
        if (Object.prototype.hasOwnProperty.call(h, k)) hooks[k] = h[k];
      }
    }
    store = loadStore();
    var s = hooks.getState();
    if (s) {
      store.done = GuideGoals.sync(s, store.done);
      lastDoneCount = Object.keys(store.done).length;
      var g = GuideGoals.current(store.done);
      currentGoalId = g ? g.id : null;
    }
    // Fresh players (no save at boot) get the coach tutorial by default;
    // returning players (any save, however early) never get it automatically.
    tutorialActive = !hooks.hadSave;
    saveStore();
  }

  // Clears learned progress (done goals, seen unlock cards) without
  // touching the enabled/collapsed preferences. Called on hard reset (the
  // player's whole save is gone, so buyRed is the current goal again) and
  // on Import (a loaded save may be less advanced than store.done already
  // claims — sync is monotonic and never unmarks, so the done map has to
  // be rebuilt from scratch against whatever was just imported).
  function reset() {
    store.done = {};
    store.cardsSeen = {};
    saveStore();
    lastDoneCount = -1;
    currentGoalId = null;
    cardGoalId = undefined;
    cardQueue = [];
    hideSpotlight();
    clearPulse();
  }

  function tick(state) {
    if (!state) return;
    var completedId = currentGoalId;
    var changed = syncGoals(state);
    var goal = GuideGoals.current(store.done);
    currentGoalId = goal ? goal.id : null;
    if (changed && completedId && completedId !== currentGoalId && !hooks.isCatchingUp()) {
      var doneContent = GuideContent.goals[completedId];
      if (doneContent) hooks.toast('Goal complete: ' + fill(doneContent.title, state));
    }
    renderCard(state);
    updatePulse(state);
    runCoach(state);
    processCardQueue(state);
  }

  window.Guide = {
    init: init,
    tick: tick,
    showIntro: showIntro,
    openGuide: openGuide,
    unlock: unlock,
    restartTutorial: restartTutorial,
    reset: reset,
    isEnabled: isEnabled,
    setEnabled: setEnabled,
  };
})();
</script>
<script>// src/ui-infinity.js — the ∞ tab (Tree, Gens, Auto, ICs, Stars). DOM only via
// kit.el; reads state and Engine directly, never window/localStorage except
// the try/catch-wrapped sub-tab preference below.
(function () {
  'use strict';

  var Engine = window.Engine;
  var STORAGE_KEY = 'revidle.infTab';

  var SUBTABS = [
    { id: 'tree', label: 'Tree', visible: function () { return true; } },
    { id: 'gens', label: 'Gens', visible: function (s) { return Engine.hasUpg(s, '1;1'); } },
    { id: 'auto', label: 'Auto', visible: function (s) { return Engine.hasUpg(s, '1;1'); } },
    { id: 'ics', label: 'ICs', visible: function (s) { return Engine.hasUpg(s, '7;1'); } },
    { id: 'stars', label: 'Stars', visible: function (s) { return Engine.hasUpg(s, '21;1'); } },
  ];

  var subTab = loadSubTab();

  function loadSubTab() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (v && SUBTABS.some(function (t) { return t.id === v; })) return v;
    } catch (e) { /* ignore: sub-tab memory is best-effort */ }
    return 'tree';
  }

  function saveSubTab(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* ignore */ }
  }

  function visibleSubTabs(state) {
    return SUBTABS.filter(function (t) { return t.visible(state); });
  }

  // ---------- small formatters ----------

  function fmt(x) {
    return Engine.fmtLog(x);
  }

  // Formats a plain (non-log) count such as state.infinities: usually an
  // integer, but passive-Infinity upgrades (18;1) can make it fractional.
  function fmtInfNumber(n) {
    var frac = Math.abs(n - Math.round(n)) > 1e-9;
    try {
      return n.toLocaleString('en-US', frac ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
    } catch (e) {
      return String(n);
    }
  }

  // Formats a plain (non-log) multiplier/value shown on a Tree card, e.g. the
  // 1.1 in "Lap speed ×1.1" or the 32 in "×32".
  function fmtNum(x) {
    if (!isFinite(x)) return String(x);
    if (x === 0) return '0';
    var abs = Math.abs(x);
    if (abs >= 1000 || abs < 0.001) return x.toExponential(2);
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    return x.toFixed(abs < 10 ? 3 : 2);
  }

  // ---------- header ----------

  function ipLineText(state) {
    // At the IP cap (the finale) further gains are clamped away: no "+X next".
    if (state.inf.ipLog >= Engine.INFINITY_LOG) return 'IP ' + fmt(state.inf.ipLog);
    return 'IP ' + fmt(state.inf.ipLog) + ' · +' + fmt(Engine.ipGainLog(state)) + ' next';
  }

  function infLineText(state) {
    return '∞ ' + fmtInfNumber(state.infinities);
  }

  function renderHeader(kit, state) {
    return kit.el('div', { id: 'inf-header', class: 'inf-header', 'data-guide': 'inf-header' }, [
      kit.el('span', { class: 'inf-ip', tabindex: '0', 'data-tip': 'ipHeader' }, [ipLineText(state)]),
      kit.el('span', {}, [' · ']),
      kit.el('span', { class: 'inf-count', tabindex: '0', 'data-tip': 'infCount' }, [infLineText(state)]),
    ]);
  }

  function updateHeader(header, state) {
    var ipSpan = header.querySelector('.inf-ip');
    if (ipSpan) ipSpan.textContent = ipLineText(state);
    var cntSpan = header.querySelector('.inf-count');
    if (cntSpan) cntSpan.textContent = infLineText(state);
  }

  // ---------- sub-tab row ----------

  function renderSubTabRow(kit, state, container) {
    var vis = visibleSubTabs(state);
    if (vis.map(function (t) { return t.id; }).indexOf(subTab) === -1) subTab = 'tree';
    var row = kit.el('div', { class: 'inf-subtabs', role: 'tablist' });
    vis.forEach(function (t) {
      var btn = kit.el('button', {
        class: 'tab-btn sub-tab-btn',
        role: 'tab',
        'aria-selected': String(t.id === subTab),
        onclick: function () {
          if (subTab === t.id) return;
          subTab = t.id;
          saveSubTab(t.id);
          render(container, state, kit);
        },
      }, [t.label]);
      row.appendChild(btn);
    });
    return row;
  }

  // ---------- Tree ----------

  function columnsOf(upgrades) {
    var cols = [];
    upgrades.forEach(function (u) { if (cols.indexOf(u.col) === -1) cols.push(u.col); });
    cols.sort(function (a, b) { return a - b; });
    return cols;
  }

  function prevColOf(cols, col) {
    var best = null;
    for (var i = 0; i < cols.length; i++) {
      if (cols[i] < col) best = cols[i];
      else break;
    }
    return best;
  }

  // Every column up to and including the first column with no owned node,
  // plus one dimmed preview column after it (per the Task 11 brief).
  function revealColumns(state, cols) {
    var firstEmptyIdx = -1;
    for (var i = 0; i < cols.length; i++) {
      var col = cols[i];
      var owned = Engine.UPGRADES.some(function (u) { return u.col === col && Engine.hasUpg(state, u.id); });
      if (!owned) { firstEmptyIdx = i; break; }
    }
    if (firstEmptyIdx === -1) return { shown: cols.slice(), previewCol: null };
    var shown = cols.slice(0, firstEmptyIdx + 1);
    var previewCol = firstEmptyIdx + 1 < cols.length ? cols[firstEmptyIdx + 1] : null;
    if (previewCol !== null) shown.push(previewCol);
    return { shown: shown, previewCol: previewCol };
  }

  function lockedText(cols, u) {
    if (u.req === 'prev') {
      var pc = prevColOf(cols, u.col);
      return pc === null ? 'Needs an earlier upgrade' : 'Needs a C' + pc + ' upgrade';
    }
    return 'Needs ' + u.req.join(' or ');
  }

  // Some upgrade effects aren't a plain "×N" multiplier: 2;1/6;1/13;1 add a
  // flat amount, 14;2/19;1 assign gpExp outright, and 18;1 is a rate. This
  // hint map lets the effect line (and help.js's iuCard tooltip) say the
  // right thing instead of a blanket "now ×N" for all of them.
  var EFFECT_FORMAT = {
    '2;1': function (v) { return 'now +' + fmtNum(v); },
    '6;1': function (v) { return 'now +' + fmtNum(v); },
    '13;1': function (v) { return 'now +' + fmtNum(v); },
    '14;2': function (v) { return 'now GP exponent ' + v.toFixed(3); },
    '19;1': function (v) { return 'now GP exponent ' + v.toFixed(3); },
    '18;1': function (v) { return 'now +' + fmtNum(v) + ' ∞/s'; },
  };

  function effectSuffix(u, effect) {
    if (effect === null) return '';
    var f = EFFECT_FORMAT[u.id];
    return ' · ' + (f ? f(effect) : ('now ×' + fmtNum(effect)));
  }

  function buildCard(kit, state, cols, u, idx, dimmed) {
    var owned = Engine.hasUpg(state, u.id);
    var reqMet = Engine.upgReqMet(state, u.id);
    var buyable = !owned && reqMet && Engine.canBuyUpgrade(state, u.id);
    // Requirement met but not enough IP yet is a different state from an
    // unmet requirement: it doesn't get the "Needs X" text, since the card
    // isn't blocked on anything but affordability.
    var unaffordable = !owned && reqMet && !buyable;
    var effect = Engine.upgEffect(state, u.id);
    var stateCls = owned ? 'owned' : buyable ? 'buyable' : (unaffordable ? 'unaffordable' : 'locked');

    var kids = [
      kit.el('div', { class: 'card-title' }, [u.name]),
      kit.el('div', { class: 'iu-cost' }, [fmt(Math.log10(u.cost)) + ' IP']),
      kit.el('div', { class: 'iu-effect' }, [u.desc + effectSuffix(u, effect)]),
    ];
    if (!owned && !reqMet) {
      kids.push(kit.el('div', { class: 'iu-locked' }, [lockedText(cols, u)]));
    } else if (unaffordable) {
      var shortLog = Engine.logSub(Math.log10(u.cost), state.inf.ipLog);
      kids.push(kit.el('div', { class: 'iu-locked' }, ['Need ' + fmt(shortLog) + ' more IP']));
    }

    var attrs = {
      class: 'card iu-card ' + stateCls + (dimmed ? ' preview' : ''),
      'data-tip': 'iuCard',
      'data-tip-i': String(idx),
      'data-id': u.id,
      tabindex: '0',
    };

    if (buyable) {
      var btn = kit.el('button', attrs, kids);
      btn.addEventListener('click', function () {
        if (Engine.buyUpgrade(state, u.id)) {
          kit.markDirty();
          kit.save();
        }
      });
      return btn;
    }
    return kit.el('div', attrs, kids);
  }

  function renderTree(kit, state) {
    var cols = columnsOf(Engine.UPGRADES);
    var reveal = revealColumns(state, cols);
    var wrap = kit.el('div', { class: 'inf-tree', 'data-guide': 'inf-tree' });
    reveal.shown.forEach(function (col) {
      var dimmed = col === reveal.previewCol;
      var grid = kit.el('div', { class: 'iu-grid' });
      Engine.UPGRADES.forEach(function (u, idx) {
        if (u.col !== col) return;
        grid.appendChild(buildCard(kit, state, cols, u, idx, dimmed));
      });
      wrap.appendChild(kit.el('div', { class: 'iu-col' + (dimmed ? ' preview' : ''), 'data-col': String(col) }, [
        kit.el('div', { class: 'iu-col-label' }, ['C' + col]),
        grid,
      ]));
    });
    return wrap;
  }

  // Patches card text in place; only asks for a full re-render (via
  // kit.markDirty, which the outer tab dispatch honors on the next domUpdate)
  // when a card's owned/buyable/locked state — or the revealed column set —
  // actually changed, since those need different DOM structure (only a
  // buyable card is a <button>) or a different set of columns.
  function updateTree(root, kit, state) {
    var needsRebuild = false;
    var treeCols = columnsOf(Engine.UPGRADES);
    var cards = root.querySelectorAll('.iu-card');
    for (var i = 0; i < cards.length; i++) {
      var node = cards[i];
      var id = node.getAttribute('data-id');
      var u = Engine.upgById(id);
      if (!u) continue;
      var owned = Engine.hasUpg(state, id);
      var reqMet = Engine.upgReqMet(state, id);
      var buyable = !owned && reqMet && Engine.canBuyUpgrade(state, id);
      // owned/buyable each need a different DOM tag (only buyable is a
      // <button>), so those transitions force a full rebuild. locked <->
      // unaffordable is div-to-div and just needs its class/text patched.
      if (owned !== node.classList.contains('owned') || buyable !== node.classList.contains('buyable')) {
        needsRebuild = true;
        break;
      }
      var unaffordable = !owned && reqMet && !buyable;
      node.classList.toggle('unaffordable', unaffordable);
      node.classList.toggle('locked', !owned && !buyable && !unaffordable);

      var effect = Engine.upgEffect(state, id);
      var effLine = node.querySelector('.iu-effect');
      if (effLine) effLine.textContent = u.desc + effectSuffix(u, effect);

      var lockedLine = node.querySelector('.iu-locked');
      if (!owned && !reqMet) {
        if (lockedLine) lockedLine.textContent = lockedText(treeCols, u);
      } else if (unaffordable) {
        var shortLog = Engine.logSub(Math.log10(u.cost), state.inf.ipLog);
        if (lockedLine) lockedLine.textContent = 'Need ' + fmt(shortLog) + ' more IP';
      }
    }
    if (!needsRebuild) {
      var reveal = revealColumns(state, treeCols);
      var shownCols = Array.prototype.map.call(root.querySelectorAll('.iu-col'), function (n) {
        return Number(n.getAttribute('data-col'));
      });
      if (shownCols.length !== reveal.shown.length
        || shownCols.some(function (c, idx) { return c !== reveal.shown[idx]; })) {
        needsRebuild = true;
      }
    }
    if (needsRebuild) kit.markDirty();
  }

  // ---------- Gens ----------

  function highestBoughtTier(state) {
    var h = 0;
    for (var k = 0; k < Engine.GEN_COUNT; k++) {
      if (state.inf.gens[k].b > 0) h = k + 1;
    }
    return h;
  }

  function visibleGenCount(state) {
    return Math.min(10, highestBoughtTier(state) + 1);
  }

  // The log10 rate this generator currently produces: G(k+1) feeds G(k), and
  // G1 (k=0) feeds Generator Power (plus any Star bonus to that GP feed).
  function genRateLog(state, k) {
    var g = state.inf.gens[k];
    if (g.aLog === -Infinity) return -Infinity;
    var L = g.aLog + Engine.genMultLog(state, k);
    if (k === 0 && typeof Engine.starGpLog === 'function') L += Engine.starGpLog(state);
    return L;
  }

  function gpLineText(state) {
    return 'GP ' + fmt(state.inf.gpLog) + ' → Mult Gain ×' + fmt(Engine.gpMultLog(state))
      + ' (^' + Engine.gpExp(state).toFixed(3) + ')';
  }

  function buildGenRow(kit, state, k) {
    var n = k + 1;
    var row = kit.el('div', {
      class: 'gen-row', 'data-k': String(k), tabindex: '0', 'data-tip': 'genRow', 'data-tip-i': String(k),
    }, [
      kit.el('div', { class: 'gen-name' }, ['G' + n]),
      kit.el('div', { class: 'gen-meta' }, [
        kit.el('span', { class: 'gen-amount' }, [fmt(state.inf.gens[k].aLog)]),
        kit.el('span', { class: 'gen-mult' }, ['×' + fmt(Engine.genMultLog(state, k))]),
        kit.el('span', { class: 'gen-rate' }, ['+' + fmt(genRateLog(state, k)) + '/s']),
      ]),
    ]);
    var buyBtn = kit.el('button', {
      class: 'btn gen-buy', 'data-tip': 'genBuy', 'data-tip-i': String(k),
    }, [fmt(Engine.genCostLog(state, k)) + ' IP']);
    buyBtn.disabled = !Engine.canBuyGen(state, k);
    buyBtn.addEventListener('click', function () {
      if (Engine.buyGen(state, k)) {
        kit.markDirty();
        kit.save();
      }
    });
    row.appendChild(buyBtn);
    return row;
  }

  function renderGens(kit, state) {
    var wrap = kit.el('div', { class: 'inf-gens', 'data-guide': 'inf-gens' });
    wrap.appendChild(kit.el('div', { class: 'stat-line gp-line', tabindex: '0', 'data-tip': 'gpLine' }, [
      kit.el('span', { id: 'gp-line-value' }, [gpLineText(state)]),
    ]));

    var count = visibleGenCount(state);
    var maxMult = -Infinity;
    for (var k = 0; k < count; k++) {
      wrap.appendChild(buildGenRow(kit, state, k));
      maxMult = Math.max(maxMult, Engine.genMultLog(state, k));
    }
    var softcapLog = Engine.TUNE.genSoftcapLog;
    if (maxMult >= softcapLog) {
      wrap.appendChild(kit.el('p', { class: 'help' }, ['Generator Mult softcapped above e' + softcapLog.toLocaleString('en-US')]));
    }
    return wrap;
  }

  function updateGens(root, kit, state) {
    var gpValue = root.querySelector('#gp-line-value');
    if (gpValue) gpValue.textContent = gpLineText(state);

    var rows = root.querySelectorAll('.gen-row');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var k = Number(row.getAttribute('data-k'));
      var amt = row.querySelector('.gen-amount');
      if (amt) amt.textContent = fmt(state.inf.gens[k].aLog);
      var multEl = row.querySelector('.gen-mult');
      if (multEl) multEl.textContent = '×' + fmt(Engine.genMultLog(state, k));
      var rateEl = row.querySelector('.gen-rate');
      if (rateEl) rateEl.textContent = '+' + fmt(genRateLog(state, k)) + '/s';
      var buyBtn = row.querySelector('.gen-buy');
      if (buyBtn) {
        buyBtn.textContent = fmt(Engine.genCostLog(state, k)) + ' IP';
        buyBtn.disabled = !Engine.canBuyGen(state, k);
      }
    }
    if (rows.length !== visibleGenCount(state)) kit.markDirty();
  }

  // ---------- shared small helpers (Auto / ICs / Stars) ----------

  // m:ss for challenge best times; null (never completed) -> em dash.
  function fmtMMSS(sec) {
    if (sec === null || sec === undefined) return '—';
    var s = Math.round(sec);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // ---------- Auto ----------

  var PROMO_NAMES = ['Mult Gain', 'Lap Speed', 'Ascension Power', 'Promotion Power'];

  function buildMasterToggle(kit, tipAttrs, getOn, setOn) {
    var attrs = {
      class: 'btn toggle auto-master',
      'aria-pressed': String(getOn()),
      tabindex: '0',
    };
    for (var key in tipAttrs) attrs[key] = tipAttrs[key];
    var btn = kit.el('button', attrs, [getOn() ? 'On' : 'Off']);
    btn.addEventListener('click', function () {
      setOn(!getOn());
      btn.setAttribute('aria-pressed', String(getOn()));
      btn.textContent = getOn() ? 'On' : 'Off';
      kit.save();
    });
    return btn;
  }

  function buildColorGrid(kit, circlesArr, onToggle) {
    var grid = kit.el('div', { class: 'auto-dot-grid' });
    for (var i = 0; i < 10; i++) {
      (function (i) {
        var color = Engine.CIRCLES[i].color;
        var dot = kit.el('button', {
          class: 'auto-dot' + (circlesArr[i] ? ' active' : ''),
          style: 'border-color:' + color + ';color:' + color,
          'aria-pressed': String(!!circlesArr[i]),
          'aria-label': Engine.CIRCLES[i].name,
          tabindex: '0',
        });
        dot.addEventListener('click', function () {
          circlesArr[i] = !circlesArr[i];
          dot.classList.toggle('active', circlesArr[i]);
          dot.setAttribute('aria-pressed', String(circlesArr[i]));
          onToggle();
        });
        grid.appendChild(dot);
      })(i);
    }
    return grid;
  }

  // A single committed-on-change numeric/text field. `stored` starts as the
  // engine value; format() renders it as input text, parse() turns raw text
  // back into a candidate value (or null if unparseable). An invalid commit
  // (parse failure, or below `min`) reverts the input and toasts, per the
  // brief's "Inputs commit on change ... invalid reverts + toast" rule.
  function buildNumberField(kit, label, extraAttrs, initialStored, format, parse, min, apply) {
    var wrap = kit.el('div', { class: 'auto-field' });
    wrap.appendChild(kit.el('label', { class: 'auto-field-label' }, [label]));
    var stored = initialStored;
    var attrs = Object.assign({ type: 'text', class: 'auto-input', value: format(stored) }, extraAttrs || {});
    var input = kit.el('input', attrs);
    input.addEventListener('change', function () {
      var parsed = parse(input.value);
      if (parsed === null || parsed === undefined || isNaN(parsed) || !isFinite(parsed)
        || (min !== undefined && parsed < min)) {
        input.value = format(stored);
        kit.toast('Invalid value');
        return;
      }
      stored = parsed;
      input.value = format(stored);
      apply(parsed);
      kit.save();
    });
    wrap.appendChild(input);
    return wrap;
  }

  function plainFormat(v) { return String(v); }
  function plainParse(raw) {
    var n = parseFloat(raw);
    return isNaN(n) ? null : n;
  }
  // Auto-Infinity's min-IP field: accepts "1e20" or "100000", stored as log10.
  function formatMinIp(log) {
    if (!isFinite(log)) return '0';
    if (log === 0) return '1';
    return '1e' + (Number.isInteger(log) ? log : log.toFixed(2));
  }
  function parseMinIp(raw) {
    var v = Number(String(raw).trim());
    if (!isFinite(v) || v <= 0) return null;
    return Math.log10(v);
  }

  function buildAutoBuyCard(kit, state) {
    var auto = state.inf.auto.buy;
    var card = kit.el('div', { class: 'card auto-card', 'data-auto': 'buy' });
    var head = kit.el('div', { class: 'row auto-card-head' }, [kit.el('div', { class: 'card-title' }, ['Autobuy'])]);
    head.appendChild(buildMasterToggle(kit, { 'data-tip': 'autoBuy' }, function () { return auto.on; }, function (v) { auto.on = v; }));
    card.appendChild(head);
    card.appendChild(buildColorGrid(kit, auto.circles, function () { kit.save(); }));
    return card;
  }

  function buildAutoAscCard(kit, state) {
    var auto = state.inf.auto.asc;
    var card = kit.el('div', { class: 'card auto-card', 'data-auto': 'asc' });
    var head = kit.el('div', { class: 'row auto-card-head' }, [kit.el('div', { class: 'card-title' }, ['Auto-Ascend'])]);
    head.appendChild(buildMasterToggle(kit, { 'data-tip': 'autoAsc' }, function () { return auto.on; }, function (v) { auto.on = v; }));
    card.appendChild(head);
    card.appendChild(buildColorGrid(kit, auto.circles, function () { kit.save(); }));
    return card;
  }

  function buildAutoPromoteCard(kit, state) {
    var auto = state.inf.auto.promote;
    var card = kit.el('div', { class: 'card auto-card', 'data-auto': 'promote' });
    var head = kit.el('div', { class: 'row auto-card-head' }, [kit.el('div', { class: 'card-title' }, ['Auto-Promote'])]);
    head.appendChild(buildMasterToggle(kit, { 'data-tip': 'autoPromote' }, function () { return auto.on; }, function (v) { auto.on = v; }));
    card.appendChild(head);

    var orderRow = kit.el('div', { class: 'auto-order-row' });
    function renderOrderChips() {
      orderRow.innerHTML = '';
      auto.order.forEach(function (k, idx) {
        var chip = kit.el('button', { class: 'btn order-chip' }, [PROMO_NAMES[k]]);
        chip.addEventListener('click', function () {
          var prevIdx = (idx - 1 + auto.order.length) % auto.order.length;
          var tmp = auto.order[idx];
          auto.order[idx] = auto.order[prevIdx];
          auto.order[prevIdx] = tmp;
          renderOrderChips();
          kit.save();
        });
        orderRow.appendChild(chip);
      });
    }
    renderOrderChips();
    card.appendChild(orderRow);

    card.appendChild(buildNumberField(kit, '×', {}, auto.xFactor, plainFormat, plainParse, 1.1, function (v) { auto.xFactor = v; }));
    card.appendChild(buildNumberField(kit, 'Min time (s)', {}, auto.minTime, plainFormat, plainParse, 0, function (v) { auto.minTime = v; }));
    return card;
  }

  function buildAutoPrestigeCard(kit, state) {
    var auto = state.inf.auto.prestige;
    var card = kit.el('div', { class: 'card auto-card', 'data-auto': 'prestige' });
    var head = kit.el('div', { class: 'row auto-card-head' }, [kit.el('div', { class: 'card-title' }, ['Auto-Prestige'])]);
    head.appendChild(buildMasterToggle(kit, { 'data-tip': 'autoPrestige' }, function () { return auto.on; }, function (v) { auto.on = v; }));
    card.appendChild(head);
    card.appendChild(buildNumberField(kit, 'multX', {}, auto.multX, plainFormat, plainParse, 1, function (v) { auto.multX = v; }));
    card.appendChild(buildNumberField(kit, 'expGain', {}, auto.expGain, plainFormat, plainParse, 0, function (v) { auto.expGain = v; }));
    card.appendChild(buildNumberField(kit, 'Min time (s)', {}, auto.minTime, plainFormat, plainParse, 0, function (v) { auto.minTime = v; }));
    return card;
  }

  function buildAutoInfinityCard(kit, state) {
    var auto = state.inf.auto.infinity;
    var card = kit.el('div', { class: 'card auto-card', 'data-auto': 'infinity' });
    var head = kit.el('div', { class: 'row auto-card-head' }, [kit.el('div', { class: 'card-title' }, ['Auto-Infinity'])]);
    head.appendChild(buildMasterToggle(kit, { 'data-tip': 'autoInfinity' }, function () { return auto.on; }, function (v) { auto.on = v; }));
    card.appendChild(head);
    card.appendChild(buildNumberField(kit, 'Min IP', {}, auto.minIpLog, formatMinIp, parseMinIp, undefined, function (v) { auto.minIpLog = v; }));
    card.appendChild(buildNumberField(kit, 'Min time (s)', {}, auto.minTime, plainFormat, plainParse, 0, function (v) { auto.minTime = v; }));
    return card;
  }

  function buildStallField(kit, state) {
    var auto = state.inf.auto;
    var card = kit.el('div', { class: 'card auto-card', 'data-auto': 'shared' }, [
      kit.el('div', { class: 'card-title' }, ['Shared']),
    ]);
    card.appendChild(buildNumberField(kit, 'Stall seconds', { 'data-tip': 'stallSec', tabindex: '0' }, auto.stallSec, plainFormat, plainParse, 0, function (v) { auto.stallSec = v; }));
    return card;
  }

  function renderAuto(kit, state) {
    var wrap = kit.el('div', { class: 'inf-auto' });
    var u = Engine.autoUnlocked(state);
    if (u.buy) wrap.appendChild(buildAutoBuyCard(kit, state));
    if (u.asc) wrap.appendChild(buildAutoAscCard(kit, state));
    if (u.promote) wrap.appendChild(buildAutoPromoteCard(kit, state));
    if (u.prestige) wrap.appendChild(buildAutoPrestigeCard(kit, state));
    if (u.infinity) wrap.appendChild(buildAutoInfinityCard(kit, state));
    wrap.appendChild(buildStallField(kit, state));
    return wrap;
  }

  function autoUnlockedKey(state) {
    var u = Engine.autoUnlocked(state);
    return ['buy', 'asc', 'promote', 'prestige', 'infinity'].filter(function (k) { return u[k]; }).join(',');
  }

  // Auto's cards have no live-computed numbers besides the inputs the player
  // owns, so the only thing that can go stale under it without a rebuild is
  // which cards are unlocked (buying an upgrade elsewhere while this sub-tab
  // is open) — everything else is driven by direct DOM mutation in the click
  // handlers above.
  function updateAuto(root, kit, state) {
    var cards = root.querySelectorAll('[data-auto]');
    var present = Array.prototype.map.call(cards, function (c) { return c.getAttribute('data-auto'); })
      .filter(function (k) { return k !== 'shared'; }).join(',');
    if (present !== autoUnlockedKey(state)) kit.markDirty();
  }

  // ---------- ICs ----------

  // The status label: active beats done (a challenge stays "done" once it's
  // ever completed) beats available beats locked.
  function icCardLabel(state, n) {
    if (state.inf.ic.active === n) return 'active';
    if (state.inf.ic.done[n - 1]) return 'done';
    if (Engine.canStartChallenge(state, n)) return 'available';
    return 'locked';
  }
  // Engine.canStartChallenge doesn't exclude an already-done challenge (it
  // only needs no challenge active and the previous one done), so a done
  // card can still be replayed for a better best time — this is tracked
  // separately from the label so "Done ✓" and a Start button can coexist.
  function icCardKey(state, n) {
    return icCardLabel(state, n) + (Engine.canStartChallenge(state, n) ? '+start' : '');
  }

  function buildBreakCard(kit, state) {
    var card = kit.el('div', { class: 'card ic-break-card', 'data-broken': String(state.inf.broken), 'data-guide': 'inf-break' }, [
      kit.el('div', { class: 'card-title' }, ['Break Infinity']),
    ]);
    var btn = kit.el('button', { class: 'btn full-width', 'data-tip': 'breakToggle', tabindex: '0' }, [state.inf.broken ? 'Fix' : 'Break']);
    btn.addEventListener('click', function () {
      Engine.setBroken(state, !state.inf.broken);
      kit.markDirty();
      kit.save();
    });
    card.appendChild(btn);
    return card;
  }

  function buildIcCard(kit, state, c) {
    var n = c.n;
    var label = icCardLabel(state, n);
    var canStart = Engine.canStartChallenge(state, n);
    var best = state.inf.ic.best[n - 1];
    var statusText = label === 'done' ? 'Done ✓' : label === 'active' ? 'Active' : label === 'available' ? 'Available' : 'Locked';
    var cls = label === 'done' ? ' owned' : label === 'active' ? ' buyable' : '';
    var card = kit.el('div', {
      class: 'card ic-card' + cls,
      'data-n': String(n),
      'data-state': icCardKey(state, n),
      tabindex: '0',
      'data-tip': 'icCard',
      'data-tip-i': String(n),
    }, [
      kit.el('div', { class: 'card-title' }, ['IC' + n + ' ' + c.name]),
      kit.el('div', { class: 'iu-effect' }, ['Handicap: ' + c.handicap]),
      kit.el('div', { class: 'iu-effect' }, ['Reward: ' + c.reward]),
      kit.el('div', { class: 'stat-line' }, [kit.el('span', { class: 'label' }, ['Status']), kit.el('span', {}, [statusText])]),
      kit.el('div', { class: 'stat-line' }, [kit.el('span', { class: 'label' }, ['Best']), kit.el('span', {}, [fmtMMSS(best)])]),
    ]);
    if (label === 'active') {
      var exitBtn = kit.el('button', { class: 'btn full-width' }, []);
      kit.twoStepConfirm(exitBtn, 'Exit', 'Reset run?', function () {
        Engine.exitChallenge(state);
        kit.markDirty();
        kit.save();
      });
      card.appendChild(exitBtn);
    } else if (canStart) {
      var startBtn = kit.el('button', { class: 'btn full-width', 'data-tip': 'icStart', 'data-tip-i': String(n) }, []);
      kit.twoStepConfirm(startBtn, 'Start', 'Reset run?', function () {
        Engine.startChallenge(state, n);
        kit.markDirty();
        kit.save();
      });
      card.appendChild(startBtn);
    }
    return card;
  }

  function renderICs(kit, state) {
    var wrap = kit.el('div', { class: 'inf-ics', 'data-guide': 'inf-ics' });
    if (Engine.canBreak(state)) wrap.appendChild(buildBreakCard(kit, state));
    Engine.CHALLENGES.forEach(function (c) { wrap.appendChild(buildIcCard(kit, state, c)); });
    if (Engine.icDoneCount(state) === 9) {
      var sum = state.inf.ic.best.reduce(function (a, b) { return a + b; }, 0);
      wrap.appendChild(kit.el('div', { class: 'stat-line', id: 'ic-sigma' }, [
        kit.el('span', { class: 'label' }, ['ΣIC']),
        kit.el('span', {}, [fmtMMSS(sum)]),
      ]));
    }
    return wrap;
  }

  // Every visible number on an IC card (status, best time) is a direct
  // function of icCardState + best, both of which only change together with
  // the state that this diff already checks — so a state match means nothing
  // on the card is stale, and a mismatch (or a Break-card/ΣIC-line
  // appearance change) is handled by a full rebuild via markDirty.
  function updateICs(root, kit, state) {
    var wantBreak = Engine.canBreak(state);
    var breakCard = root.querySelector('.ic-break-card');
    if (wantBreak !== !!breakCard) { kit.markDirty(); return; }
    if (breakCard && breakCard.getAttribute('data-broken') !== String(state.inf.broken)) { kit.markDirty(); return; }
    var cards = root.querySelectorAll('.ic-card');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var n = Number(card.getAttribute('data-n'));
      if (card.getAttribute('data-state') !== icCardKey(state, n)) { kit.markDirty(); return; }
    }
    var wantSigma = Engine.icDoneCount(state) === 9;
    if (wantSigma !== !!root.querySelector('#ic-sigma')) kit.markDirty();
  }

  // ---------- Stars ----------

  function starLineText(state) {
    return 'SD ' + fmt(state.inf.stars.sdLog) + ' (+' + fmt(Engine.sdRateLog(state)) + '/s) → GP gain ×' + fmt(Engine.starGpLog(state));
  }

  function starRowText(kind, state) {
    if (kind === 'star') return 'Star (n=' + state.inf.stars.n + ')';
    if (kind === 'base') return 'Base ' + (2.75 + 0.275 * state.inf.stars.nb).toFixed(3);
    return 'Exponent ' + (0.4 + 0.05 * state.inf.stars.ne).toFixed(3);
  }
  function starRowCostLog(kind, state) {
    if (kind === 'star') return Engine.starCostLog(state);
    if (kind === 'base') return Engine.starBaseCostLog(state);
    return Engine.starExpCostLog(state);
  }
  function starRowCanBuy(kind, state) {
    if (!state.inf.upg['21;1']) return false;
    if (kind === 'star') return Engine.canBuyStar(state);
    if (kind === 'exp' && state.inf.stars.ne >= Engine.TUNE.starExpMax) return false;
    return state.inf.ipLog >= starRowCostLog(kind, state);
  }
  function starRowBuy(kind, state) {
    if (kind === 'star') return Engine.buyStar(state);
    if (kind === 'base') return Engine.buyStarBase(state);
    return Engine.buyStarExp(state);
  }

  function buildStarRow(kit, state, kind, tipAttrs) {
    var rowAttrs = { class: 'star-buy-row', 'data-star': kind, tabindex: '0' };
    for (var key in tipAttrs) rowAttrs[key] = tipAttrs[key];
    var row = kit.el('div', rowAttrs, [
      kit.el('div', { class: 'star-buy-label' }, [starRowText(kind, state)]),
    ]);
    var btn = kit.el('button', { class: 'btn star-buy-btn' }, [fmt(starRowCostLog(kind, state)) + ' IP']);
    btn.disabled = !starRowCanBuy(kind, state);
    btn.addEventListener('click', function () {
      if (starRowBuy(kind, state)) {
        kit.markDirty();
        kit.save();
      }
    });
    row.appendChild(btn);
    return row;
  }

  function updateStarRow(row, state) {
    var kind = row.getAttribute('data-star');
    var label = row.querySelector('.star-buy-label');
    if (label) label.textContent = starRowText(kind, state);
    var btn = row.querySelector('.star-buy-btn');
    if (btn) {
      btn.textContent = fmt(starRowCostLog(kind, state)) + ' IP';
      btn.disabled = !starRowCanBuy(kind, state);
    }
  }

  function sdRowText(state, j) {
    var u = Engine.SD_UPGRADES[j];
    var level = state.inf.stars.sdU[j];
    var max = u.max === Infinity ? '∞' : String(u.max);
    return u.name + ' — Lv ' + level + '/' + max;
  }

  function buildSdRow(kit, state, j) {
    var row = kit.el('div', { class: 'card sd-row', 'data-j': String(j), tabindex: '0', 'data-tip': 'sdUpg', 'data-tip-i': String(j) }, [
      kit.el('div', { class: 'card-title sd-title' }, [sdRowText(state, j)]),
      kit.el('div', { class: 'iu-effect' }, [Engine.SD_UPGRADES[j].desc]),
    ]);
    var btn = kit.el('button', { class: 'btn full-width sd-buy-btn' }, [fmt(Engine.sdUpgCostLog(state, j)) + ' SD']);
    btn.disabled = !Engine.canBuySdUpg(state, j);
    btn.addEventListener('click', function () {
      if (Engine.buySdUpg(state, j)) {
        kit.markDirty();
        kit.save();
      }
    });
    row.appendChild(btn);
    return row;
  }

  function updateSdRow(row, state, j) {
    var title = row.querySelector('.sd-title');
    if (title) title.textContent = sdRowText(state, j);
    var btn = row.querySelector('.sd-buy-btn');
    if (btn) {
      btn.textContent = fmt(Engine.sdUpgCostLog(state, j)) + ' SD';
      btn.disabled = !Engine.canBuySdUpg(state, j);
    }
  }

  function renderStars(kit, state) {
    var wrap = kit.el('div', { class: 'inf-stars', 'data-guide': 'inf-stars' });
    wrap.appendChild(kit.el('div', { class: 'stat-line', id: 'star-line', tabindex: '0', 'data-tip': 'sdAmount' }, [
      kit.el('span', { id: 'star-line-value' }, [starLineText(state)]),
    ]));
    wrap.appendChild(buildStarRow(kit, state, 'star', { 'data-tip': 'starBuy' }));
    wrap.appendChild(buildStarRow(kit, state, 'base', { 'data-tip': 'starBase' }));
    wrap.appendChild(buildStarRow(kit, state, 'exp', { 'data-tip': 'starExp' }));
    for (var j = 0; j < Engine.SD_UPGRADES.length; j++) {
      wrap.appendChild(buildSdRow(kit, state, j));
    }
    wrap.appendChild(kit.el('p', { class: 'help' }, ['Stardust resets on Infinity — spend it first.']));
    return wrap;
  }

  function updateStars(root, kit, state) {
    var lineValue = root.querySelector('#star-line-value');
    if (lineValue) lineValue.textContent = starLineText(state);
    var starRows = root.querySelectorAll('.star-buy-row');
    Array.prototype.forEach.call(starRows, function (row) { updateStarRow(row, state); });
    var sdRows = root.querySelectorAll('.sd-row');
    Array.prototype.forEach.call(sdRows, function (row) {
      var j = Number(row.getAttribute('data-j'));
      updateSdRow(row, state, j);
    });
  }

  // ---------- tab dispatch ----------

  function renderBody(kit, state) {
    if (subTab === 'gens') return renderGens(kit, state);
    if (subTab === 'tree') return renderTree(kit, state);
    if (subTab === 'auto') return renderAuto(kit, state);
    if (subTab === 'ics') return renderICs(kit, state);
    if (subTab === 'stars') return renderStars(kit, state);
    return kit.el('div');
  }

  function render(container, state, kit) {
    container.innerHTML = '';
    var wrap = kit.el('div', { class: 'tab-body-inner inf-tab' });
    wrap.appendChild(renderHeader(kit, state));
    wrap.appendChild(renderSubTabRow(kit, state, container));
    wrap.appendChild(kit.el('div', { id: 'inf-subbody' }, [renderBody(kit, state)]));
    container.appendChild(wrap);
  }

  function update(container, state, kit) {
    var header = container.querySelector('#inf-header');
    var body = container.querySelector('#inf-subbody');
    if (!header || !body) {
      render(container, state, kit);
      return;
    }
    updateHeader(header, state);
    if (subTab === 'tree') updateTree(body, kit, state);
    else if (subTab === 'gens') updateGens(body, kit, state);
    else if (subTab === 'auto') updateAuto(body, kit, state);
    else if (subTab === 'ics') updateICs(body, kit, state);
    else if (subTab === 'stars') updateStars(body, kit, state);
  }

  // Lets Guide (Task 3) drive the ∞ sub-tab when a goal's target lives in a
  // specific one (Gens, ICs, Stars, ...). Only sets the in-memory selection;
  // the next render (kit.markDirty / the outer tab dispatch) picks it up.
  function setSubTab(id) {
    if (SUBTABS.some(function (t) { return t.id === id; })) {
      subTab = id;
      saveSubTab(id);
    }
  }
  function getSubTab() { return subTab; }

  window.InfinityUI = {
    render: render,
    update: update,
    setSubTab: setSubTab,
    getSubTab: getSubTab,
  };
})();
</script>
<script>// src/ui.js \u2014 DOM panel, buy modes, prestige/promotion/infinity screens,
// loop, save/load/offline. Only calls the Shared Engine API on window.Engine
// and window.Renderer.
(function () {
  'use strict';

  var SAVE_KEY = 'revidle.save.v1';
  var DOM_INTERVAL = 100; // ms, ~10Hz
  var AUTOSAVE_INTERVAL = 10000; // ms
  var OFFLINE_CAP_SEC = 8 * 3600;
  var CONFIRM_WINDOW = 3000; // ms

  var Engine = window.Engine;
  var Help = window.Help;

  var state = null;
  var renderer = null;
  var canvas = null;

  var buyMode = '1'; // '1' | '10' | 'max'
  var currentTab = 'circles';
  var dirty = true;
  var lastVisibleTabIds = '';
  var modalOpen = null; // 'offline' | 'infinity' | null

  var els = {};

  var TABS = [
    { id: 'circles', label: 'Circles', visible: function () { return true; } },
    {
      id: 'prestige',
      label: 'Prestige',
      visible: function (s) { return s.scoreLog >= 8 || s.stats.prestiges > 0; },
    },
    {
      id: 'promote',
      label: 'Promote',
      visible: function (s) {
        var pending = Engine.canPrestige(s) ? Engine.pendingPrestige(s).pMult : 0;
        if (s.pMult >= Engine.TUNE.promoMin || pending >= Engine.TUNE.promoMin) return true;
        for (var i = 0; i < s.promo.length; i++) if (s.promo[i] > 0) return true;
        return false;
      },
    },
    {
      id: 'infinity',
      label: '∞',
      visible: function (s) { return s.infinities >= 1 || s.inf.ipLog > -Infinity; },
    },
    { id: 'stats', label: 'Stats', visible: function () { return true; } },
    { id: 'settings', label: 'Settings', visible: function () { return true; } },
  ];

  var ICONS = {
    stats: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
    settings: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  };

  var PROMO_META = [
    { key: 'p1', name: 'Mult Gain' },
    { key: 'p2', name: 'Lap Speed' },
    { key: 'p3', name: 'Ascension Power' },
    { key: 'p4', name: 'Promotion Power' },
  ];

  // ---------- small helpers ----------

  function cloneState(s) {
    return Engine.deserialize(Engine.serialize(s));
  }

  function fmt(x) {
    return Engine.fmtLog(x);
  }

  // Formats a plain (non-log) count such as state.infinities: an integer
  // most of the time, but passive-Infinity upgrades (18;1) can make it
  // fractional, so it gets 2 decimals only then.
  function fmtInf(n) {
    var frac = Math.abs(n - Math.round(n)) > 1e-9;
    try {
      return n.toLocaleString('en-US', frac ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
    } catch (e) {
      return String(n);
    }
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        if (k === 'class') node.className = attrs[k];
        else if (k === 'html') node.innerHTML = attrs[k];
        else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') {
          node.addEventListener(k.slice(2), attrs[k]);
        } else if (attrs[k] === false || attrs[k] === null || attrs[k] === undefined) {
          // skip
        } else {
          node.setAttribute(k, attrs[k]);
        }
      }
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function fmtTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    var parts = [];
    if (h > 0) parts.push(h + 'h');
    if (h > 0 || m > 0) parts.push(m + 'm');
    parts.push(s + 's');
    return parts.join(' ');
  }

  function markDirty() {
    dirty = true;
  }

  function twoStepConfirm(btn, label, confirmLabel, action) {
    var confirming = false;
    var timer = null;
    btn.textContent = label;
    btn.addEventListener('click', function () {
      if (!confirming) {
        confirming = true;
        btn.textContent = confirmLabel;
        btn.classList.add('confirming');
        timer = setTimeout(function () {
          confirming = false;
          btn.textContent = label;
          btn.classList.remove('confirming');
        }, CONFIRM_WINDOW);
      } else {
        clearTimeout(timer);
        confirming = false;
        btn.textContent = label;
        btn.classList.remove('confirming');
        action();
      }
    });
  }

  // ---------- toast ----------

  var toastTimer = null;

  function toast(msg) {
    if (!els.toast) return;
    els.toast.textContent = msg;
    els.toast.hidden = false;
    requestAnimationFrame(function () { els.toast.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('show');
      setTimeout(function () { els.toast.hidden = true; }, 220);
    }, 2500);
  }

  // ---------- modal ----------

  function showModal(node) {
    els.modal.innerHTML = '';
    els.modal.appendChild(node);
    els.modal.hidden = false;
  }

  function hideModal() {
    els.modal.hidden = true;
    els.modal.innerHTML = '';
    modalOpen = null;
  }

  function showOfflineModal(info) {
    modalOpen = 'offline';
    // The run may have been reset while away (prestige/promote/Infinity), so
    // the end score can be lower than the start: logSub needs after > before
    // (it returns NaN otherwise), so only a real gain is shown as one.
    var gained = info.after > info.before;
    var scoreLine = gained
      ? ['Score gained', fmt(info.before === -Infinity ? info.after : Engine.logSub(info.after, info.before))]
      : ['Score now', fmt(info.after)];
    var lines = [
      el('p', { class: 'help' }, [
        'You were gone for ' + fmtTime(info.seconds) + '.',
      ]),
      el('p', { class: 'stat-line' }, [
        el('span', { class: 'label' }, [scoreLine[0]]),
        el('span', {}, [scoreLine[1]]),
      ]),
    ];
    if (info.ipGainedLog !== undefined && info.ipGainedLog !== -Infinity) {
      lines.push(el('p', { class: 'stat-line' }, [
        el('span', { class: 'label' }, ['IP gained']),
        el('span', {}, ['+' + fmt(info.ipGainedLog)]),
      ]));
    }
    if (info.infinitiesGained) {
      lines.push(el('p', { class: 'stat-line' }, [
        el('span', { class: 'label' }, ['Infinities']),
        el('span', {}, ['+' + fmtInf(info.infinitiesGained)]),
      ]));
    }
    if (info.icCompleted && info.icCompleted.length) {
      info.icCompleted.forEach(function (n) {
        lines.push(el('p', { class: 'help' }, ['Challenge ' + n + ' completed']));
      });
    }
    var panel = el('div', { class: 'modal-panel' },
      [el('h2', { class: 'modal-title' }, ['While you were away'])]
        .concat(lines)
        .concat([el('button', { class: 'btn primary full-width', onclick: hideModal }, ['Continue'])]));
    showModal(panel);
  }

  // Closes the Infinity modal even when goInfinite refuses (the score is no
  // longer at the cap), so its button can never be a dead end.
  function doGoInfinite() {
    var ok = Engine.goInfinite(state);
    if (!ok && !Engine.canInfinity(state)) state.inf.pendingConfirm = false;
    if (modalOpen === 'infinity') hideModal();
    if (ok) markDirty();
  }

  function showInfinityModal() {
    modalOpen = 'infinity';
    var s = state.stats;
    var isFirst = state.infinities === 0;
    var panel;
    if (isFirst) {
      panel = el('div', { class: 'modal-panel' }, [
        el('h2', { class: 'modal-title' }, ['Infinity reached']),
        el('p', { class: 'help' }, [
          'You gained 1 Infinity Point. Spend it in the new \u221e tab.',
        ]),
        el('button', {
          class: 'btn primary full-width',
          onclick: doGoInfinite,
        }, ['Go Infinite']),
      ]);
    } else {
      panel = el('div', { class: 'modal-panel' }, [
        el('h2', { class: 'modal-title' }, ['Infinity reached']),
        el('p', { class: 'help' }, [
          'Score has exceeded what a number can hold. Going infinite resets your ' +
            'progress and keeps your upgrades, generators and Infinity Points.',
        ]),
        el('div', { class: 'kv-list' }, [
          statLine('Play time', fmtTime(s.playTime)),
          statLine('Total laps', String(s.totalLaps)),
          statLine('Prestiges', String(s.prestiges)),
          statLine('Promotions', String(s.promotions)),
        ]),
        el('button', {
          class: 'btn primary full-width',
          onclick: doGoInfinite,
        }, ['Go Infinite']),
      ]);
    }
    showModal(panel);
  }

  // D15: shown once, the first time inf.ipLog crosses the Infinity cap.
  function showFinaleModal() {
    modalOpen = 'finale';
    var s = state.stats;
    var panel = el('div', { class: 'modal-panel' }, [
      el('h2', { class: 'modal-title' }, ['Eternity — coming soon']),
      el('div', { class: 'kv-list' }, [
        statLine('Play time', fmtTime(s.playTime)),
        statLine('Infinities', fmtInf(state.infinities)),
        statLine('Fastest Infinity', s.fastestInfinity === null ? '—' : fmtTime(s.fastestInfinity)),
      ]),
      el('button', {
        class: 'btn primary full-width',
        onclick: function () {
          state.inf.finaleSeen = true;
          save();
          hideModal();
        },
      }, ['Close']),
    ]);
    showModal(panel);
  }

  function statLine(label, value) {
    return el('div', { class: 'stat-line' }, [
      el('span', { class: 'label' }, [label]),
      el('span', {}, [value]),
    ]);
  }

  // Passed to InfinityUI so src/ui-infinity.js never touches window.Engine
  // for anything DOM/save-related; it only reads state and calls these.
  var kit = {
    el: el,
    fmt: fmt,
    toast: function (msg) { toast(msg); },
    twoStepConfirm: function (btn, label, confirmLabel, action) { twoStepConfirm(btn, label, confirmLabel, action); },
    statLine: statLine,
    markDirty: function () { markDirty(); },
    save: function () { save(); },
  };

  // ---------- multbar ----------

  function renderMultbar() {
    var frag = document.createDocumentFragment();
    var p = Engine.promoEffects(state);
    for (var i = 0; i < state.circles.length; i++) {
      var c = state.circles[i];
      if (!c.unlocked) continue;
      var def = Engine.CIRCLES[i];
      var chipAttrs = {
        class: 'chip',
        style: 'color:' + def.color + ';border-color:' + def.color,
        'data-tip': 'circleChip',
        'data-tip-i': String(i),
        tabindex: '0',
      };
      if (i === 0) chipAttrs['data-guide'] = 'multbar-red';
      var chip = el('span', chipAttrs, [
        '\u00D7' + fmt(c.multLog),
      ]);
      frag.appendChild(chip);
    }
    frag.appendChild(el('span', { class: 'chip grey', 'data-tip': 'pMultChip', 'data-guide': 'p-chip', tabindex: '0' }, ['P \u00D7' + fmt(Math.log10(state.pMult))]));
    if (state.pExp > 1) {
      frag.appendChild(el('span', { class: 'chip grey', 'data-tip': 'pExpChip', tabindex: '0' }, ['^' + state.pExp.toFixed(3)]));
    }
    if (state.inf.gpLog > 0) {
      frag.appendChild(el('span', { class: 'chip grey', 'data-tip': 'gpChip', tabindex: '0' }, ['GP ×' + fmt(Engine.gpMultLog(state))]));
    }
    if (state.inf.ic.active) {
      frag.appendChild(el('span', {
        class: 'chip', style: 'color:var(--warn);border-color:var(--warn)', 'data-tip': 'icChip', tabindex: '0',
      }, ['IC ' + state.inf.ic.active]));
    }
    if (state.infinities > 0) {
      frag.appendChild(el('span', { class: 'chip grey' }, ['\u221E ' + fmtInf(state.infinities)]));
    }
    els.multbarChips.innerHTML = '';
    els.multbarChips.appendChild(frag);
  }

  // ---------- scorebox ----------

  function updateScorebox() {
    els.score.textContent = fmt(state.scoreLog);
    var income = Engine.incomeLog(state);
    els.income.textContent = fmt(income) + ' /s';
  }

  // ---------- nav / tabs ----------

  function computeVisibleTabs() {
    return TABS.filter(function (t) { return t.visible(state); });
  }

  function syncFromHash() {
    var id = (location.hash || '#circles').replace('#', '');
    var visible = computeVisibleTabs().map(function (t) { return t.id; });
    currentTab = visible.indexOf(id) !== -1 ? id : 'circles';
    markDirty();
    renderNav();
  }

  function renderNav() {
    var visible = computeVisibleTabs();
    els.tabs.innerHTML = '';
    visible.forEach(function (t) {
      var attrs = {
        class: 'tab-btn',
        role: 'tab',
        'aria-selected': String(t.id === currentTab),
        onclick: function () { location.hash = '#' + t.id; },
      };
      if (t.id === 'promote') attrs['data-guide'] = 'promote-tab';
      // Only Stats/Settings get the label/icon pair the <420px media query
      // swaps between; other tabs keep a plain text child so that query
      // (which only targets .tab-label/.tab-icon) never touches them.
      var kids;
